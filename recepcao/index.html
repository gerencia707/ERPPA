<style>

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--texto);font-size:14px}
button{font-family:inherit;cursor:pointer}

.topbar .sp{flex:1}
.tb-btn{background:transparent;border:1px solid rgba(199,241,197,.35);color:var(--verde-claro);border-radius:7px;padding:6px 12px;font-size:12.5px;position:relative}

.btn:hover{background:#F2F5F2}
.btn.p{background:var(--verde-escuro);color:var(--verde-claro);border-color:var(--verde-escuro)}.btn.p:hover{background:var(--verde-mid)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);padding:8px 9px;border-bottom:1px solid var(--borda);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--borda);vertical-align:top}tr:last-child td{border-bottom:none}
.tw{overflow-x:auto}
.b{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;margin:1px 3px 1px 0;white-space:nowrap}
.b.ok{background:var(--ok-bg);color:var(--verde-mid)}.b.pend{background:var(--alerta-bg);color:var(--alerta)}.b.erro{background:var(--erro-bg);color:var(--erro)}.b.info{background:#EFF4EF;color:var(--suave)}.b.dk{background:var(--verde-escuro);color:var(--verde-claro)}

.err{background:var(--erro-bg);color:var(--erro);padding:9px 11px;border-radius:7px;font-size:13px;margin-top:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal .h{font-size:10.5px;text-transform:uppercase;color:var(--suave);text-align:center;padding:4px 0}
.cal .c{border:1px solid var(--borda);border-radius:7px;min-height:62px;padding:4px 6px;background:#fff;text-align:left;font-size:12px;position:relative}.cal .c.o{background:#F4F6F4;color:#9AA7A0}.cal .c.t{border-color:var(--verde-mid)}.cal .c.s{background:var(--verde-claro)}
.cal .c .ev{display:block;background:var(--verde-escuro);color:var(--verde-claro);border-radius:4px;font-size:10.5px;padding:1px 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--borda);align-items:center}.chk .opt{display:flex;gap:4px}.chk .opt button{padding:5px 9px;font-size:12px;border:1px solid var(--borda);background:#fff;border-radius:6px}.chk .opt button.on.c{background:var(--ok-bg);border-color:var(--sage);font-weight:700}.chk .opt button.on.n{background:var(--erro-bg);border-color:#E7C3B8;font-weight:700}.chk .opt button.on.a{background:#EFF4EF;font-weight:700}
.bar{height:8px;background:#EFF4EF;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--verde-mid)}
@media(max-width:560px){.brand small,.chip,.tb-link{display:none}.topbar{gap:8px;padding:0 12px}}
/* niveis: identidade visual */

.side button .ico{opacity:.8}.side button.on .ico{opacity:1}
.side .gh{margin:18px 2px 6px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.06);border-left:4px solid var(--gc);display:flex;align-items:center;gap:10px}

.side .gE{--gc:var(--cE)}.side .gG{--gc:var(--cG)}.side .gS{--gc:var(--cS)}
.side .sep{height:1px;background:rgba(199,241,197,.18);margin:8px 6px}
.side .rst{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#F1C9D2;display:flex;align-items:center;gap:4px;margin-left:auto}.side .rst .ico{width:11px;height:11px}
.nvl{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;border-radius:20px;padding:3px 10px 3px 7px;background:var(--gc);margin-bottom:8px}.nvl .ico{width:13px;height:13px}
.chip{display:flex;align-items:center;gap:9px}.chip .nvl{margin:0;padding:2px 8px 2px 5px;font-size:10px;color:#fff}
.nE{--gc:var(--cE)}.nG{--gc:var(--cG)}.nS{--gc:var(--cS)}
main.mE .vh h2{border-left:4px solid var(--cE);padding-left:10px}main.mG .vh h2{border-left:4px solid var(--cG);padding-left:10px}main.mS .vh h2{border-left:4px solid var(--cS);padding-left:10px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.lvls .lv{background:#fff;border:1px solid var(--borda);border-top:4px solid var(--gc);border-radius:var(--r);padding:12px 14px}.lvls .lv.me{box-shadow:0 0 0 2px var(--gc)}.lvls .lv.off{opacity:.55}
.lvls .lv h4{margin:6px 0 2px;font-size:13px;color:var(--verde-escuro)}.lvls .lv p{margin:0;font-size:12px;color:var(--suave);line-height:1.4}
@media(max-width:700px){.lvls{grid-template-columns:1fr}}
@media print{.topbar,.side,.tools,.noprint{display:none!important}main{padding:0;max-width:none}.card{border:none;padding:0}body{background:#fff}}

<script>
// ============================================================
// CONFIG / CONEXÃO  (login por token — mesmo padrão do DP)
// ============================================================
const SB_URL='https://xdnnngifpbrbhxyluans.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkbm5uZ2lmcGJyYmh4eWx1YW5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2ODgwODQsImV4cCI6MjA5NjI2NDA4NH0.1HmvUOo56BhCdLTjJH3UfTMkq8uO7-EK_zg3W0hX46A';
const TK='rec_token_v1';
let TOKEN=localStorage.getItem(TK)||'';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},
  global:{fetch:(u,o={})=>{const h=new Headers(o.headers||{});if(TOKEN)h.set('x-rec-token',TOKEN);return fetch(u,{...o,headers:h});}}});

// ============================================================
// UTILIDADES
// ============================================================
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fdata=d=>{if(!d)return '—';const s=String(d);return s.length>10?new Date(s).toLocaleDateString('pt-BR'):s.split('-').reverse().join('/')};
const fdh=d=>d?new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
const fhora=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const nl2=s=>esc(s).replace(/\n/g,'<br>');
const isoLocal=(d,h)=>new Date(`${d}T${h}`).toISOString();
const dLocal=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const hLocal=iso=>{const d=new Date(iso);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),t==='erro'?6000:2600)}
function msgErro(e){let m=(e&&e.message)||(e&&e.details)||(typeof e==='string'?e:(e&&e.code?'Erro '+e.code:'Falha na operação'));if(typeof m!=='string')m=JSON.stringify(m);if(/row-level security|permission denied/i.test(m))return 'Sem permissão para esta ação (verifique seu perfil ou faça login novamente).';return m}
async function q(p){const {data,error}=await p;if(error)throw error;return data}
async function safe(fn){try{return await fn()}catch(e){console.error(e);toast(msgErro(e),'erro')}}
function badge(st){const s=String(st||'');
  let c='info';
  if(/^(Conclu|Resolvid|Entregue|Devolvido|Respondida|Recuperado|Executada|Publicada|Aprovada|Encerrad|confirmado|Ativo)/i.test(s))c='ok';
  else if(/^(Pendente|Aberta|aberto|Nova|Solicitada|Planejada|Encontrado|Em |Aguardando|Armazenado|Hóspede|Ação|fechado|Parcial|Rascunho)/i.test(s))c='pend';
  else if(/^(Recusada|Não recuperado|Alta|Crítica|Urgente)/i.test(s))c='erro';
  return `<span class="b ${c}">${esc(s)}</span>`}
function prioB(p){return /Urgente|Alta|Crítica/.test(p)?`<span class="b erro">${esc(p)}</span>`:`<span class="b info">${esc(p||'—')}</span>`}
const ACT={};          // ações chamadas por onclick
let S={user:null,equipe:[],view:'',prefs:{}};
const nivelNome=n=>({1:'Equipe',2:'Guest',3:'Supervisor'}[n]);

// ---------- Modal ----------
function modal(html,lg){closeModal();const bg=document.createElement('div');bg.className='modal-bg';bg.id='modalBg';bg.innerHTML=`<div class="modal ${lg?'lg':''}">${html}</div>`;bg.addEventListener('mousedown',e=>{if(e.target===bg)closeModal()});document.body.appendChild(bg);return bg}
function closeModal(){const m=$('#modalBg');if(m)m.remove()}
ACT.fechar=closeModal;

// ---------- Formulário genérico ----------
function campoHTML(c,v){
  const id='f_'+c.k, val=v??'';
  const full=(c.t==='textarea'||c.full)?' full':'';
  let inp='';
  if(c.t==='textarea')inp=`<textarea id="${id}" placeholder="${esc(c.ph||'')}">${esc(val)}</textarea>`;
  else if(c.t==='select'||c.t==='resp'){
    let opts=c.t==='resp'?['',...S.equipe.map(e=>e.nome)]:(typeof c.opts==='function'?c.opts():c.opts);
    if(c.t==='resp'&&val&&!opts.includes(val))opts.push(val);
    if(c.t==='select'&&val&&!opts.some(o=>String(typeof o==='object'?o.v:o)===String(val)))opts=[...opts,val];
    inp=`<select id="${id}">${opts.map(o=>{const ov=typeof o==='object'?o.v:o,ol=typeof o==='object'?o.l:(o||'—');return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  }
  else if(c.t==='check')return `<div class="${full}"><label style="display:flex;gap:8px;align-items:center;margin-top:20px;color:var(--texto);font-size:13.5px"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(c.l)}</label></div>`;
  else inp=`<input id="${id}" type="${c.t==='datetime'?'datetime-local':(c.t||'text')}" value="${esc(c.t==='datetime'&&val?dLocal(val)+'T'+hLocal(val):val)}" placeholder="${esc(c.ph||'')}" ${c.step?`step="${c.step}"`:''}>`;
  return `<div class="${full.trim()}"><label for="${id}">${esc(c.l)}${c.req?' *':''}</label>${inp}</div>`;
}
function lerForm(campos){
  const o={};
  for(const c of campos){const e=$('#f_'+c.k);if(!e)continue;
    if(c.t==='check')o[c.k]=e.checked;
    else if(c.t==='number')o[c.k]=e.value===''?null:Number(e.value);
    else if(c.t==='datetime')o[c.k]=e.value===''?null:new Date(e.value).toISOString();
    else if(c.t==='date'||c.t==='resp')o[c.k]=e.value===''?null:e.value;
    else o[c.k]=e.value.trim();
  }
  return o;
}
function abrirForm({titulo,campos,valores={},salvar,extra='',lg}){
  const h=`<h3>${esc(titulo)}</h3>${extra}<div class="ff">${campos.map(c=>campoHTML(c,valores[c.k])).join('')}</div>
  <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="ACT.fechar()">Cancelar</button><button class="btn p" id="btnSalvarForm">Salvar</button></div>`;
  modal(h,lg);
  $('#btnSalvarForm').onclick=()=>safe(async()=>{
    const o=lerForm(campos);
    for(const c of campos)if(c.req&&(o[c.k]===''||o[c.k]==null)){toast('Preencha: '+c.l,'erro');return}
    $('#btnSalvarForm').disabled=true;
    try{await salvar(o);closeModal()}catch(e){$('#btnSalvarForm').disabled=false;throw e}
  });
}

// ============================================================
// COMENTÁRIOS + HISTÓRICO (estruturas compartilhadas)
// ============================================================
async function blocoComentarios(modulo,ref){
  const cs=await q(sb.from('rec_comentarios').select('*').eq('modulo',modulo).eq('ref_id',String(ref)).order('criado_em'));
  const hs=await q(sb.from('rec_historico').select('*').eq('modulo',modulo).eq('ref_id',String(ref)).order('id',{ascending:false}).limit(60));
  const ign=['id','criado_em','autor','atualizado_em'];

const MODS={};
function regMod(M){MODS[M.tabela]=M;return M}
function valorCampo(M,r,c){const v=r[c.k];if(c.t==='check')return v?'Sim':'Não';if(c.t==='date')return fdata(v);if(c.t==='datetime')return fdh(v);if(v==null||v==='')return '—';return nl2(v)}
async function renderMod(M){
  const main=$('#main');
  M._f=M._f||{q:'',st:'',ex:{}};
  if(S.filtro&&S.filtro.st!==undefined){M._f.st=S.filtro.st;S.filtro=null}
  main.innerHTML=`<div class="vh"><div><h2>${esc(M.titulo)}</h2><div class="d">${esc(M.desc||'')}</div></div><div class="row noprint">${M.extraBtns?M.extraBtns():''}${S.user.nivel>=(M.escrita||1)&&!M.semNovo?`<button class="btn p" onclick="ACT.novo('${M.tabela}')">+ ${esc(M.novoLabel||'Novo')}</button>`:''}</div></div>
   ${M.abas?M.abas():''}<div id="modTopo"></div>
   <div class="tools"><input class="grow" id="mq" placeholder="Buscar..." value="${esc(M._f.q)}">
   ${M.statusOpts?`<select id="mst"><option value="">Todos os status</option>${M.statusOpts.map(s=>`<option ${M._f.st===s?'selected':''}>${esc(s)}</option>`).join('')}${M.statusAbertos?`<option value="__abertos" ${M._f.st==='__abertos'?'selected':''}>Somente em aberto</option>`:''}</select>`:''}
   ${M.campoData?`<input type="date" id="dtDe" title="De" value="${M._f.de||''}"><input type="date" id="dtAte" title="Até" value="${M._f.ate||''}">`:''}
   ${(M.filtros||[]).map(f=>`<select data-fx="${f.k}"><option value="">${esc(f.l)}: todos</option>${f.opts.map(o=>`<option ${M._f.ex[f.k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`).join('')}</div>
   <div class="card" style="padding:6px 10px"><div class="tw" id="modBody"><div class="empty">Carregando...</div></div></div>`;
  await carregarMod(M);
  $('#mq').oninput=e=>{M._f.q=e.target.value;desenharMod(M)};
  if(M.campoData){$('#dtDe').onchange=e=>{M._f.de=e.target.value;desenharMod(M)};$('#dtAte').onchange=e=>{M._f.ate=e.target.value;desenharMod(M)}}
  const st=$('#mst');if(st)st.onchange=e=>{M._f.st=e.target.value;desenharMod(M)};
  main.querySelectorAll('[data-fx]').forEach(s=>s.onchange=e=>{M._f.ex[s.dataset.fx]=e.target.value;desenharMod(M)});
}
async function carregarMod(M){
  try{M._rows=await q(sb.from(M.tabela).select('*').order(M.ordem[0],{ascending:M.ordem[1]}).limit(1500));}catch(e){$('#modBody').innerHTML=`<div class="empty">Erro: ${esc(msgErro(e))}</div>`;return}
  if(M.preparar)await M.preparar(M._rows);
  desenharMod(M);
}
function filtrar(M){
  const t=norm(M._f.q);
  return M._rows.filter(r=>{
    if(M._f.st==='__abertos'){if(M.statusAbertos&&!M.statusAbertos.includes(r[M.statusField]))return false}
    else if(M._f.st&&r[M.statusField]!==M._f.st)return false;
    if(M.campoData){const dv=String(r[M.campoData]||'').slice(0,10);if(M._f.de&&dv<M._f.de)return false;if(M._f.ate&&dv>M._f.ate)return false}
    for(const [k,v] of Object.entries(M._f.ex))if(v&&r[k]!==v)return false;
    if(t&&!norm((M.busca||[]).map(k=>r[k]).join(' ')).includes(t))return false;
    return true});
}
function desenharMod(M){
  const rows=filtrar(M);
  if($('#modTopo'))$('#modTopo').innerHTML=M.topo?M.topo(M._rows):'';
  const podeEsc=S.user.nivel>=(M.escrita||1);
  $('#modBody').innerHTML=rows.length?`<table><thead><tr>${M.colunas.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${M.colunas.map(c=>`<td>${c.f(r)}</td>`).join('')}<td style="white-space:nowrap;text-align:right">
    ${M.acoes?M.acoes(r):''}
    ${M.statusOpts&&!M.statusLocked&&podeEsc?`<select style="width:auto;padding:4px 6px;font-size:12px" onchange="ACT.st('${M.tabela}','${r.id}',this.value)">${M.statusOpts.map(s=>`<option ${s===r[M.statusField]?'selected':''}>${esc(s)}</option>`).join('')}</select>`:''}
    <button class="lnk" onclick="ACT.det('${M.tabela}','${r.id}')">Abrir</button>${podeEsc?`<button class="lnk" onclick="ACT.edit('${M.tabela}','${r.id}')">Editar</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum registro.</div>';
}
function camposDe(M,r){return typeof M.campos==='function'?M.campos(r):M.campos}
ACT.novo=tab=>safe(async()=>{const M=MODS[tab];if(M.preNovo)await M.preNovo();
  abrirForm({titulo:'Novo — '+M.titulo,campos:camposDe(M),valores:{...(M.novoValores?M.novoValores():{}),...(S.prefill||{})},lg:M.lg,extra:M.formExtra?M.formExtra():'',salvar:async o=>{S.prefill=null;await salvarMod(M,o,null)}})});
ACT.edit=(tab,id)=>safe(async()=>{const M=MODS[tab];const r=M._rows.find(x=>x.id===id);
  abrirForm({titulo:'Editar — '+M.titulo,campos:camposDe(M,r),valores:r,lg:M.lg,salvar:async o=>{await salvarMod(M,o,r)}})});
async function salvarMod(M,o,r){
  if(M.antesSalvar)o=await M.antesSalvar(o,r)||o;
  let saved;
  if(r){saved=await q(sb.from(M.tabela).update(o).eq('id',r.id).select().single())}
  else{saved=await q(sb.from(M.tabela).insert(o).select().single())}
  toast('Salvo.');
  if(M.depois)await M.depois(saved,r);
  await carregarMod(M);refreshBadges();
}
ACT.st=(tab,id,val)=>safe(async()=>{const M=MODS[tab];const r=M._rows.find(x=>x.id===id);let up={[M.statusField]:val};if(M.aoStatus)up={...up,...(await M.aoStatus(r,val))};
  await q(sb.from(tab).update(up).eq('id',id));toast('Status atualizado.');if(M.depois)await M.depois({...r,...up},r);await carregarMod(M);refreshBadges()});
ACT.det=(tab,id)=>safe(async()=>{const M=MODS[tab];const r=M._rows.find(x=>x.id===id);
  const cs=camposDe(M,r);
  const corpo=`<div class="ff" style="margin-bottom:6px">${cs.filter(c=>c.t!=='check'||true).map(c=>`<div class="${(c.t==='textarea'||c.full)?'full':''}"><label>${esc(c.l)}</label><div>${valorCampo(M,r,c)}</div></div>`).join('')}
   <div><label>Status</label><div>${r[M.statusField]?badge(r[M.statusField]):'—'}</div></div><div><label>Registrado por</label><div>${esc(r.autor||'—')} · ${fdh(r.criado_em)}</div></div></div>${M.detExtra?await M.detExtra(r):''}`;
  await abrirDetalhe(tab,id,(r[M.tituloCampo||'titulo']||r.hospede||r.item||M.titulo),corpo,true)});
ACT.del=(tab,id)=>safe(async()=>{if(!confirm('Excluir este registro? Não pode ser desfeito.'))return;await q(sb.from(tab).delete().eq('id',id));toast('Excluído.');await carregarMod(MODS[tab])});

async function refreshBadges(){

  try{const kd=await sb.from('rec_conhecimento').select('id,versao').eq('ativo',true).eq('leitura_obrigatoria',true);const kl=await sb.from('rec_conhecimento_leituras').select('doc_id,versao').eq('usuario_id',S.user.id);const ks=new Set((kl.data||[]).map(x=>x.doc_id+'|'+x.versao));b.conhecimento=(kd.data||[]).filter(d=>!ks.has(d.id+'|'+d.versao)).length}catch(e){}

const CAT_MURAL=['Aviso','Escala','Procedimento','Hóspede VIP','Evento','Operacional','Outros'];
async function viewMural(){
  const main=$('#main'),hoje=hojeISO(),n=S.user.nivel;
  const f=S.muralF=S.muralF||{cat:'',arq:false};
  const [rows,lid]=await Promise.all([q(sb.from('rec_mural').select('*').order('criado_em',{ascending:false}).limit(300)),q(sb.from('rec_mural_leituras').select('mural_id,usuario_id,nome,lido_em'))]);
  S.mural={rows,lid};
  const meus=new Set(lid.filter(l=>l.usuario_id===S.user.id).map(l=>l.mural_id));
  const vis=rows.filter(m=>(f.arq?true:m.ativo&&(!m.expira_em||m.expira_em>=hoje))&&(!f.cat||m.categoria===f.cat)).sort((a,b)=>(b.fixado-a.fixado)||(a.criado_em<b.criado_em?1:-1));
  const totEq=S.equipe.length;
  main.innerHTML=`<div class="vh"><div><h2>Mural da Recepção</h2><div class="d">Avisos da equipe com fixação, validade, confirmação de leitura e comentários.</div></div>${n>=2?`<button class="btn p" onclick="ACT.muralForm()">+ Novo aviso</button>`:''}</div>
  <div class="tools"><select id="mcat"><option value="">Todas as categorias</option>${CAT_MURAL.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>${n>=2?`<label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="marq" ${f.arq?'checked':''}> Mostrar expirados/arquivados</label>`:''}</div>
  ${vis.length?vis.map(m=>{const lido=meus.has(m.id),ls=lid.filter(l=>l.mural_id===m.id),exp=m.expira_em&&m.expira_em<hoje;
   return `<div class="item ${m.fixado?'fix':''} ${m.leitura_obrigatoria&&!lido&&m.ativo&&!exp?'alert':''}"><div class="row sb"><h4>${m.fixado?'[Fixado] ':''}${esc(m.titulo)}</h4><div>${badge(m.categoria).replace(/class="b [a-z]+"/,'class="b dk"')}${m.leitura_obrigatoria?'<span class="b pend">Leitura obrigatória</span>':''}${!m.ativo?'<span class="b info">Arquivado</span>':''}${exp?'<span class="b info">Expirado</span>':''}</div></div>
   <div class="tx">${nl2(m.texto)}</div><div class="row sb"><div class="sub">${esc(m.autor||'—')} · ${fdh(m.criado_em)}${m.expira_em?' · válido até '+fdata(m.expira_em):''}${n>=2?` · lido por ${new Set(ls.map(l=>l.usuario_id)).size} de ${totEq}`:''}</div>
   <div class="row">${lido?`<span class="b ok">Leitura confirmada</span>`:`<button class="btn sm p" onclick="ACT.muralLer('${m.id}')">Confirmar leitura</button>`}<button class="btn sm" onclick="ACT.muralCom('${m.id}')">Comentários</button>${n>=2?`<button class="btn sm" onclick="ACT.muralQuem('${m.id}')">Quem leu</button><button class="btn sm" onclick="ACT.muralFix('${m.id}')">${m.fixado?'Desafixar':'Fixar'}</button><button class="btn sm" onclick="ACT.muralForm('${m.id}')">Editar</button><button class="btn sm" onclick="ACT.muralArq('${m.id}')">${m.ativo?'Arquivar':'Reativar'}</button>`:''}${n>=3?`<button class="btn sm d" onclick="ACT.muralDel('${m.id}')">Excluir</button>`:''}</div></div></div>`}).join(''):'<div class="card empty">Nenhum aviso no mural.</div>'}`;
  $('#mcat').onchange=e=>{f.cat=e.target.value;viewMural()};const ma=$('#marq');if(ma)ma.onchange=e=>{f.arq=e.target.checked;viewMural()};
}
ACT.muralLer=id=>safe(async()=>{await q(sb.from('rec_mural_leituras').insert({mural_id:id,usuario_id:S.user.id,nome:S.user.nome}));toast('Leitura confirmada.');await viewMural();refreshBadges()});
ACT.muralCom=id=>safe(async()=>{const m=S.mural.rows.find(x=>x.id===id);await abrirDetalhe('rec_mural',id,m.titulo,`<div class="tx" style="white-space:pre-wrap">${nl2(m.texto)}</div>`)});
ACT.muralFix=id=>safe(async()=>{const m=S.mural.rows.find(x=>x.id===id);await q(sb.from('rec_mural').update({fixado:!m.fixado}).eq('id',id));viewMural()});
ACT.muralArq=id=>safe(async()=>{const m=S.mural.rows.find(x=>x.id===id);await q(sb.from('rec_mural').update({ativo:!m.ativo}).eq('id',id));viewMural()});
ACT.muralDel=id=>safe(async()=>{if(!confirm('Excluir este aviso e as confirmações de leitura?'))return;await q(sb.from('rec_mural').delete().eq('id',id));viewMural()});
ACT.muralQuem=id=>{const m=S.mural.rows.find(x=>x.id===id);const ls=S.mural.lid.filter(l=>l.mural_id===id);const lidos=new Set(ls.map(l=>l.usuario_id));
  modal(`<h3>Leitura — ${esc(m.titulo)}</h3><div class="grid g2"><div><b>Leram (${lidos.size})</b>${ls.map(l=>`<div class="sub" style="padding:3px 0">${esc(l.nome)} · ${fdh(l.lido_em)}</div>`).join('')||'<div class="sub">Ninguém ainda.</div>'}</div>
  <div><b>Ainda não leram (${S.equipe.filter(e=>!lidos.has(e.id)).length})</b>${S.equipe.filter(e=>!lidos.has(e.id)).map(e=>`<div class="sub" style="padding:3px 0">${esc(e.nome)} <span class="b info">${nivelNome(e.nivel)}</span></div>`).join('')||'<div class="sub">Todos leram.</div>'}</div></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="ACT.fechar()">Fechar</button></div>`)};
ACT.muralForm=id=>{const m=id?S.mural.rows.find(x=>x.id===id):{categoria:'Aviso'};
  abrirForm({titulo:id?'Editar aviso':'Novo aviso',valores:m,campos:[{k:'titulo',l:'Título',req:1,full:1},{k:'categoria',l:'Categoria',t:'select',opts:CAT_MURAL},{k:'expira_em',l:'Válido até (opcional)',t:'date'},{k:'texto',l:'Mensagem',t:'textarea',req:1},{k:'fixado',l:'Fixar no topo',t:'check'},{k:'leitura_obrigatoria',l:'Leitura obrigatória',t:'check'}],
   salvar:async o=>{if(id)await q(sb.from('rec_mural').update(o).eq('id',id));else await q(sb.from('rec_mural').insert(o));toast('Aviso salvo.');await viewMural();refreshBadges()}})};

const CAT_KB=['Procedimentos','Políticas do hotel','Sistema de reservas','Atendimento ao hóspede','Segurança','Contatos úteis','Passeios e região','Outros'];
const STOP=new Set('para como qual quais onde quando que com uma uns umas dos das nos nas por pelo pela sobre isso esse essa este esta ser tem ter fazer faco devo posso preciso the'.split(' '));
async function viewConhecimento(){
  const main=$('#main'),n=S.user.nivel,f=S.kbF=S.kbF||{q:'',cat:'',fav:false};
  const [docs,leit,fav]=await Promise.all([q(sb.from('rec_conhecimento').select('*').eq('ativo',true).order('titulo')),q(sb.from('rec_conhecimento_leituras').select('doc_id,versao').eq('usuario_id',S.user.id)),q(sb.from('rec_favoritos').select('doc_id'))]);
  S.kb={docs,leit:new Set(leit.map(l=>l.doc_id+'|'+l.versao)),fav:new Set(fav.map(x=>x.doc_id))};
  main.innerHTML=`<div class="vh"><div><h2>Base de Conhecimento</h2><div class="d">Procedimentos e informações do hotel, com versões, leitura obrigatória e busca por palavra-chave.</div></div>${n>=2?`<button class="btn p" onclick="ACT.kbForm()">+ Novo documento</button>`:''}</div>
  <div class="card"><h3>Assistente de Consulta</h3><div class="note">Responde somente com trechos dos documentos cadastrados abaixo (busca por relevância — não usa IA generativa, então nunca inventa informação).</div>
  <div class="row"><input id="kbPerg" style="flex:1" placeholder="Ex.: qual o horário do café da manhã? como fazer late check-out?"><button class="btn p" onclick="ACT.kbConsulta()">Consultar</button></div><div id="kbResp"></div></div>
  <div class="tools"><input class="grow" id="kbq" placeholder="Buscar por palavra-chave..." value="${esc(f.q)}"><select id="kbcat"><option value="">Todas as categorias</option>${CAT_KB.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="kbfav" ${f.fav?'checked':''}> Só favoritos</label></div><div id="kbLista"></div>`;
  $('#kbPerg').onkeydown=e=>{if(e.key==='Enter')ACT.kbConsulta()};
  $('#kbq').oninput=e=>{f.q=e.target.value;kbDesenhar()};$('#kbcat').onchange=e=>{f.cat=e.target.value;kbDesenhar()};$('#kbfav').onchange=e=>{f.fav=e.target.checked;kbDesenhar()};
  kbDesenhar();
}
function kbDesenhar(){const f=S.kbF,t=norm(f.q);
  const ds=S.kb.docs.filter(d=>(!f.cat||d.categoria===f.cat)&&(!f.fav||S.kb.fav.has(d.id))&&(!t||norm(d.titulo+' '+d.palavras_chave+' '+d.conteudo).includes(t)));
  $('#kbLista').innerHTML=ds.length?ds.map(d=>{const lido=S.kb.leit.has(d.id+'|'+d.versao);return `<div class="item ${d.leitura_obrigatoria&&!lido?'alert':''}"><div class="row sb"><h4>${S.kb.fav.has(d.id)?'[Favorito] ':''}${esc(d.titulo)}</h4><div><span class="b dk">${esc(d.categoria)}</span><span class="b info">v${d.versao}</span>${d.leitura_obrigatoria?(lido?'<span class="b ok">Leitura obrigatória: ok</span>':'<span class="b pend">Leitura obrigatória pendente</span>'):''}</div></div>
   <div class="sub" style="margin:4px 0 8px">${esc(d.conteudo.replace(/\s+/g,' ').slice(0,150))}...</div><div class="row"><button class="btn sm p" onclick="ACT.kbAbrir('${d.id}')">Abrir</button><button class="btn sm" onclick="ACT.kbFav('${d.id}')">${S.kb.fav.has(d.id)?'Remover favorito':'Favoritar'}</button>${S.user.nivel>=2?`<button class="btn sm" onclick="ACT.kbForm('${d.id}')">Editar</button><button class="btn sm" onclick="ACT.kbArq('${d.id}')">Arquivar</button>`:''}</div></div>`}).join(''):'<div class="card empty">Nenhum documento encontrado.</div>'}
ACT.kbFav=id=>safe(async()=>{if(S.kb.fav.has(id))await q(sb.from('rec_favoritos').delete().eq('doc_id',id).eq('usuario_id',S.user.id));else await q(sb.from('rec_favoritos').insert({doc_id:id,usuario_id:S.user.id}));await viewConhecimento()});
ACT.kbArq=id=>safe(async()=>{if(!confirm('Arquivar este documento?'))return;await q(sb.from('rec_conhecimento').update({ativo:false}).eq('id',id));await viewConhecimento()});
ACT.kbAbrir=id=>safe(async()=>{const d=S.kb.docs.find(x=>x.id===id);const lido=S.kb.leit.has(d.id+'|'+d.versao);
  const vs=await q(sb.from('rec_conhecimento_versoes').select('*').eq('doc_id',id).order('versao',{ascending:false}));
  modal(`<h3>${esc(d.titulo)} <span class="b info">v${d.versao}</span></h3><div class="sub">${esc(d.categoria)} · atualizado ${fdh(d.atualizado_em)} · ${esc(d.autor||'')}</div><div class="tx" style="white-space:pre-wrap;margin:14px 0;font-size:14px;line-height:1.55">${nl2(d.conteudo)}</div>
  ${vs.length>1?`<details><summary class="sub" style="cursor:pointer">Histórico de versões (${vs.length})</summary>${vs.map(v=>`<details style="margin:6px 0 6px 12px"><summary class="sub">v${v.versao} · ${fdh(v.criado_em)} · ${esc(v.autor||'')}</summary><div class="tx" style="white-space:pre-wrap;font-size:13px">${nl2(v.conteudo)}</div></details>`).join('')}</details>`:''}
  <div class="row" style="justify-content:flex-end;margin-top:16px">${lido?'<span class="b ok">Leitura da v'+d.versao+' confirmada</span>':`<button class="btn p" onclick="ACT.kbLer('${d.id}',${d.versao})">Marcar como lido (v${d.versao})</button>`}<button class="btn" onclick="ACT.fechar()">Fechar</button></div>`,true)});

ACT.kbConsulta=()=>{const p=$('#kbPerg').value.trim();if(!p)return;
  const tk=norm(p).split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w));const out=$('#kbResp');
  if(!tk.length){out.innerHTML='<div class="note" style="margin-top:12px">Escreva uma pergunta com palavras-chave.</div>';return}
  const stem=w=>w.length>5?w.slice(0,w.length-1):w;
  const res=S.kb.docs.map(d=>{let sc=0;const nt=norm(d.titulo),nk=norm(d.palavras_chave);
    const pars=d.conteudo.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>3).map(x=>{const nx=norm(x);const s=tk.filter(w=>nx.includes(stem(w))).length;return {x,s}});
    tk.forEach(w=>{if(nt.includes(stem(w)))sc+=3;if(nk.includes(stem(w)))sc+=2});
    const best=pars.filter(p=>p.s>0).sort((a,b)=>b.s-a.s).slice(0,2);sc+=best.reduce((a,b)=>a+b.s,0);return {d,sc,best}}).filter(r=>r.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,3);
  out.innerHTML=res.length?res.map(r=>`<div class="item" style="margin-top:10px"><div class="row sb"><b>${esc(r.d.titulo)}</b><span class="b dk">${esc(r.d.categoria)} · v${r.d.versao}</span></div>${r.best.map(b=>`<div class="tx" style="margin:6px 0">"${esc(b.x.slice(0,320))}"</div>`).join('')||'<div class="sub">Documento relacionado ao tema.</div>'}<button class="btn sm" onclick="ACT.kbAbrir('${r.d.id}')">Abrir documento completo</button></div>`).join(''):'<div class="note" style="margin-top:12px">Não encontrei isso nos documentos cadastrados. Peça ao Supervisor/Guest para cadastrar o procedimento.</div>'};

const _reCache={};
function lexRe(base,extra){const k=(base===POS_BASE?'p':'n')+'|'+extra;if(_reCache[k])return _reCache[k];const ex=String(extra||'').split(/[,\n;]/).map(x=>norm(x).trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).filter(Boolean);return _reCache[k]=new RegExp('\\b(?:'+base.concat(ex).join('|')+')','g')}
const NEGADOR=/(?:^|[\s,])(nao|nunca|nada|sem|nem|jamais|not|never|no|ni|tampoco|didnt|wasnt|isnt|dont)\s+(?:[^\s,;:]+\s+)?$/;
function detectarIdioma(t){const x=' '+norm(t)+' ';const c=re=>(x.match(re)||[]).length;
  const pt=c(/ (nao|muito|uma|foi|quarto|cafe|equipe|voce|voces|com|para|nosso|ficamos|estadia|hotel) /g),es=c(/ (el|los|las|muy|una|fue|habitacion|desayuno|pero|estuvo|nos|hemos|hotel) /g),en=c(/ (the|and|was|very|with|our|room|breakfast|staff|were|is|we|stay) /g);
  if(en>pt&&en>=es&&en>=2)return 'en';if(es>pt&&es>en&&es>=2)return 'es';return 'pt'}
function analisarTexto(txt){
  const R=reputCfg();const t=norm(txt);const NEG=lexRe(NEG_BASE,R.neg_extra),POS=lexRe(POS_BASE,R.pos_extra);
  const clauses=t.split(/[.!?\n;]+|\b(?:mas|porem|entretanto|contudo|but|however|pero|aunque)\b/).map(s=>s.trim()).filter(Boolean);
  let pos=0,neg=0;const tm={};
  for(const c of clauses){let p=0,n=0;
    let s=c.replace(NEG,(m,off)=>{if(NEGADOR.test(c.slice(Math.max(0,off-32),off)))p++;else n++;return ' '.repeat(m.length)});
    s.replace(POS,(m,off)=>{if(NEGADOR.test(c.slice(Math.max(0,off-32),off)))n++;else p++;return m});
    pos+=p;neg+=n;const net=p-n;
    if(net!==0)for(const [id,re] of TEMAS)if(re.test(c))tm[id]=(tm[id]||0)+Math.sign(net)}
  const temas=Object.entries(tm).filter(([,v])=>v!==0).map(([id,v])=>id+(v>0?'+':'-'));
  return {pos,neg,temas,crit:CRIT_RE.test(t),lang:detectarIdioma(txt)}
}
const somaDias=(iso,d)=>{const x=new Date((iso||hojeISO())+'T12:00:00');x.setDate(x.getDate()+d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
function classificarAv(av){
  const R=reputCfg();const nota=av.nota!==''&&av.nota!=null?Number(av.nota):null;const max=Number(av.nota_max)||5;
  const n5=nota!=null&&!isNaN(nota)?nota/max*5:null;
  const tx=analisarTexto((av.titulo?av.titulo+'. ':'')+(av.texto||''));const flags=[];let s;
  if(n5!=null){
    s=n5>=R.pos_min?'Positiva':n5>=R.neu_min?'Neutra':'Negativa';
    if(s==='Positiva'&&tx.neg>=2&&tx.neg>=tx.pos){s='Neutra';flags.push('Nota alta, mas o texto traz críticas')}
    else if(s==='Positiva'&&tx.neg>=1)flags.push('Elogio com ressalva');
    if(s==='Negativa'&&tx.pos>=2&&tx.neg===0)flags.push('Nota baixa com texto elogioso: conferir');
  }else{
    const d=tx.pos-tx.neg;
    s=(tx.pos===0&&tx.neg===0)?'Neutra':(tx.neg===0&&tx.pos>=1)?'Positiva':(tx.pos===0&&tx.neg>=1)?'Negativa':d>=2?'Positiva':d<=-2?'Negativa':'Neutra';
    if(tx.pos===0&&tx.neg===0)flags.push('Sem nota e sem palavras reconhecidas: conferir');
  }
  let pr=s==='Positiva'?(flags.some(f=>/ressalva/.test(f))?'Média':'Baixa'):s==='Neutra'?'Média':'Alta';
  if(tx.crit||(n5!=null&&n5<=1.5))pr='Crítica';
  if(tx.crit)flags.push('Menciona tema sensível (segurança, saúde, pragas, jurídico ou discriminação)');
  return {sentimento:s,prioridade:pr,temas:tx.temas,idioma:tx.lang,flags,n5,
    prazo_resposta:somaDias(av.data_avaliacao||hojeISO(),R.prazos[pr]??2),classificada_em:new Date().toISOString()};
}

const temaChips=av=>(av.temas||[]).map(x=>{const id=x.slice(0,-1),ok=x.endsWith('+');return `<span class="b ${ok?'ok':'erro'}" title="${ok?'ponto positivo':'ponto de atenção'}">${esc(temaLabel(id))}</span>`}).join('');

function listar(a,lang){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+PACK[lang].lst+a[a.length-1]}
function gerarRespostas(av,tom,lang){
  const c=cfgResp(),R=reputCfg();const cl=(av.sentimento&&av.prioridade)?av:{...av,...classificarAv(av)};
  lang=lang||cl.idioma||'pt';const P=PACK[lang];const cat={Positiva:'pos',Neutra:'neu',Negativa:'neg'}[cl.sentimento]||'neu';
  const nome=(av.hospede||'').trim().split(/\s+/)[0];const n=nome?', '+nome:'',N=nome?' '+nome:'';
  const tp=listar(temasLista(cl,'+').slice(0,3).map(t=>temaLabel(t,lang)),lang),tn=listar(temasLista(cl,'-').slice(0,3).map(t=>temaLabel(t,lang)),lang);
  const ab=P.ab[tom][cat].replace('{n}',n).replace('{N}',N);const as=`${P.fe[tom]}\n${c.assin} · ${c.hotel}`;
  if(cl.prioridade==='Crítica'){const k=P.crit(R.contato);return [`${ab}\n\n${k}\n\n${as}`,`${ab}\n\n${k}\n\n${as}`,`${ab}\n\n${k} ${P.ext.neg}\n\n${as}`]}
  const corpo=cat==='pos'?P.pos(tp):cat==='neu'?P.neu(tp,tn):P.neg(tn);const conv=cat==='neg'?P.conv.neg(R.contato):P.conv[cat];
  return [`${ab}${cat==='neg'?'\n\n'+conv:''}\n\n${as}`,`${ab} ${corpo}\n\n${conv}\n\n${as}`,`${ab}\n\n${corpo} ${P.ext[cat]}\n\n${conv}\n\n${as}`]}
function guiaCaso(av){
  const p=portalCfg(av.origem),R=reputCfg();const g=[];
  g.push(`Prazo para responder: <b>${av.prazo_resposta?fdata(av.prazo_resposta):'—'}</b>${atrasada(av)?' <span class="b erro">Atrasada</span>':''}`);
  if(av.prioridade==='Crítica')g.push('<b>Caso crítico:</b> avise a gerência antes de responder. Não detalhe o ocorrido em público, leve a conversa para o canal privado e guarde o print como evidência. Se houver menção a Procon, advogado ou processo, alinhe o texto com a diretoria.');
  else if(av.sentimento==='Negativa')g.push('Responda sem discutir nem contestar o hóspede, com empatia e sem justificativas. Convide para o contato direto e <b>abra uma reclamação</b> para tratar a causa. Não prometa compensação em público.');
  else if(av.sentimento==='Neutra')g.push('Mostre que o comentário foi ouvido. Cite o ponto de atenção sem justificar e agradeça o que foi bem avaliado.');
  else g.push('Agradeça citando algo específico da avaliação, sem copiar um texto genérico. Convide a voltar, sem oferecer desconto em público.');
  const pr={Booking:'No Booking a resposta é pública e aparece na página do hotel. Siga as políticas de resposta da plataforma.',Google:'No Google a resposta é pública e sai em nome do proprietário. Não inclua dados pessoais nem número de reserva.',TripAdvisor:'No TripAdvisor não ofereça incentivos nem peça ao hóspede para alterar ou retirar a avaliação.','Amplifique.me':'O Amplifique.me é a pesquisa interna: o hóspede espera retorno direto, não precisa ser público.'}[av.origem];
  if(pr)g.push(pr);
  g.push(`Limite de caracteres configurado para ${esc(av.origem)}: ${p.limite}.`);
  (R.regras||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>g.push(esc(x)));
  return `<div class="note"><b>Guia do caso</b><ul style="margin:6px 0 0 18px;padding:0">${g.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
function verificarResposta(tx,origem){
  const R=reputCfg(),p=portalCfg(origem),out=[];const t=norm(tx);
  if(/\[[^\]]*\]/.test(tx))out.push({n:'erro',m:'Há trecho entre colchetes para preencher.'});
  if(tx.length>p.limite)out.push({n:'erro',m:`Passa do limite de ${p.limite} caracteres de ${origem} (${tx.length}).`});
  if(/\b(reembols|desconto|gratis|gratuit|ressarc|indeniz|compens|devolv|refund|discount|free of charge|descuento|reembolso)/.test(t))out.push({n:'aviso',m:'Fala em reembolso, desconto ou compensação. Evite prometer isso em público.'});
  if(/\b(reserva|apto|apartamento|uh|quarto|habitacion|room)\s*(n[oº°.]*\s*)?\d{2,}/.test(t))out.push({n:'aviso',m:'Cita número de reserva ou de quarto. Evite dados que identifiquem o hóspede.'});
  if(/\b(voce errou|culpa d[oa]|mentira|falso|nao e verdade|inverdade|nao procede|you are wrong|untrue|lie)\b/.test(t))out.push({n:'aviso',m:'Tom de contestação. Prefira reconhecer o relato sem discutir.'});
  (R.proibidas||'').split(/[,\n;]/).map(x=>norm(x).trim()).filter(Boolean).forEach(w=>{if(t.includes(w))out.push({n:'aviso',m:`Contém "${w}", que consta nas expressões a evitar.`})});
  return out}

function parseCSV(txt){
  const L=String(txt||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!L.length)return [];
  const d=L[0].includes('\t')?'\t':(L[0].split(';').length>=L[0].split(',').length?';':',');
  const lin=s=>{const o=[];let c='',q2=false;for(let i=0;i<s.length;i++){const ch=s[i];if(q2){if(ch==='"'&&s[i+1]==='"'){c+='"';i++}else if(ch==='"')q2=false;else c+=ch}else if(ch==='"')q2=true;else if(ch===d){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())};
  return L.map(lin)}
const isoData=s=>{s=String(s||'').trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null};

async function viewIndicadores(){
  const main=$('#main');S.indDias=S.indDias||30;const di=new Date();di.setDate(di.getDate()-S.indDias);const ini=di.toISOString(),iniD=dLocal(ini);
  main.innerHTML='<div class="empty">Calculando...</div>';
  const g=(t,c,col)=>q(sb.from(t).select(c).gte(col,ini).limit(3000));
  const [pend,pl,ava,rec,rcv,cort,sol,aud]=await Promise.all([g('rec_pendencias','status,prazo,concluida_em,criado_em','criado_em'),g('rec_plantoes','status','criado_em'),g('rec_avaliacoes','nota,nota_max,status,criado_em,respondida_em','criado_em'),g('rec_reclamacoes','status,criado_em,resolvida_em','criado_em'),g('rec_recuperacoes','resultado,custo,status','criado_em'),g('rec_cortesias','status','criado_em'),g('rec_solicitacoes','status,criado_em,concluida_em','criado_em'),g('rec_auditorias','nota','criado_em')]);
  const dias=(a,b)=>(new Date(b)-new Date(a))/86400000;const med=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length):null;const f1=v=>v==null?'—':v.toFixed(1);
  const pc=pend.filter(p=>p.status==='Concluída'),noPrazo=pc.filter(p=>!p.prazo||dLocal(p.concluida_em)<=p.prazo);
  const plF=pl.filter(p=>p.status!=='aberto'),notas=ava.filter(a=>a.nota!=null).map(a=>a.nota/a.nota_max*5),resp=ava.filter(a=>a.respondida_em).map(a=>dias(a.criado_em,a.respondida_em));
  const rs=rec.filter(r=>['Resolvida','Encerrada'].includes(r.status)),tr=rec.filter(r=>r.resolvida_em).map(r=>dias(r.criado_em,r.resolvida_em));
  const dec=rcv.filter(r=>['Recuperado','Parcial','Não recuperado'].includes(r.resultado));const sc=sol.filter(s=>s.status==='Concluída');
  const I=(l,v,m,warn)=>`<div class="kpi ${warn?'warn':''}"><div class="n">${v}</div><div class="l">${l}</div><div class="m">${m||''}</div></div>`;
  main.innerHTML=`<div class="vh"><div><h2>Indicadores de Desempenho</h2><div class="d">Calculados automaticamente a partir dos registros do período.</div></div><select id="indD" style="width:auto">${[[7,'Últimos 7 dias'],[30,'Últimos 30 dias'],[90,'Últimos 90 dias'],[365,'Últimos 12 meses']].map(([v,l])=>`<option value="${v}" ${S.indDias===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="grid g3">${I('Pendências concluídas no prazo',pc.length?pct(noPrazo.length,pc.length)+'%':'—',`${noPrazo.length} de ${pc.length} concluídas`,pc.length&&pct(noPrazo.length,pc.length)<S.cfg.metas.pend_prazo)}${I('Plantões com recebimento confirmado',plF.length?pct(plF.filter(p=>p.status==='confirmado').length,plF.length)+'%':'—',`${plF.filter(p=>p.status==='confirmado').length} de ${plF.length} fechados`,plF.length&&pct(plF.filter(p=>p.status==='confirmado').length,plF.length)<S.cfg.metas.plantao_conf)}${I('Solicitações internas concluídas',sol.length?pct(sc.length,sol.length)+'%':'—',`${sc.length} de ${sol.length}`)}
  ${I('Nota média das avaliações',notas.length?f1(med(notas))+' / 5':'—',notas.length+' avaliações com nota',notas.length&&med(notas)<S.cfg.metas.nota_min)}${I('Tempo médio de resposta a avaliações',resp.length?f1(med(resp))+' dias':'—',resp.length+' respondidas',resp.length&&med(resp)>S.cfg.metas.resp_dias)}${I('Avaliações respondidas',ava.length?pct(ava.filter(a=>a.status==='Respondida').length,ava.length)+'%':'—',`${ava.filter(a=>a.status==='Respondida').length} de ${ava.length}`)}
  ${I('Reclamações resolvidas',rec.length?pct(rs.length,rec.length)+'%':'—',`${rs.length} de ${rec.length}`)}${I('Tempo médio de resolução',tr.length?f1(med(tr))+' dias':'—',tr.length+' resolvidas')}${I('Índice de recuperação',dec.length?pct(dec.filter(r=>r.resultado==='Recuperado').length,dec.length)+'%':'—',`${dec.length} planos com resultado`)}
  ${I('Cortesias entregues',cort.length?pct(cort.filter(c=>c.status==='Entregue').length,cort.length)+'%':'—',`${cort.filter(c=>c.status==='Entregue').length} de ${cort.length} solicitadas`)}${I('Custo de recuperação','R$ '+rcv.filter(r=>r.status!=='Cancelada').reduce((a,r)=>a+Number(r.custo||0),0).toLocaleString('pt-BR',{minimumFractionDigits:2}),'planos do período')}${I('Nota média das auditorias',aud.length?f1(med(aud.filter(a=>a.nota!=null).map(a=>Number(a.nota))))+'%':'—',aud.length+' auditorias')}</div>`;
  $('#indD').onchange=e=>{S.indDias=Number(e.target.value);viewIndicadores()};

  S.rel.de=$('#rde').value;S.rel.ate=$('#rate').value;const de=new Date(S.rel.de+'T00:00:00').toISOString(),ate=new Date(S.rel.ate+'T23:59:59').toISOString();

  const [pl,pe,so,co,ac,av,re,rc,oc,au]=await Promise.all([g('rec_plantoes','*'),g('rec_pendencias','status,prazo,titulo'),g('rec_solicitacoes','status,destino,titulo'),g('rec_cortesias','status,tipo,hospede'),g('rec_achados','status'),g('rec_avaliacoes','nota,nota_max,status,origem'),g('rec_reclamacoes','status,gravidade,categoria'),g('rec_recuperacoes','resultado,custo,status'),g('rec_ocorrencias','titulo,gravidade,status,confidencial'),g('rec_auditorias','nota,checklist_nome')]);
  const abertasPend=await q(sb.from('rec_pendencias').select('titulo,prazo,responsavel').in('status',ABERTO_PEND));const venc=abertasPend.filter(p=>p.prazo&&p.prazo<hojeISO());
  const L=[];const H=t=>L.push({t:'h',x:t}),P=t=>L.push({t:'p',x:t}),B=t=>L.push({t:'li',x:t});
  H('Plantões');P(`${pl.length} plantão(ões) registrado(s); ${pl.filter(p=>p.status==='confirmado').length} com recebimento confirmado.`);pl.filter(p=>p.atencao_proximo).slice(0,5).forEach(p=>B(`${fdata(p.data)} ${p.turno}: ${p.atencao_proximo.replace(/\s+/g,' ').slice(0,200)}`));
  H('Pendências e solicitações');P(`${pe.length} pendência(s) criada(s) no período, ${pe.filter(p=>p.status==='Concluída').length} concluída(s). Em aberto hoje: ${abertasPend.length} (${venc.length} vencida(s)). Solicitações internas: ${so.length} (${so.filter(s=>s.status==='Concluída').length} concluídas).`);
  H('Cortesias e achados');P(`${co.length} cortesia(s) solicitada(s): ${co.filter(c=>c.status==='Entregue').length} entregue(s), ${co.filter(c=>c.status==='Aprovada').length} aprovada(s) a executar, ${co.filter(c=>c.status==='Recusada').length} recusada(s). Achados e perdidos registrados: ${ac.length} (${ac.filter(a=>a.status==='Devolvido').length} devolvido(s)).`);
  const nt=av.filter(a=>a.nota!=null).map(a=>a.nota/a.nota_max*5);const mn=nt.length?nt.reduce((x,y)=>x+y,0)/nt.length:null;
  H('Guest Relations');P(`${av.length} avaliação(ões) registrada(s)${mn!=null?`, nota média ${mn.toFixed(2)}/5`:''}; ${av.filter(a=>a.status==='Nova').length} sem resposta. Reclamações: ${re.length} (${re.filter(r=>['Resolvida','Encerrada'].includes(r.status)).length} resolvidas). Planos de recuperação: ${rc.length}, custo R$ ${rc.filter(r=>r.status!=='Cancelada').reduce((a,r)=>a+Number(r.custo||0),0).toLocaleString('pt-BR',{minimumFractionDigits:2})}.`);
  H('Ocorrências e auditorias');P(`${oc.length} ocorrência(s) no período (${oc.filter(o=>/Alta|Crítica/.test(o.gravidade)).length} de gravidade alta/crítica).${au.length?` Auditorias: ${au.length}, nota média ${(au.filter(a=>a.nota!=null).reduce((x,y)=>x+Number(y.nota),0)/Math.max(1,au.filter(a=>a.nota!=null).length)).toFixed(1)}%.`:''}`);oc.filter(o=>!o.confidencial).slice(0,6).forEach(o=>B(`${o.titulo} — ${o.gravidade} (${o.status})`));
  H('Análise automática');const al=[];
  if(venc.length)al.push(`${venc.length} pendência(s) vencida(s): priorizar com os responsáveis (${venc.slice(0,3).map(v=>v.titulo).join('; ')}).`);
  if(pl.some(p=>p.status==='fechado'))al.push('Há plantão(ões) fechado(s) sem confirmação de recebimento.');
  if(mn!=null&&mn<S.cfg.metas.nota_min)al.push(`Nota média das avaliações (${mn.toFixed(2)}) abaixo da meta de ${String(S.cfg.metas.nota_min).replace('.',',')} — revisar os temas recorrentes.`);
  if(av.filter(a=>a.status==='Nova').length)al.push(`${av.filter(a=>a.status==='Nova').length} avaliação(ões) aguardando resposta.`);
  if(re.filter(r=>['Aberta','Em tratamento'].includes(r.status)).length)al.push(`${re.filter(r=>['Aberta','Em tratamento'].includes(r.status)).length} reclamação(ões) ainda em aberto.`);
  const cats={};re.forEach(r=>cats[r.categoria]=(cats[r.categoria]||0)+1);const top=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];if(top&&top[1]>=2)al.push(`Categoria de reclamação mais frequente: ${top[0]} (${top[1]} casos).`);
  if(oc.some(o=>/Alta|Crítica/.test(o.gravidade)&&o.status!=='Encerrada'))al.push('Existem ocorrências de gravidade alta/crítica ainda não encerradas.');
  if(co.filter(c=>c.status==='Aprovada').length)al.push(`${co.filter(c=>c.status==='Aprovada').length} cortesia(s) aprovada(s) ainda não entregue(s).`);
  if(!al.length)al.push('Nenhum ponto crítico identificado pelas regras no período.');al.forEach(B);
  S.relL=L;const txt=`RELATÓRIO DA RECEPÇÃO — ${fdata(S.rel.de)} a ${fdata(S.rel.ate)}\n\n`+L.map(l=>l.t==='h'?`\n${l.x.toUpperCase()}`:l.t==='li'?`- ${l.x}`:l.x).join('\n');S.relTxt=txt;
  $('#relOut').innerHTML=`<div class="card"><div class="row sb noprint" style="margin-bottom:10px"><b>Relatório pronto</b><div class="row"><button class="btn" onclick="window.print()">Imprimir / salvar PDF</button><button class="btn" onclick="navigator.clipboard.writeText(S.relTxt).then(()=>toast('Texto copiado.'))">Copiar texto</button></div></div>
  <h2 style="margin:0 0 4px;color:var(--verde-escuro)">Relatório da Recepção</h2><div class="sub" style="margin-bottom:12px">${esc(S.cfg.hotel.nome)} · ${fdata(S.rel.de)} a ${fdata(S.rel.ate)} · gerado por ${esc(S.user.nome)}</div>
  ${L.map(l=>l.t==='h'?`<h3 style="margin-top:16px">${esc(l.x)}</h3>`:l.t==='li'?`<div style="padding:2px 0 2px 14px">&bull; ${esc(l.x)}</div>`:`<div style="margin:4px 0">${esc(l.x)}</div>`).join('')}</div>`;
});

ACT.cfgPortais=()=>{S.cfgTab='portais';irPara('config')};
ACT.cfgSalvarPortais=()=>safe(async()=>{const o={};
  document.querySelectorAll('[data-portal]').forEach(c=>{const p=c.dataset.portal,v={};c.querySelectorAll('[data-f]').forEach(i=>{v[i.dataset.f]=i.type==='checkbox'?i.checked:(i.type==='number'?Number(i.value):i.value.trim())});
    if(!(v.escala>0)||!(v.limite>=100))throw new Error('Confira escala e limite de caracteres em '+p+'.');o[p]=v});
  await salvarCfg('portais',o);
  const novos=[...document.querySelectorAll('[data-seg]')].filter(i=>i.value.trim());
  for(const i of novos)await q(sb.rpc('rec_segredo_definir',{p_chave:i.dataset.seg,p_valor:i.value.trim()}));

ACT.driveSalvar=()=>safe(async()=>{const u=$('#dr_url').value.trim(),p=$('#dr_pasta').value.trim();
  if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){toast('O endereço do script deve terminar em /exec.','erro');return}
  if(!pastaId(p)){toast('Informe o link da pasta do Drive.','erro');return}
  await salvarCfg('drive',{url:u,pasta:p});toast('Configuração do Drive salva.')});
ACT.driveTestar=()=>safe(async()=>{const u=$('#dr_url').value.trim();if(!u){toast('Informe o endereço do script.','erro');return}
  $('#dr_res').textContent='Testando...';const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({sessao:TOKEN,acao:'teste'})});const j=await r.json();
  $('#dr_res').innerHTML=j.ok?`<span style="color:var(--verde-mid)">Conectado. Pasta: <b>${esc(j.pasta||'—')}</b>. Login da Recepção reconhecido (nível ${j.nivel}).</span>`:`<span style="color:var(--erro)">${esc(j.erro||'Falha na conexão')}</span>`});

async function viewHome(){
  const main=$('#main'),hoje=hojeISO();const ini=new Date();ini.setHours(0,0,0,0);const fim=new Date(ini);fim.setDate(fim.getDate()+1);
  const [pend,ag,pl,cort]=await Promise.all([q(sb.from('rec_pendencias').select('*').in('status',ABERTO_PEND).order('prazo',{ascending:true,nullsFirst:false}).limit(8)),q(sb.from('rec_agenda').select('*').eq('cancelado',false).gte('inicio',ini.toISOString()).lt('inicio',fim.toISOString()).order('inicio')),q(sb.from('rec_plantoes').select('*').order('criado_em',{ascending:false}).limit(3)),q(sb.from('rec_cortesias').select('id,status'))]);
  const b=S.badges||{};const ultAt=pl.find(p=>p.atencao_proximo);
  main.innerHTML=`<div class="vh"><div><h2>Olá, ${esc(S.user.nome.split(' ')[0])}</h2><div class="d">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · perfil ${nivelNome(S.user.nivel)}</div></div></div>
  ${nvLegenda()}
  ${b.mural||b.conhecimento?`<div class="item alert"><b>Leitura obrigatória pendente:</b> ${b.mural?`<button class="lnk" onclick="irPara('mural')">${b.mural} aviso(s) no Mural</button>`:''} ${b.conhecimento?`<button class="lnk" onclick="irPara('conhecimento')">${b.conhecimento} documento(s) na Base de Conhecimento</button>`:''}</div>`:''}
  ${ultAt?`<div class="item fix"><h4>Atenção para o turno — passagem de ${fdata(ultAt.data)} (${esc(ultAt.turno)})</h4><div class="tx">${nl2(ultAt.atencao_proximo)}</div><div class="sub">${esc(ultAt.entrega_por||'')}${ultAt.status==='fechado'?' · aguardando confirmação de recebimento':''}</div>${ultAt.status==='fechado'?`<button class="btn sm p" onclick="irPara('plantao')">Ir para Passagem de Plantão</button>`:''}</div>`:''}
  <div class="grid g4" style="margin-bottom:16px"><button class="kpi" onclick="irPara('pendencias',{st:'__abertos'})"><div class="n">${b.pendencias??pend.length}</div><div class="l">Pendências em aberto</div></button><button class="kpi" onclick="irPara('solicitacoes',{st:'__abertos'})"><div class="n">${b.solicitacoes??0}</div><div class="l">Solicitações abertas</div></button><button class="kpi" onclick="irPara('cortesias',{st:'Aprovada'})"><div class="n">${cort.filter(c=>c.status==='Aprovada').length}</div><div class="l">Cortesias a executar</div></button><button class="kpi" onclick="irPara('agenda')"><div class="n">${ag.length}</div><div class="l">Reuniões hoje (sala)</div></button></div>
  <div class="grid g2"><div class="card"><h3>Próximas pendências</h3>${pend.length?pend.map(p=>`<div class="row sb" style="padding:6px 0;border-bottom:1px solid var(--borda)"><span><b>${esc(p.titulo)}</b><div class="sub">${esc(p.responsavel||'Equipe')} · ${esc(p.status)}</div></span>${p.prazo?`<span class="b ${p.prazo<hoje?'erro':'info'}">${fdata(p.prazo)}</span>`:''}</div>`).join(''):'<div class="sub">Sem pendências em aberto.</div>'}</div>
  <div class="card"><h3>Sala de reuniões hoje</h3>${ag.length?ag.map(e=>`<div style="padding:6px 0;border-bottom:1px solid var(--borda)"><b>${fhora(e.inicio)} – ${fhora(e.fim)}</b> ${esc(e.titulo)}<div class="sub">${esc(e.responsavel||'')}</div></div>`).join(''):'<div class="sub">Sala livre hoje.</div>'}<button class="btn sm" style="margin-top:10px" onclick="irPara('agenda')">Ver agenda</button></div></div>`;
}

function menuHTML(){let h=`<button data-v="home" onclick="irPara('home')"><span class="lb">${ico('home')}<span>Início</span></span></button>`;
  for(const g of ['E','G','S']){const vs=Object.entries(VIEWS).filter(([k,v])=>v.g===g&&S.user.nivel>=v.nivel);if(!vs.length)continue;

  return h}
async function irPara(id,opts){
  const v=VIEWS[id];if(!v||S.user.nivel<v.nivel){toast('Você não tem acesso a esta área.','erro');return}
  S.filtro=opts||null;S.view=id;history.replaceState(null,'','#'+id);
  document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('on',b.dataset.v===id));$('.side')?.classList.remove('open');
  $('#main').innerHTML='<div class="empty">Carregando...</div>';
  try{await v.render()}catch(e){console.error(e);$('#main').innerHTML=`<div class="card empty">Erro ao carregar: ${esc(msgErro(e))}</div>`;if(/JWT|expir/i.test(String(e.message)))sair()}
  {const m=$('#main');if(m)m.className='m'+(v.g||'');const h2=$('#main .vh h2');if(h2&&v.g)h2.insertAdjacentHTML('beforebegin',nvBadge({E:1,G:2,S:3}[v.g])+(id==='config'?`<span class="nvl nS" style="margin-left:6px">${ico('lock')}Acesso restrito</span>`:''));}
  window.scrollTo(0,0);
}
function montarShell(){
  $('#app').innerHTML=`<div class="topbar"><button class="hamb" onclick="document.querySelector('.side').classList.toggle('open')">&#9776;</button><div class="brand">Recepção<small>ERPPA · Hotel Laghetto Pedras Altas</small></div><div class="sp"></div><a class="tb-link" href="../">&larr; Portal</a><button class="tb-btn" onclick="ACT.notifs()">Notificações<span class="dot" id="bellDot" style="display:none"></span></button><button class="tb-btn" onclick="ACT.minhaSenha()">Senha</button><div class="chip">${esc(S.user.nome)}${nvBadge(S.user.nivel)}</div><button class="tb-btn" onclick="sair()">Sair</button></div>
  <div class="layout"><div class="side">${menuHTML()}</div><main id="main"></main></div>`;
}
async function iniciarApp(){
  montarShell();await carregarCfg();await carregarEquipe();await Promise.all([carregarNotifs(),refreshBadges()]);
  const h=(location.hash||'').replace('#','');irPara(VIEWS[h]&&S.user.nivel>=VIEWS[h].nivel?h:'home');
  clearInterval(S.timer);S.timer=setInterval(async()=>{try{const r=await q(sb.rpc('rec_sessao'));if(!r||!r.ok){sair('Sessão expirada. Entre novamente.');return}carregarNotifs();refreshBadges()}catch(e){}},60000);
}
async function sair(msg){clearInterval(S.timer);try{await sb.rpc('rec_logout')}catch(e){}TOKEN='';localStorage.removeItem(TK);S.user=null;telaLogin(typeof msg==='string'?msg:'')}
function telaLogin(msg){
  $('#app').innerHTML=`<div class="login"><div class="lbox"><h1>Recepção</h1><p>ERPPA · Hotel Laghetto Pedras Altas</p><label for="lgN">Usuário (nome completo)</label><input id="lgN" autocomplete="username" autofocus><label for="lgS">Senha</label><input id="lgS" type="password" autocomplete="current-password">${msg?`<div class="err">${esc(msg)}</div>`:''}<div id="lgE"></div><button class="btn p" style="width:100%;margin-top:16px;padding:11px" id="lgB">Entrar</button><div class="sub" style="margin-top:14px;text-align:center"><a href="../" style="color:var(--suave)">Voltar ao portal</a></div></div></div>`;
  const go=async()=>{const n=$('#lgN').value.trim(),s=$('#lgS').value;if(!n||!s)return;$('#lgB').disabled=true;
    try{const r=await q(sb.rpc('rec_login',{p_nome:n,p_senha:s}));if(!r.ok){$('#lgE').innerHTML=`<div class="err">${esc(r.erro)}</div>`;$('#lgB').disabled=false;return}
      TOKEN=r.token;localStorage.setItem(TK,TOKEN);S.user={id:r.id,nome:r.nome,nivel:r.nivel};if(r.trocar_senha)telaTrocar(true);else iniciarApp()}
    catch(e){$('#lgE').innerHTML=`<div class="err">${esc(msgErro(e))}</div>`;$('#lgB').disabled=false}};
  $('#lgB').onclick=go;$('#lgS').onkeydown=e=>{if(e.key==='Enter')go()};$('#lgN').onkeydown=e=>{if(e.key==='Enter')$('#lgS').focus()};
}
function telaTrocar(forcado){
  $('#app').innerHTML=`<div class="login"><div class="lbox"><h1>Trocar senha</h1><p>${forcado?'Primeiro acesso: defina a sua senha pessoal (mínimo 8 caracteres).':'Informe a senha atual e a nova senha.'}</p><label>Senha atual</label><input id="tsA" type="password" autocomplete="current-password"><label>Nova senha</label><input id="tsN" type="password" autocomplete="new-password"><label>Repita a nova senha</label><input id="tsR" type="password" autocomplete="new-password"><div id="tsE"></div><button class="btn p" style="width:100%;margin-top:16px;padding:11px" id="tsB">Salvar senha</button>${forcado?'':'<button class="btn" style="width:100%;margin-top:8px" onclick="iniciarApp()">Cancelar</button>'}</div></div>`;
  $('#tsB').onclick=async()=>{const a=$('#tsA').value,n=$('#tsN').value,r=$('#tsR').value;const err=m=>$('#tsE').innerHTML=`<div class="err">${esc(m)}</div>`;
    if(n.length<8)return err('A nova senha deve ter ao menos 8 caracteres.');if(n!==r)return err('As senhas não conferem.');
    try{const x=await q(sb.rpc('rec_trocar_senha',{p_atual:a,p_nova:n}));if(!x.ok)return err(x.erro);toast('Senha alterada.');iniciarApp()}catch(e){err(msgErro(e))}};
}
ACT.minhaSenha=()=>telaTrocar(false);
async function boot(){
  if(TOKEN){try{const r=await q(sb.rpc('rec_sessao'));if(r&&r.ok){S.user={id:r.id,nome:r.nome,nivel:r.nivel};if(r.trocar_senha){telaTrocar(true);return}iniciarApp();return}}catch(e){console.warn(e)}TOKEN='';localStorage.removeItem(TK)}
  telaLogin();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
boot();
</script>
</body>
</html>
