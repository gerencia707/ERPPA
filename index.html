


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERPPA · Portal Pedras Altas</title>
<style>
  :root{
    --verde-escuro:#0A2A22;
    --verde-claro:#C7F1C5;
    --sage:#A1E19C;
    --verde-mid:#123B30;
    --bg:#F5F7F4;
    --card:#FFFFFF;
    --texto:#152119;
    --texto-suave:#5B6B62;
    --borda:#E1E8E2;
    --erro:#B3432B;
    --erro-bg:#FBEAE4;
    --ok-bg:#EAF7E7;
    --alerta-bg:#FDF3E3;
    --alerta:#8A5A15;
    --radius:10px;
    --topbar-h:58px;
    --sidebar-w:230px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--texto);}

  /* ===== TOPBAR ===== */
  .topbar{
    height:var(--topbar-h);
    background:var(--verde-escuro);
    display:flex;align-items:center;
    padding:0 20px;
    gap:4px;
    position:sticky;top:0;z-index:10;
    box-shadow:0 1px 0 rgba(0,0,0,.15);
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;margin-right:18px;flex-shrink:0;}
  .topbar .brand .mark{width:30px;height:30px;border-radius:7px;background:var(--sage);display:flex;align-items:center;justify-content:center;color:var(--verde-escuro);font-weight:800;font-size:12px;}
  .topbar .brand .txt{color:#fff;font-size:13.5px;font-weight:600;line-height:1.2;}
  .topbar .brand .txt .sub{color:var(--sage);font-size:10.5px;font-weight:500;}
  .topbar nav{display:flex;gap:2px;overflow-x:auto;flex:1;}
  .topbar nav button{
    background:transparent;border:none;color:var(--verde-claro);
    padding:0 16px;height:var(--topbar-h);font-size:13.5px;font-weight:600;
    cursor:pointer;opacity:.68;white-space:nowrap;
    border-bottom:3px solid transparent;
    transition:opacity .15s, border-color .15s, background .15s;
  }
  .topbar nav button:hover{opacity:1;background:rgba(255,255,255,.05);}
  .topbar nav button.active{opacity:1;border-bottom-color:var(--sage);background:rgba(255,255,255,.06);}
  .topbar nav button .lock{font-size:10.5px;margin-left:5px;opacity:.7;font-weight:500;}
  .topbar .user-chip{display:flex;align-items:center;gap:8px;color:var(--verde-claro);font-size:12.5px;flex-shrink:0;padding-left:14px;}
  .topbar .user-chip .avatar{width:26px;height:26px;border-radius:50%;background:var(--verde-mid);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sage);}

  /* ===== LAYOUT ===== */
  .layout{display:flex;min-height:calc(100vh - var(--topbar-h));}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;
    background:#0E241D;
    padding:18px 12px;
    min-height:calc(100vh - var(--topbar-h));
  }
  .sidebar .setor-titulo{color:var(--sage);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:0 10px 12px;}
  .sidebar button{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:transparent;border:none;color:var(--verde-claro);
    padding:10px 12px;font-size:13.5px;cursor:pointer;border-radius:8px;text-align:left;
    margin-bottom:2px;opacity:.85;
  }
  .sidebar button:hover:not(:disabled){opacity:1;background:rgba(255,255,255,.06);}
  .sidebar button.active{background:var(--verde-mid);opacity:1;font-weight:600;}
  .sidebar button:disabled{opacity:.35;cursor:not-allowed;color:var(--verde-claro);}
  .sidebar button .traco{font-size:12px;color:var(--texto-suave);}
  main{flex:1;padding:30px 34px 60px;max-width:1100px;}
  main.encaixado{padding:14px;max-width:none;}

  .bloqueado-msg{
    background:var(--card);border:1px dashed var(--borda);border-radius:var(--radius);
    padding:48px 30px;text-align:center;color:var(--texto-suave);
  }
  .bloqueado-msg .icone{font-size:26px;margin-bottom:12px;opacity:.5;}
  .bloqueado-msg h3{color:var(--verde-escuro);font-size:16px;margin:0 0 6px;}
  .bloqueado-msg p{font-size:13.5px;margin:0;max-width:420px;margin-inline:auto;}

  .view-header{margin-bottom:20px;}
  .view-header h2{font-size:19px;margin:0 0 3px;color:var(--verde-escuro);}
  .view-header .desc{font-size:13px;color:var(--texto-suave);}

  .card{background:var(--card);border:1px solid var(--borda);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
  .card h3{font-size:13px;margin:0 0 16px;color:var(--verde-escuro);text-transform:uppercase;letter-spacing:.04em;}
  label{display:block;font-size:12.5px;color:var(--texto-suave);margin-bottom:5px;margin-top:14px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=password], select, textarea{width:100%;padding:9px 11px;border:1px solid var(--borda);border-radius:7px;font-size:14px;background:#fcfdfc;color:var(--texto);font-family:inherit;}
  textarea{resize:vertical;min-height:70px;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--verde-mid);box-shadow:0 0 0 3px rgba(18,59,48,.10);}
  .nivel-row{display:flex;gap:8px;margin-top:6px;}
  .nivel-row button{
    flex:1;padding:10px 4px;border:1px solid var(--borda);background:#fcfdfc;border-radius:7px;
    font-size:13px;cursor:pointer;color:var(--texto);text-align:center;
  }
  .nivel-row button .n{display:block;font-weight:700;font-size:15px;}
  .nivel-row button .d{display:block;font-size:10px;color:var(--texto-suave);margin-top:2px;}
  .nivel-row button.selected{background:var(--verde-escuro);border-color:var(--verde-escuro);color:var(--verde-claro);}
  .nivel-row button.selected .d{color:var(--sage);}
  .menu-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .menu-check{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--borda);border-radius:7px;font-size:13px;cursor:pointer;background:#fcfdfc;}
  .menu-check input{width:auto;margin:0;}
  .menu-check.disabled{opacity:.5;}
  .btn-primary{padding:11px 18px;background:var(--verde-escuro);color:var(--verde-claro);border:none;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn-primary.full{width:100%;margin-top:20px;}
  .btn-primary:hover{background:var(--verde-mid);}
  .msg{margin-top:14px;padding:10px 12px;border-radius:7px;font-size:13px;display:none;}
  .msg.ok{background:var(--ok-bg);color:var(--verde-mid);display:block;}
  .msg.erro{background:var(--erro-bg);color:var(--erro);display:block;}
  .msg.alerta{background:var(--alerta-bg);color:var(--alerta);display:block;}
  .divider{height:1px;background:var(--borda);margin:20px 0;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--texto-suave);padding:8px 10px;border-bottom:1px solid var(--borda);}
  td{padding:10px;border-bottom:1px solid var(--borda);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;margin:1px 3px 1px 0;}
  .badge.nivel{background:var(--verde-claro);color:var(--verde-escuro);}
  .badge.menu-ok{background:#EFF4EF;color:var(--verde-mid);}
  .badge.ok{background:var(--ok-bg);color:var(--verde-mid);}
  .badge.pend{background:var(--alerta-bg);color:var(--alerta);}
  .badge.erro{background:var(--erro-bg);color:var(--erro);}
  .badge.info{background:#EFF4EF;color:var(--texto-suave);}
  .stat-row{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .stat{background:var(--card);border:1px solid var(--borda);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:140px;}
  .stat .num{font-size:22px;font-weight:700;color:var(--verde-escuro);}
  .stat .lbl{font-size:11.5px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .login-wrap{min-height:calc(100vh - var(--topbar-h) - 60px);display:flex;align-items:center;justify-content:center;}
  .login-box{width:100%;max-width:320px;}
  .nota-card{border:1px solid var(--borda);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;background:var(--card);}
  .nota-texto{font-size:14px;white-space:pre-wrap;margin-bottom:8px;}
  .nota-rodape{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .kvtoggle{display:flex;gap:4px;background:#EFF4EF;padding:4px;border-radius:9px;margin-bottom:16px;width:fit-content;}
  .kvtoggle button{background:transparent;border:none;padding:8px 14px;font-size:13px;border-radius:6px;cursor:pointer;color:var(--texto-suave);font-weight:600;}
  .kvtoggle button.active{background:var(--card);color:var(--verde-escuro);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .empty{text-align:center;padding:30px 20px;color:var(--texto-suave);font-size:13.5px;}
  .action-link{background:none;border:none;cursor:pointer;color:var(--texto-suave);font-size:12px;text-decoration:underline;padding:0;}
  .action-link.danger{color:var(--erro);}
  .config-note{font-size:12px;color:var(--texto-suave);background:#F2F5F2;border-radius:7px;padding:10px 12px;margin-top:16px;line-height:1.5;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="txt">Portal Pedras Altas<div class="sub">ERPPA</div></div>
  </div>
  <nav id="topNav"></nav>
  <div class="user-chip"></div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebarWrap">
    <div class="setor-titulo" id="setorTitulo">Gerência</div>
    <div id="sidebarMenu"></div>
  </div>
  <main id="mainArea"></main>
</div>

<script>
// ============================================================
// ESTRUTURA DOS SETORES (esboço — dados de exemplo)
// ============================================================
const SETORES = {
  gerencia: {
    nome: 'Gerência',
    ativo: true,
    submenus: [
      {id:'notas', nome:'Bloco de Notas', ativo:true},
      {id:'dash_dp', nome:'Dashboard DP', ativo:true},
      {id:'dash_manutencao', nome:'Dashboard Manutenção', ativo:true},
      {id:'dash_voucher', nome:'Dashboard Voucher', ativo:true},
      {id:'relatorio_consolidado', nome:'Relatório Consolidado', ativo:false},
      {id:'config', nome:'Configuração', ativo:true},
    ]
  },
  manutencao: {
    nome: 'Manutenção',
    ativo: true,
    url: './manutencao/',
    submenus: []
  },
  dp: {
    nome: 'DP',
    ativo: true,
    url: './dp/',
    submenus: []
  },
  voucher: {
    nome: 'Voucher LGM',
    ativo: true,
    url: './voucher/',
    submenus: []
  },
  recepcao: {
    nome: 'Recepção',
    ativo: false,
    submenus: [
      {id:'checkin', nome:'Check-in / Check-out', ativo:false},
      {id:'reservas', nome:'Reservas', ativo:false},
    ]
  },
  governanca: {
    nome: 'Governança',
    ativo: true,
    url: './governanca/',
    submenus: []
  },
  aeb: {
    nome: 'A&B',
    ativo: true,
    url: './aeb/',
    submenus: []
  }
};

const NIVEIS = [
  {v:1, d:'Consulta'},
  {v:2, d:'Operador'},
  {v:3, d:'Supervisor'},
  {v:4, d:'Coordenador'},
  {v:5, d:'Admin'},
];

let setorAtual = 'gerencia';
let submenuAtual = 'notas';

// ============================================================
// CONEXÃO SUPABASE (só leitura do uso do banco)
// ============================================================
const SUPA_URL = 'https://xdnnngifpbrbhxyluans.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhkbm5uZ2lmcGJyYmh4eWx1YW5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2ODgwODQsImV4cCI6MjA5NjI2NDA4NH0.1HmvUOo56BhCdLTjJH3UfTMkq8uO7-EK_zg3W0hX46A';
const supaPortal = supabase.createClient(SUPA_URL, SUPA_KEY);
const LIMITE_BANCO_MB = 500; // limite do plano gratuito

function renderDashboardGeral(main){
  main.innerHTML = `
    <div class="view-header">
      <h2>Controle de Memória</h2>
      <div class="desc">Uso do banco de dados (limite gratuito: ${LIMITE_BANCO_MB} MB).</div>
    </div>
    <div class="card" id="cardUsoBanco">
      <div class="empty">Carregando uso do banco...</div>
    </div>

    <div class="card">
      <h3>Limpeza de dados antigos</h3>
      <div class="config-note" style="margin-top:0;">Apaga <b>permanentemente</b> registros antigos de um tipo específico, até a data escolhida. Use com cuidado — não há como desfazer. Dados permanentes (equipe, colaboradores, apartamentos, CNPJs) nunca aparecem aqui.</div>

      <label style="margin-top:16px;">1. O que limpar</label>
      <select id="limpTipo">
        <option value="">Selecione o tipo de dado...</option>
        <optgroup label="Manutenção">
          <option value="man_chamados">Chamados concluídos</option>
          <option value="man_compras">Compras concluídas</option>
          <option value="man_gastos">Lançamentos de gastos</option>
          <option value="man_lembretes">Lembretes</option>
        </optgroup>
        <optgroup label="DP">
          <option value="dp_historico">Histórico de colaboradores</option>
          <option value="dp_desligamentos">Desligamentos</option>
          <option value="dp_ferias">Férias concluídas</option>
        </optgroup>
        <optgroup label="Voucher LGM">
          <option value="vou_fechamentos">Fechamentos diários</option>
          <option value="vou_danfe">Emissões de DANFE</option>
        </optgroup>
      </select>

      <label>2. Apagar registros ATÉ esta data (inclusive)</label>
      <input type="date" id="limpData">

      <button class="btn-primary" id="btnVerificarLimpeza" style="margin-top:16px;">Verificar o que será apagado</button>
      <div class="msg" id="limpMsg"></div>
      <div id="limpConfirmacao" style="margin-top:14px;"></div>
    </div>`;
  carregarUsoBanco();
  configurarLimpeza();
}

// Mapa: tipo -> {tabela, campoData, filtroExtra, label}
const TIPOS_LIMPEZA = {
  man_chamados:    { tabela:'chamados',            campoData:'concluidoEm',   label:'chamados concluídos',       filtro:function(q){ return q.eq('status','concluido'); } },
  man_compras:     { tabela:'compras',             campoData:'comprado_em',   label:'compras concluídas',        filtro:function(q){ return q; } },
  man_gastos:      { tabela:'lancamentos_gastos',  campoData:'lancado_em',    label:'lançamentos de gastos',     filtro:function(q){ return q; } },
  man_lembretes:   { tabela:'lembretes',           campoData:'dataInicio',    label:'lembretes',                 filtro:function(q){ return q; } },
  dp_historico:    { tabela:'dp_historico',        campoData:'data',          label:'histórico de colaboradores',filtro:function(q){ return q; } },
  dp_desligamentos:{ tabela:'dp_desligamentos',    campoData:'data_deslig',   label:'desligamentos',             filtro:function(q){ return q; } },
  dp_ferias:       { tabela:'dp_ferias',           campoData:'data_fim',      label:'férias concluídas',         filtro:function(q){ return q.eq('status','concluida'); } },
  vou_fechamentos: { tabela:'fechamentos_sem_lancamento', campoData:'data',   label:'fechamentos diários',       filtro:function(q){ return q; } },
  vou_danfe:       { tabela:'danfe_emissoes',      campoData:'data_fim',      label:'emissões de DANFE',         filtro:function(q){ return q; } }
};

function configurarLimpeza(){
  document.getElementById('btnVerificarLimpeza').addEventListener('click', verificarLimpeza);
}

async function verificarLimpeza(){
  const tipo = document.getElementById('limpTipo').value;
  const data = document.getElementById('limpData').value;
  const msg = document.getElementById('limpMsg');
  const confDiv = document.getElementById('limpConfirmacao');
  confDiv.innerHTML = '';

  if(!tipo){ msg.textContent = 'Selecione o tipo de dado.'; msg.className = 'msg erro'; return; }
  if(!data){ msg.textContent = 'Selecione a data limite.'; msg.className = 'msg erro'; return; }

  const cfg = TIPOS_LIMPEZA[tipo];
  msg.textContent = 'Verificando...'; msg.className = 'msg';

  try{
    let q = supaPortal.from(cfg.tabela).select('*', {count:'exact', head:true}).lte(cfg.campoData, data);
    q = cfg.filtro(q);
    const {count, error} = await q;
    if(error) throw error;

    if(!count || count === 0){
      msg.textContent = `Nenhum registro de "${cfg.label}" encontrado até ${data}. Nada a apagar.`;
      msg.className = 'msg ok';
      return;
    }

    msg.className = 'msg';
    confDiv.innerHTML = `
      <div class="msg alerta" style="display:block;">
        Serão apagados <b>${count}</b> registro(s) de <b>${cfg.label}</b> com data até <b>${data}</b>.
        Esta ação é <b>permanente e não pode ser desfeita</b>.
      </div>
      <label style="margin-top:6px;">Para confirmar, digite <b>APAGAR</b> abaixo:</label>
      <input type="text" id="limpConfirmaTexto" placeholder="APAGAR" style="max-width:200px;">
      <button class="btn-primary" id="btnConfirmarLimpeza" style="margin-top:12px;background:var(--erro);display:block;">Apagar ${count} registro(s) definitivamente</button>`;

    document.getElementById('btnConfirmarLimpeza').addEventListener('click', ()=>executarLimpeza(tipo, data, count));
  }catch(e){
    msg.textContent = 'Erro ao verificar: ' + (e.message||e);
    msg.className = 'msg erro';
  }
}

async function executarLimpeza(tipo, data, countEsperado){
  const confirmaTexto = document.getElementById('limpConfirmaTexto').value.trim();
  const msg = document.getElementById('limpMsg');
  if(confirmaTexto !== 'APAGAR'){
    msg.textContent = 'Digite APAGAR (em maiúsculas) para confirmar.';
    msg.className = 'msg erro';
    return;
  }

  const cfg = TIPOS_LIMPEZA[tipo];
  try{
    let q = supaPortal.from(cfg.tabela).delete().lte(cfg.campoData, data);
    q = cfg.filtro(q);
    const {error} = await q;
    if(error) throw error;

    msg.textContent = `${countEsperado} registro(s) de "${cfg.label}" apagado(s) com sucesso.`;
    msg.className = 'msg ok';
    document.getElementById('limpConfirmacao').innerHTML = '';
    document.getElementById('limpTipo').value = '';
    document.getElementById('limpData').value = '';
    carregarUsoBanco(); // atualiza a barra de uso
  }catch(e){
    msg.textContent = 'Erro ao apagar: ' + (e.message||e);
    msg.className = 'msg erro';
  }
}

async function carregarUsoBanco(){
  const card = document.getElementById('cardUsoBanco');
  try{
    const [totalRes, sistemasRes] = await Promise.all([
      supaPortal.rpc('uso_banco_total'),
      supaPortal.rpc('uso_banco_por_sistema')
    ]);
    if(totalRes.error) throw totalRes.error;
    if(sistemasRes.error) throw sistemasRes.error;

    const totalBytes = totalRes.data || 0;
    const totalMB = totalBytes / (1024*1024);
    const pct = Math.min(100, (totalMB / LIMITE_BANCO_MB) * 100);

    let corBarra = 'var(--sage)', alerta = '';
    if(pct >= 90){
      corBarra = 'var(--erro)';
      alerta = `<div class="msg erro" style="display:block;margin-bottom:16px;">⚠️ Atenção: o banco está com ${pct.toFixed(1)}% do espaço usado. Considere limpar dados antigos ou avaliar um upgrade.</div>`;
    } else if(pct >= 80){
      corBarra = '#E0A030';
      alerta = `<div class="msg alerta" style="display:block;margin-bottom:16px;">O banco está com ${pct.toFixed(1)}% do espaço usado. Ainda há folga, mas vale ficar de olho.</div>`;
    }

    const sistemas = sistemasRes.data || [];
    const totalSistemas = sistemas.reduce((s,x)=>s+(x.bytes||0),0) || 1;
    const coresSistema = {'DP':'#0A2A22','Voucher LGM':'#4A8C7A','Manutenção':'#A1E19C'};

    card.innerHTML = `
      ${alerta}
      <h3>Uso total</h3>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
        <span><b>${totalMB.toFixed(1)} MB</b> usados</span>
        <span style="color:var(--texto-suave);">${pct.toFixed(1)}% de ${LIMITE_BANCO_MB} MB</span>
      </div>
      <div style="height:14px;background:var(--borda);border-radius:8px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${corBarra};transition:width .4s;"></div>
      </div>

      <div class="divider"></div>

      <h3>Uso por sistema</h3>
      <table>
        <thead><tr><th>Sistema</th><th>Tamanho</th><th>Participação</th></tr></thead>
        <tbody>${sistemas.map(x=>{
          const mb = (x.bytes||0)/(1024*1024);
          const part = ((x.bytes||0)/totalSistemas)*100;
          const cor = coresSistema[x.sistema] || 'var(--texto-suave)';
          return `<tr>

// ============================================================
// LOGIN DA GERÊNCIA (real — só quem tiver a senha entra)
// ============================================================
// Diferente do resto do Portal (que ainda não tem trava nenhuma), a
// Gerência agora exige login de verdade, porque é aqui que ficam as
// ferramentas mais sensíveis (limpeza de dados, notas, dashboards).
const GERENCIA_UID_KEY = 'portalErppa_gerencia_uid';
let gerenciaUsuarios = [];
let gerenciaLogado = null;

async function carregarGerenciaUsuarios(){
  try{
    const {data, error} = await supaPortal.from('gerencia_usuarios').select('*');
    if(error) throw error;
    if(!data || !data.length){
      const seed = {id:crypto.randomUUID?crypto.randomUUID():'seed-'+Date.now(), nome:'Eduardo Rohden', login:'ADM', senha:'ADM'};
      await supaPortal.from('gerencia_usuarios').insert([seed]);
      gerenciaUsuarios = [seed];
    } else {
      gerenciaUsuarios = data;
    }
  }catch(e){
    console.warn('gerencia_usuarios', e.message||e);
  }
  const uid = localStorage.getItem(GERENCIA_UID_KEY);
  if(uid){
    const u = gerenciaUsuarios.find(x=>x.id===uid);
    if(u) gerenciaLogado = u;
  }
}

function renderLoginGerencia(main){
  main.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div class="card">
          <h3>Acesso restrito — Gerência</h3>
          <label style="margin-top:0;">Login</label>
          <input type="text" id="gerLoginUsr" placeholder="Seu login">
          <label>Senha</label>
          <input type="password" id="gerLoginSenha" placeholder="Sua senha">
          <button class="btn-primary full" id="btnGerLogin">Entrar</button>
          <div class="msg" id="gerLoginMsg"></div>
        </div>
      </div>
    </div>`;
  document.getElementById('btnGerLogin').addEventListener('click', fazerLoginGerencia);
  document.getElementById('gerLoginSenha').addEventListener('keydown', e=>{ if(e.key==='Enter') fazerLoginGerencia(); });
}

function fazerLoginGerencia(){
  const login = document.getElementById('gerLoginUsr').value.trim();
  const senha = document.getElementById('gerLoginSenha').value;
  const msg = document.getElementById('gerLoginMsg');
  const u = gerenciaUsuarios.find(x=>String(x.login).toLowerCase()===login.toLowerCase());
  if(!u || String(u.senha)!==String(senha)){
    msg.textContent = 'Login ou senha incorretos.';
    msg.className = 'msg erro';
    document.getElementById('gerLoginSenha').value = '';
    return;
  }
  gerenciaLogado = u;
  localStorage.setItem(GERENCIA_UID_KEY, u.id);
  renderSidebar();
  renderMain();
}

function sairGerencia(){
  localStorage.removeItem(GERENCIA_UID_KEY);
  gerenciaLogado = null;
  renderSidebar();
  renderMain();
}

function renderContaGerencia(){
  if(!gerenciaLogado) return '';
  return `
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div style="font-size:13px;">Conectado como <b>${gerenciaLogado.nome}</b></div>
      <div style="display:flex;gap:8px;">
        <button class="action-link" id="btnTrocarSenhaGer">Trocar senha</button>
        <button class="action-link danger" onclick="sairGerencia()">Sair da Gerência</button>
      </div>
    </div>`;
}
function ligarBotaoTrocarSenha(){
  const btn = document.getElementById('btnTrocarSenhaGer');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const nova = prompt('Digite a nova senha da Gerência:');
    if(!nova) return;
    try{
      const {error} = await supaPortal.from('gerencia_usuarios').update({senha:nova}).eq('id', gerenciaLogado.id);
      if(error) throw error;
      gerenciaLogado.senha = nova;
      alert('Senha alterada com sucesso.');
    }catch(e){ alert('Erro ao trocar senha: '+(e.message||e)); }
  });
}

// BLOCO DE NOTAS — ideias e pauta das reuniões de líderes
// ============================================================
let notaFiltroAtual = 'ideia';
let notaCategoriaFiltro = '';
let gerenciaCategorias = [];
const PRIORIDADE_LBL = {baixa:'Baixa', media:'Média', alta:'Alta'};
const PRIORIDADE_ORDEM = {alta:0, media:1, baixa:2};

async function carregarCategorias(){
  try{
    const {data, error} = await supaPortal.from('gerencia_categorias').select('*').order('nome');
    if(error) throw error;
    gerenciaCategorias = data || [];
  }catch(e){ console.warn('gerencia_categorias', e.message||e); }
}

async function renderNotas(main){
  await carregarCategorias();
  main.innerHTML = `
    ${renderContaGerencia()}
    <div class="view-header">
      <h2>Bloco de Notas</h2>
      <div class="desc">Anote ideias soltas e monte a pauta das reuniões de líderes.</div>
    </div>
    <div class="card">
      <h3>Nova anotação</h3>
      <label style="margin-top:0;">Ideia / tópico</label>
      <textarea id="notaTexto" placeholder="Ex: Conversar sobre reposição de material de limpeza..."></textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div>
          <label>Categoria</label>
          <select id="notaCategoria">
            <option value="">Sem categoria</option>
            ${gerenciaCategorias.map(c=>`<option value="${esc(c.nome)}">${esc(c.nome)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Prioridade</label>
          <select id="notaPrioridade">
            <option value="baixa">Baixa</option>
            <option value="media" selected>Média</option>
            <option value="alta">Alta</option>
          </select>
        </div>
      </div>
      <button class="action-link" id="btnNovaCategoria" style="margin-top:10px;">+ Criar nova categoria</button>
      <button class="btn-primary full" id="btnAddNota">Adicionar</button>
      <div class="msg" id="notaMsg"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
      <div class="kvtoggle" style="margin-bottom:0;">
        <button data-f="ideia" class="${notaFiltroAtual==='ideia'?'active':''}">Ideias soltas</button>
        <button data-f="pauta" class="${notaFiltroAtual==='pauta'?'active':''}">Pauta da próxima reunião</button>
        <button data-f="discutido" class="${notaFiltroAtual==='discutido'?'active':''}">Já discutido</button>

        <option value="">Todas as categorias</option>

      </select>
    </div>
    <div id="listaNotas"></div>
  `;
  ligarBotaoTrocarSenha();
  document.querySelectorAll('.kvtoggle button').forEach(b=>{
    b.addEventListener('click', ()=>{ notaFiltroAtual = b.dataset.f; renderNotas(main); });
  });
  document.getElementById('notaCategoriaFiltro').addEventListener('change', (e)=>{ notaCategoriaFiltro = e.target.value; carregarNotas(); });
  document.getElementById('btnNovaCategoria').addEventListener('click', async ()=>{
    const nome = prompt('Nome da nova categoria:');
    if(!nome || !nome.trim()) return;
    try{
      const reg = {id:crypto.randomUUID?crypto.randomUUID():'cat-'+Date.now(), nome:nome.trim()};
      const {error} = await supaPortal.from('gerencia_categorias').insert([reg]);
      if(error) throw error;
      renderNotas(main);
    }catch(e){ alert('Erro ao criar categoria: '+(e.message||e)); }
  });
  document.getElementById('btnAddNota').addEventListener('click', async ()=>{
    const texto = document.getElementById('notaTexto').value.trim();
    const categoria = document.getElementById('notaCategoria').value || null;
    const prioridade = document.getElementById('notaPrioridade').value;
    const msg = document.getElementById('notaMsg');
    if(!texto){ msg.textContent='Escreva algo antes de adicionar.'; msg.className='msg erro'; return; }
    try{
      const reg = {id:crypto.randomUUID?crypto.randomUUID():'n-'+Date.now(), texto, categoria, prioridade, status:'ideia', criado_em:new Date().toISOString()};
      const {error} = await supaPortal.from('gerencia_notas').insert([reg]);
      if(error) throw error;
      msg.textContent='Adicionada.'; msg.className='msg ok';
      renderNotas(main);
    }catch(e){ msg.textContent='Erro: '+(e.message||e); msg.className='msg erro'; }
  });
  carregarNotas();
}
async function carregarNotas(){
  const el = document.getElementById('listaNotas');
  try{
    let q = supaPortal.from('gerencia_notas').select('*').eq('status', notaFiltroAtual);
    if(notaCategoriaFiltro) q = q.eq('categoria', notaCategoriaFiltro);
    const {data, error} = await q.order('criado_em', {ascending:false});
    if(error) throw error;
    if(!data || !data.length){ el.innerHTML = '<div class="empty">Nada por aqui ainda.</div>'; return; }
    const ordenado = [...data].sort((a,b)=>(PRIORIDADE_ORDEM[a.prioridade] ?? 1)-(PRIORIDADE_ORDEM[b.prioridade] ?? 1));
    el.innerHTML = ordenado.map(n=>{
      const dataF = new Date(n.criado_em).toLocaleDateString('pt-BR');
      let acoes = '';
      if(n.status==='ideia') acoes = `<button class="action-link" onclick="moverNota('${n.id}','pauta')">Mover para pauta</button>`;
      if(n.status==='pauta') acoes = `<button class="action-link" onclick="moverNota('${n.id}','discutido')">Marcar como discutido</button> <button class="action-link" onclick="moverNota('${n.id}','ideia')">Voltar pra ideias</button>`;
      if(n.status==='discutido') acoes = `<button class="action-link" onclick="moverNota('${n.id}','ideia')">Reabrir</button>`;
      const prBadge = {alta:'erro', media:'pend', baixa:'info'}[n.prioridade] || 'info';
      return `<div class="nota-card">
        <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
          ${n.categoria ? `<span class="badge info">${esc(n.categoria)}</span>` : ''}
          <span class="badge ${prBadge}">${PRIORIDADE_LBL[n.prioridade]||'Média'}</span>
        </div>
        <div class="nota-texto" id="notaTexto_${n.id}">${esc(n.texto)}</div>
        <div class="nota-rodape">
          <span style="font-size:11.5px;color:var(--texto-suave);">${dataF}</span>
          <div>${acoes} <button class="action-link" onclick="editarNota('${n.id}')">Editar</button> <button class="action-link danger" onclick="removerNota('${n.id}')">Remover</button></div>
        </div>
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML = `<div class="msg erro" style="display:block;">Erro: ${e.message||e}</div>`; }
}
async function moverNota(id, novoStatus){
  try{ await supaPortal.from('gerencia_notas').update({status:novoStatus}).eq('id', id); carregarNotas(); }
  catch(e){ alert('Erro: '+(e.message||e)); }
}
async function editarNota(id){
  const el = document.getElementById('notaTexto_'+id);
  if(!el) return;
  const novo = prompt('Editar anotação:', el.textContent);
  if(novo === null || !novo.trim()) return;
  try{ await supaPortal.from('gerencia_notas').update({texto:novo.trim()}).eq('id', id); carregarNotas(); }
  catch(e){ alert('Erro: '+(e.message||e)); }
}
async function removerNota(id){
  if(!confirm('Remover esta anotação?')) return;
  try{ await supaPortal.from('gerencia_notas').delete().eq('id', id); carregarNotas(); }
  catch(e){ alert('Erro: '+(e.message||e)); }
}
function esc(t){ return String(t==null?'':t).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

      <input type="text" id="novoGerLogin" placeholder="Ex: maria">
      <label>Senha</label>
      <input type="text" id="novoGerSenha" placeholder="Defina uma senha">
      <button class="btn-primary full" id="btnAddGerUsuario">Criar acesso</button>
      <div class="msg" id="gerUsuarioMsg"></div>
    </div>
    <div class="card">
      <h3>Quem tem acesso à Gerência</h3>
      <div id="listaGerUsuarios"></div>
    </div>`;
  document.getElementById('btnAddGerUsuario').addEventListener('click', async ()=>{
    const nome = document.getElementById('novoGerNome').value.trim();
    const login = document.getElementById('novoGerLogin').value.trim();
    const senha = document.getElementById('novoGerSenha').value;
    const msg = document.getElementById('gerUsuarioMsg');
    if(!nome || !login || !senha){ msg.textContent='Preencha nome, login e senha.'; msg.className='msg erro'; return; }
    if(gerenciaUsuarios.some(u=>u.login.toLowerCase()===login.toLowerCase())){ msg.textContent='Já existe um acesso com esse login.'; msg.className='msg erro'; return; }
    try{
      const novo = {id:crypto.randomUUID?crypto.randomUUID():'u-'+Date.now(), nome, login, senha};
      const {error} = await supaPortal.from('gerencia_usuarios').insert([novo]);
      if(error) throw error;
      gerenciaUsuarios.push(novo);
      msg.textContent='Acesso criado.'; msg.className='msg ok';
      renderAcessosGerencia(sub);
    }catch(e){ msg.textContent='Erro: '+(e.message||e); msg.className='msg erro'; }
  });
  renderListaGerUsuarios();
}
function renderListaGerUsuarios(){
  const el = document.getElementById('listaGerUsuarios');
  if(!el) return;
  el.innerHTML = gerenciaUsuarios.map(u=>`
    <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--borda)">
      <div style="flex:1;"><b>${esc(u.nome)}</b> <span style="font-size:12px;color:var(--texto-suave)">(${esc(u.login)})</span></div>
      <button class="action-link danger" onclick="removerGerUsuario('${u.id}')">Remover</button>
    </div>`).join('');
}
async function removerGerUsuario(id){
  if(gerenciaUsuarios.length <= 1){ alert('Não é possível remover o único acesso da Gerência.'); return; }
  if(!confirm('Remover este acesso?')) return;
  try{
    await supaPortal.from('gerencia_usuarios').delete().eq('id', id);
    gerenciaUsuarios = gerenciaUsuarios.filter(u=>u.id!==id);
    renderListaGerUsuarios();
  }catch(e){ alert('Erro: '+(e.message||e)); }
}

// ============================================================
// TOPBAR
// ============================================================
function renderTopNav(){
  const nav = document.getElementById('topNav');
  nav.innerHTML = Object.entries(SETORES).map(([id,s])=>`
    <button data-setor="${id}" class="${id===setorAtual?'active':''}">
      ${s.nome}${!s.ativo?'<span class="lock">— não conectado</span>':''}
    </button>
  `).join('');
  nav.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      setorAtual = btn.dataset.setor;
      const s = SETORES[setorAtual];
      submenuAtual = s.submenus.length ? (s.submenus.find(sm=>sm.ativo)?.id || s.submenus[0].id) : null;
      renderTopNav();
      renderSidebar();
      renderMain();
    });
  });
}

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar(){
  const s = SETORES[setorAtual];
  const sidebarWrap = document.getElementById('sidebarWrap');

  // A barra lateral só faz sentido na Gerência (Usuários e Permissões, etc).
  // Nos outros setores, o sistema encaixado já tem a navegação dele mesmo —
  // manter a barra aqui só sobraria espaço vazio.
  if(setorAtual !== 'gerencia'){
    sidebarWrap.style.display = 'none';
    return;
  }
  // Sem login na Gerência, não mostra nem os nomes dos submenus.
  if(!gerenciaLogado){
    sidebarWrap.style.display = 'none';
    return;
  }
  sidebarWrap.style.display = '';

  document.getElementById('setorTitulo').textContent = s.nome;
  const el = document.getElementById('sidebarMenu');

  el.innerHTML = s.submenus.map(sm=>`
    <button data-sub="${sm.id}" class="${sm.id===submenuAtual?'active':''}" ${!sm.ativo?'disabled':''}>
      <span>${sm.nome}</span>
      ${!sm.ativo?'<span class="traco">—</span>':''}
    </button>
  `).join('');
  el.querySelectorAll('button:not(:disabled)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      submenuAtual = btn.dataset.sub;
      renderSidebar();
      renderMain();
    });
  });
}

// ============================================================
// CONTEÚDO PRINCIPAL
// ============================================================
function renderMain(){
  const main = document.getElementById('mainArea');
  const s = SETORES[setorAtual];
  main.classList.remove('encaixado');

  if(!s.ativo){
    main.innerHTML = `
      <div class="bloqueado-msg">
        <div class="icone">⏳</div>
        <h3>${s.nome} ainda não está conectado</h3>
        <p>Esse setor está no roteiro, mas ainda não tem sistema ligado ao portal. Assim que ficar pronto, aparece aqui automaticamente.</p>
      </div>`;
    return;
  }

  if(setorAtual === 'gerencia' && !gerenciaLogado){
    renderLoginGerencia(main);
    return;
  }

  if(setorAtual === 'gerencia' && submenuAtual === 'notas'){
    renderNotas(main);
    return;
  }

  if(setorAtual === 'gerencia' && submenuAtual === 'dash_dp'){
    renderDashDP(main);
    return;
  }

  if(setorAtual === 'gerencia' && submenuAtual === 'dash_manutencao'){
    renderDashManutencao(main);
    return;
  }

  if(setorAtual === 'gerencia' && submenuAtual === 'dash_voucher'){
    renderDashVoucher(main);
    return;
  }

  if(setorAtual === 'gerencia' && submenuAtual === 'config'){
    renderConfigGerencia(main);
    return;
  }

  // Se o setor já tem um sistema real hospedado, encaixa ele via iframe —
  // o próprio sistema cuida da navegação interna dele (Chamados, Equipe,
  // etc.), então não precisamos recriar isso na casca do Portal.
  if(s.url){
    main.classList.add('encaixado');
    main.innerHTML = `
      <div style="height:calc(100vh - var(--topbar-h) - 22px);border:1px solid var(--borda);border-radius:var(--radius);overflow:hidden;background:#fff;">
        <iframe src="${s.url}" style="width:100%;height:100%;border:none;" title="${s.nome}"></iframe>
      </div>`;
    return;
  }

  const sub = s.submenus.find(sm=>sm.id===submenuAtual);
  if(sub && !sub.ativo){
    main.innerHTML = `
      <div class="bloqueado-msg">
        <div class="icone">⏳</div>
        <h3>${sub.nome} ainda não está conectado</h3>
        <p>Esse submenu está previsto, mas ainda não tem sistema ligado.</p>
      </div>`;
    return;
  }

  main.innerHTML = `
    <div class="view-header">
      <h2>${sub ? sub.nome : ''}</h2>
      <div class="desc">Este módulo ainda será conectado ao portal.</div>
    </div>
    <div class="card">
      <div class="empty">Espaço reservado para o sistema de "${sub?sub.nome:''}".</div>
    </div>`;
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================
(async function iniciar(){
  await carregarGerenciaUsuarios();
  renderTopNav();
  renderSidebar();
  renderMain();
})();
</script>

</body>
</html>
