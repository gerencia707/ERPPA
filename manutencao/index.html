function baixarCSVDetalhado(){
  var y=ST.relY,m=ST.relM;
  var mi=y+'-'+pad(m+1)+'-01', mf=y+'-'+pad(m+1)+'-'+pad(new Date(y,m+1,0).getDate());
  function nm(iso){var s=String(iso||'').slice(0,10);return s>=mi&&s<=mf;}
  var ch=(ST.data.chamados||[]).filter(function(c){return nm(c.criadoEm)||nm(c.concluidoEm);});
  ch.sort(function(a,b){return String(b.criadoEm||'').localeCompare(String(a.criadoEm||''));});
  var sep=';'; // ponto e virgula para Excel Brasil
  var hd=['local','tipoLocal','areaTecnica','prioridade','status','criadoPor','tecnico','concluidoPor','criadoEm','concluidoEm','reaberturas','reabertoPor','reabertoEm','descricao'];
  var labels=['Apto/Local','Tipo','Area Tecnica','Prioridade','Status','Aberto por','Tecnico','Concluido por','Data Abertura','Data Conclusao','Reaberturas','Reaberto por','Reaberto em','Observacoes'];
  var rows=[labels.join(sep)];
  ch.forEach(function(c){
    rows.push(hd.map(function(h){
      var val=String(c[h]||'');
      // Formatar datas
      if((h==='criadoEm'||h==='concluidoEm')&&val){
        try{var d=new Date(val);val=d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch(e){}
      }
      // Escapar aspas e separador
      val=val.replace(/"/g,'""');
      return '"'+val+'"';
    }).join(sep));
  });
  // BOM UTF-8 para Excel reconhecer acentos
  var BOM=String.fromCharCode(65279);
  var blob=new Blob([BOM+rows.join(String.fromCharCode(13,10))],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='chamados_'+MESES[m]+'_'+y+'.csv';
  a.click();
}

function baixarCSV(){
  var ch=ST.data.chamados||[];
  var hd=['criadoPor','concluidoPor','tipoLocal','local','areaTecnica','prioridade','descricao','status','criadoEm','concluidoEm'];
  var rows=[hd.join(',')];
  ch.forEach(function(c){rows.push(hd.map(function(h){return '"'+String(c[h]||'').replace(/"/g,'""')+'"';}).join(','));});
  var blob=new Blob([rows.join(String.fromCharCode(10))],{type:'text/csv'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chamados_'+todayISO()+'.csv';a.click();
}

function renderHistorico() {
  var ch=ST.data.chamados||[];
  var histTab=ST.histTab||'aptos';
  var histFiltro=ST.histFiltro||''; // apto ou area selecionado
  var histPeriodo=ST.histPeriodo||'tudo';
  var histBusca=ST.histBusca||'';

  // Abas
  var tabs='<div class="kvtoggle" style="margin-bottom:14px">'+
    '<button class="'+(histTab==='aptos'?'active':'')+'" id="histtb-aptos" onclick="setHistTab(this)"><i class="ti ti-building"></i> Apartamentos</button>'+
    '<button class="'+(histTab==='areas'?'active':'')+'" id="histtb-areas" onclick="setHistTab(this)"><i class="ti ti-tools"></i> Areas comuns</button>'+
    '<button class="'+(histTab==='tecnicos'?'active':'')+'" id="histtb-tecnicos" onclick="setHistTab(this)"><i class="ti ti-users"></i> Tecnicos</button>'+
    '<button class="'+(histTab==='busca'?'active':'')+'" id="histtb-busca" onclick="setHistTab(this)"><i class="ti ti-search"></i> Busca global</button>'+
  '</div>';

  if(histTab==='busca') return tabs+renderHistBusca(ch);
  if(histTab==='tecnicos') return tabs+renderHistTecnicos(ch);

  // Filtro de periodo
  var perTab='<div class="row" style="margin-bottom:12px">'+
    '<span style="font-size:13px;color:#6b7770">Periodo:</span>'+
    ['tudo','mes','tri'].map(function(p){
      var labels={tudo:'Todo historico',mes:'Ultimo mes',tri:'Ultimos 3 meses'};
      return '<button class="btn sm '+(histPeriodo===p?'':'sec')+'" id="histper-'+p+'" onclick="setHistPer(this)">'+labels[p]+'</button>';
    }).join('')+
  '</div>';

  // Filtrar por periodo
  function filtrarPer(lista){
    if(histPeriodo==='tudo') return lista;
    var hoje=new Date();
    var meses=histPeriodo==='mes'?1:3;
    var limit=new Date(hoje); limit.setMonth(hoje.getMonth()-meses);
    var limitStr=limit.getFullYear()+'-'+pad(limit.getMonth()+1)+'-'+pad(limit.getDate());
    return lista.filter(function(x){return String(x.criadoEm||'').slice(0,10)>=limitStr;});
  }

  // Calcular saude (chamados nos ultimos 3 meses)
  function getSaude(qtd3m){
    if(qtd3m===0) return {cls:'',label:''};
    if(qtd3m<=2)  return {cls:'saude-verde',label:'Bom'};
    if(qtd3m<=5)  return {cls:'saude-amarelo',label:'Atencao'};
    return {cls:'saude-vermelho',label:'Critico'};
  }
  var hoje3m=new Date(); hoje3m.setMonth(hoje3m.getMonth()-3);
  var limit3m=hoje3m.getFullYear()+'-'+pad(hoje3m.getMonth()+1)+'-'+pad(hoje3m.getDate());

  if(histFiltro){
    // Mostrar historico detalhado de um local/area especifico
    var chFiltro=filtrarPer(ch.filter(function(x){
      return histTab==='aptos'?String(x.local)===String(histFiltro)&&x.tipoLocal==='apartamento':
             String(x.local)===String(histFiltro)&&x.tipoLocal!=='apartamento';
    }));
    chFiltro.sort(function(a,b){return String(b.criadoEm||'').localeCompare(String(a.criadoEm||''));});
    var total3m=ch.filter(function(x){return String(x.local)===String(histFiltro)&&String(x.criadoEm||'').slice(0,10)>=limit3m;}).length;
    var saude=getSaude(total3m);
    var tmMedio=0, tmCount=0;
    chFiltro.forEach(function(x){
      if(x.criadoEm&&x.concluidoEm){
        var diff=(new Date(x.concluidoEm)-new Date(x.criadoEm))/60000;
        if(diff>0&&diff<43200){tmMedio+=diff;tmCount++;}
      }
    });

    return tabs+perTab+
      '<div class="between" style="margin-bottom:12px">'+
        '<div>'+
          '<h3 style="font-size:18px;font-weight:700;color:#1B4332">'+esc(histFiltro)+'</h3>'+
          (saude.cls?'<span class="badge" style="margin-top:4px;background:'+(saude.cls==='saude-verde'?'#e1f5e7':saude.cls==='saude-amarelo'?'#fff4e1':'#fde2e1')+';color:'+(saude.cls==='saude-verde'?'#1f7a3a':saude.cls==='saude-amarelo'?'#a06000':'#c0392b')+'">'+saude.label+' ('+total3m+' chamados em 3 meses)</span>':
            '<span style="font-size:13px;color:#6b7770">Sem chamados recentes</span>')+
        '</div>'+
        '<div class="row">'+
          (tmCount?'<span style="font-size:13px;color:#6b7770">Tempo medio: <strong>'+fmtTempo(tmMedio/tmCount)+'</strong></span>':'') +
          '<button class="btn sm sec" onclick="ST.histFiltro=\'\';render()"><i class="ti ti-arrow-left"></i> Voltar</button>'+
        '</div>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">'+
        crd('Total chamados',chFiltro.length,'')+
        crd('Concluidos',chFiltro.filter(function(x){return x.status==='Concluido';}).length,'')+
        crd('Reaberturas',chFiltro.reduce(function(s,x){return s+Number(x.reaberturas||0);},0),'')+
        crd('Urgentes',chFiltro.filter(function(x){return x.prioridade==='Urgente';}).length,'')+
      '</div>'+
      '<div class="card" style="padding:0;overflow:hidden">'+
      (chFiltro.length?
        '<table class="cht"><thead><tr><th>Data</th><th>Area</th><th>Prioridade</th><th>Descricao</th><th>Status</th><th>Aberto por</th><th>Concluido por</th><th>Tempo</th></tr></thead><tbody>'+
        chFiltro.map(function(x){
          var tempo='';
          if(x.criadoEm&&x.concluidoEm){
            var diff=(new Date(x.concluidoEm)-new Date(x.criadoEm))/60000;
            if(diff>0&&diff<43200) tempo=fmtTempo(diff);
          }
          return '<tr>'+
            '<td style="font-size:11px;white-space:nowrap">'+String(x.criadoEm||'').slice(0,10)+'</td>'+
            '<td>'+esc(x.areaTecnica||'-')+'</td>'+
            '<td><span class="badge p-'+esc(x.prioridade||'Media')+'">'+esc(x.prioridade||'-')+'</span></td>'+
            '<td style="font-size:12px;color:#555">'+esc(x.descricao||'-')+'</td>'+
            '<td><span class="badge '+(x.status==='Concluido'?'concluido':'aberto')+'">'+esc(x.status)+'</span></td>'+
            '<td style="font-size:12px">'+esc(x.criadoPor||'-')+'</td>'+
            '<td style="font-size:12px;color:#2D6A4F">'+esc(x.concluidoPor||'-')+'</td>'+
            '<td style="font-size:11px;color:#6b7770;white-space:nowrap">'+tempo+'</td>'+
          '</tr>';
        }).join('')+'</tbody></table>':
        '<div style="padding:20px;text-align:center;color:#6b7770">Nenhum chamado no periodo.</div>')+
      '</div>';
  }

  // Lista de aptos ou areas
  var locais=[];
  if(histTab==='aptos'){
    ST.data.apartamentos.forEach(function(n){
      var chLocal=ch.filter(function(x){return String(x.local)===String(n)&&x.tipoLocal==='apartamento';});
      var ch3m=chLocal.filter(function(x){return String(x.criadoEm||'').slice(0,10)>=limit3m;}).length;
      if(chLocal.length) locais.push({nome:n,total:chLocal.length,rec:ch3m,saude:getSaude(ch3m)});
    });
  } else {
    var areasComuns=(ST.data.config&&ST.data.config.areasComuns)||[];
    areasComuns.forEach(function(n){
      var chLocal=ch.filter(function(x){return String(x.local)===String(n)&&x.tipoLocal!=='apartamento';});
      var ch3m=chLocal.filter(function(x){return String(x.criadoEm||'').slice(0,10)>=limit3m;}).length;
      if(chLocal.length) locais.push({nome:n,total:chLocal.length,rec:ch3m,saude:getSaude(ch3m)});
    });
  }
  // Ordenar aptos numericamente, areas alfabeticamente
  if(histTab==='aptos'){
    locais.sort(function(a,b){return Number(a.nome)-Number(b.nome);});
  } else {
    locais.sort(function(a,b){return String(a.nome).localeCompare(String(b.nome));});
  }

  return tabs+perTab+
    (locais.length?
      '<div class="hist-grid">'+
      locais.map(function(l){
        return '<div class="hist-apt '+l.saude.cls+'" data-loc="'+esc(l.nome)+'" onclick="setHistFiltroEl(this)">'+
          esc(l.nome)+
          '<div class="hcount">'+l.total+' chamados</div>'+
          (l.saude.label?'<div class="hsaude" style="color:'+(l.saude.cls==='saude-verde'?'#52B788':l.saude.cls==='saude-amarelo'?'#f1c40f':'#c0392b')+'">'+l.saude.label+'</div>':'')+
        '</div>';
      }).join('')+'</div>':
      '<div class="card" style="text-align:center;padding:30px;color:#6b7770">Nenhum chamado registrado ainda.</div>');
}

function setHistTab(el){
  var id=el.id||'';
  ST.histFiltro='';
  if(id.indexOf('areas')>=0) ST.histTab='areas';
  else if(id.indexOf('tecnicos')>=0) ST.histTab='tecnicos';
  else if(id.indexOf('busca')>=0) ST.histTab='busca';
  else ST.histTab='aptos';
  render();
}
function setHistPer(el){
  var id=el.id||'';
  ST.histPeriodo=id.indexOf('mes')>=0?'mes':id.indexOf('tri')>=0?'tri':'tudo';
  render();
}
function setHistFiltroEl(el){ST.histFiltro=el.getAttribute('data-loc');render();}

function fmtTempo(min){
  if(min<60) return Math.round(min)+'min';
  if(min<1440) return Math.round(min/60)+'h'+Math.round(min%60)+'min';
  return Math.round(min/1440)+'d';
}

function renderHistTecnicos(ch){
  var histFiltro=ST.histFiltro||'';
  var histPeriodo=ST.histPeriodo||'tudo';

  function filtrarPer(lista){
    if(histPeriodo==='tudo') return lista;
    var hoje=new Date(); var meses=histPeriodo==='mes'?1:3;
    var limit=new Date(hoje); limit.setMonth(hoje.getMonth()-meses);
    var limitStr=limit.getFullYear()+'-'+pad(limit.getMonth()+1)+'-'+pad(limit.getDate());
    return lista.filter(function(x){return String(x.criadoEm||'').slice(0,10)>=limitStr;});
  }

  var perTab='<div class="row" style="margin-bottom:12px">'+
    '<span style="font-size:13px;color:#6b7770">Periodo:</span>'+
    ['tudo','mes','tri'].map(function(p){
      var labels={tudo:'Todo historico',mes:'Ultimo mes',tri:'Ultimos 3 meses'};
      return '<button class="btn sm '+(histPeriodo===p?'':'sec')+'" id="histper-'+p+'" onclick="setHistPer(this)">'+labels[p]+'</button>';
    }).join('')+'</div>';

  if(histFiltro){
    var chTec=filtrarPer(ch.filter(function(x){return x.concluidoPor===histFiltro||x.criadoPor===histFiltro;}));
    chTec.sort(function(a,b){return String(b.criadoEm||'').localeCompare(String(a.criadoEm||''));});
    var concluidos=chTec.filter(function(x){return x.concluidoPor===histFiltro&&x.status==='Concluido';});
    var reabs=chTec.reduce(function(s,x){return s+(Number(x.reaberturas||0)>0&&x.concluidoPor===histFiltro?Number(x.reaberturas):0);},0);
    var tmMedio=0,tmCount=0;
    concluidos.forEach(function(x){
      if(x.criadoEm&&x.concluidoEm){var diff=(new Date(x.concluidoEm)-new Date(x.criadoEm))/60000;if(diff>0&&diff<43200){tmMedio+=diff;tmCount++;}}
    });
    return perTab+
      '<div class="between" style="margin-bottom:12px">'+
        '<h3 style="font-size:18px;font-weight:700;color:#1B4332"><i class="ti ti-user"></i> '+esc(histFiltro)+'</h3>'+
        '<button class="btn sm sec" onclick="ST.histFiltro=\'\';render()"><i class="ti ti-arrow-left"></i> Voltar</button>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">'+
        crd('Abriu',chTec.filter(function(x){return x.criadoPor===histFiltro;}).length,'')+
        crd('Concluiu',concluidos.length,'')+
        crd('Reaberturas',reabs,reabs>0?'urgente':'')+
        crd('Tempo medio',tmCount?fmtTempo(tmMedio/tmCount):'-','')+
      '</div>'+
      '<div class="card" style="padding:0;overflow:hidden">'+
      (chTec.length?'<table class="cht"><thead><tr><th>Data</th><th>Local</th><th>Area</th><th>Descricao</th><th>Status</th><th>Papel</th></tr></thead><tbody>'+
        chTec.map(function(x){
          var papel=x.concluidoPor===histFiltro&&x.criadoPor===histFiltro?'Abriu e concluiu':x.concluidoPor===histFiltro?'Concluiu':'Abriu';
          return '<tr>'+
            '<td style="font-size:11px">'+String(x.criadoEm||'').slice(0,10)+'</td>'+
            '<td><strong>'+esc(x.local||'-')+'</strong></td>'+
            '<td>'+esc(x.areaTecnica||'-')+'</td>'+
            '<td style="font-size:12px;color:#555">'+esc(x.descricao||'-')+'</td>'+
            '<td><span class="badge '+(x.status==='Concluido'?'concluido':'aberto')+'">'+esc(x.status)+'</span></td>'+
            '<td style="font-size:11px;color:#2D6A4F;font-weight:600">'+papel+'</td>'+
          '</tr>';
        }).join('')+'</tbody></table>':
        '<div style="padding:20px;text-align:center;color:#6b7770">Nenhum chamado no periodo.</div>')+
      '</div>';
  }

  // Lista de tecnicos
  var tecs={};
  ch.forEach(function(x){
    if(x.criadoPor){if(!tecs[x.criadoPor])tecs[x.criadoPor]={abriu:0,concluiu:0,reab:0};tecs[x.criadoPor].abriu++;}
    if(x.concluidoPor&&x.status==='Concluido'){if(!tecs[x.concluidoPor])tecs[x.concluidoPor]={abriu:0,concluiu:0,reab:0};tecs[x.concluidoPor].concluiu++;tecs[x.concluidoPor].reab+=Number(x.reaberturas||0);}
  });
  var tecList=Object.keys(tecs).map(function(k){return {nome:k,abriu:tecs[k].abriu,concluiu:tecs[k].concluiu,reab:tecs[k].reab};}).sort(function(a,b){return b.concluiu-a.concluiu;});

  return perTab+
    '<div class="card" style="padding:0;overflow:hidden">'+
    (tecList.length?'<table class="cht"><thead><tr><th>Tecnico</th><th>Abriu</th><th>Concluiu</th><th>Reaberturas</th><th></th></tr></thead><tbody>'+
      tecList.map(function(t){
        return '<tr>'+
          '<td><strong>'+esc(t.nome)+'</strong></td>'+
          '<td style="text-align:center">'+t.abriu+'</td>'+
          '<td style="text-align:center;color:#2D6A4F;font-weight:600">'+t.concluiu+'</td>'+
          '<td style="text-align:center;color:'+(t.reab>0?'#c0392b':'#6b7770')+';font-weight:'+(t.reab>0?'700':'400')+'">'+t.reab+'</td>'+
          '<td><button class="btn sm sec" data-loc="'+esc(t.nome)+'" onclick="setHistFiltroEl(this)"><i class="ti ti-history"></i> Ver historico</button></td>'+
        '</tr>';
      }).join('')+'</tbody></table>':
      '<div style="padding:20px;text-align:center;color:#6b7770">Nenhum dado disponivel.</div>')+
    '</div>';
}

function renderHistBusca(ch){
  var histBusca=ST.histBusca||'';
  var html='<div class="row" style="margin-bottom:14px">'+
    '<input id="hist-busca-inp" value="'+esc(histBusca)+'" placeholder="Buscar em todos os chamados... (apto, area, descricao, tecnico)" style="flex:1;font-size:14px" oninput="ST.histBusca=this.value;renderBuscaHist()">'+
    '<button class="btn sec sm" onclick="ST.histBusca=\'\';document.getElementById(\'hist-busca-inp\').value=\'\';renderBuscaHist()"><i class="ti ti-x"></i></button>'+
  '</div><div id="hist-busca-res"></div>';

  // Renderizar resultados iniciais
  setTimeout(function(){renderBuscaHist();},50);
  return html;
}

function renderBuscaHist(){
  var inp=document.getElementById('hist-busca-inp');
  var res=document.getElementById('hist-busca-res');
  if(!inp||!res) return;
  var q=(inp.value||'').toLowerCase().trim();
  if(!q){res.innerHTML='<div style="text-align:center;color:#6b7770;padding:20px">Digite para buscar em todos os chamados.</div>';return;}
  var ch=ST.data.chamados||[];
  var filtrados=ch.filter(function(x){
    return String(x.local||'').toLowerCase().indexOf(q)>=0||
           String(x.areaTecnica||'').toLowerCase().indexOf(q)>=0||
           String(x.descricao||'').toLowerCase().indexOf(q)>=0||
           String(x.criadoPor||'').toLowerCase().indexOf(q)>=0||
           String(x.concluidoPor||'').toLowerCase().indexOf(q)>=0||
           String(x.tecnico||'').toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){return String(b.criadoEm||'').localeCompare(String(a.criadoEm||''));});

  if(!filtrados.length){res.innerHTML='<div style="text-align:center;color:#6b7770;padding:20px">Nenhum resultado para "'+esc(q)+'".</div>';return;}
  res.innerHTML='<div style="font-size:13px;color:#6b7770;margin-bottom:8px">'+filtrados.length+' resultado(s) para "'+esc(q)+'"</div>'+
    '<div class="card" style="padding:0;overflow:hidden">'+
    '<table class="cht"><thead><tr><th>Local</th><th>Area</th><th>Prioridade</th><th>Descricao</th><th>Status</th><th>Aberto por</th><th>Data</th></tr></thead><tbody>'+
    filtrados.slice(0,50).map(function(x){
      return '<tr>'+
        '<td><strong>'+esc(x.local||'-')+'</strong></td>'+
        '<td>'+esc(x.areaTecnica||'-')+'</td>'+
        '<td><span class="badge p-'+esc(x.prioridade||'Media')+'">'+esc(x.prioridade||'-')+'</span></td>'+
        '<td style="font-size:12px;color:#555">'+esc(x.descricao||'-')+'</td>'+
        '<td><span class="badge '+(x.status==='Concluido'?'concluido':'aberto')+'">'+esc(x.status)+'</span></td>'+
        '<td style="font-size:12px">'+esc(x.criadoPor||'-')+'</td>'+
        '<td style="font-size:11px;color:#6b7770">'+String(x.criadoEm||'').slice(0,10)+'</td>'+
      '</tr>';
    }).join('')+'</tbody></table></div>';
}

function renderGastos() {
  var hoje=new Date();
  var mesAtual=hoje.getFullYear()+'-'+pad(hoje.getMonth()+1);
  var gastosTab=ST.gastosTab||mesAtual;
  var gastos=ST.data.gastos||[];
  var lancs=ST.data.lancamentos||[];

  // Meses disponiveis (6 meses)
  var meses=[];
  var dm=new Date(hoje);
  for(var i=0;i<6;i++){
    var ms=dm.getFullYear()+'-'+pad(dm.getMonth()+1);
    var label=MESES[dm.getMonth()]+' '+dm.getFullYear();
    meses.push({val:ms,label:label});
    dm.setMonth(dm.getMonth()-1);
  }

  var mesSel=meses.find(function(m){return m.val===gastosTab;})||meses[0];
  var gastoMes=gastos.find(function(g){return g.mes===gastosTab;})||{orcamento:0};
  var lancsMes=lancs.filter(function(l){return l.mes===gastosTab;});
  lancsMes.sort(function(a,b){return String(b.lancado_em||'').localeCompare(String(a.lancado_em||''));});

  var orcamento=Number(gastoMes.orcamento||0);
  var totalGasto=lancsMes.reduce(function(s,l){return s+Number(l.valor||0);},0);
  var saldo=orcamento-totalGasto;
  var pct=orcamento>0?Math.min(100,Math.round(totalGasto*100/orcamento)):0;
  var corBarra=pct>=100?'#c0392b':pct>=80?'#e67e22':'#2D6A4F';

  // Formatar moeda
  function fmtR(v){return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}

  var h='<div class="between" style="margin-bottom:16px">'+
    '<div class="row">'+
      '<select onchange="ST.gastosTab=this.value;render()" style="width:auto">'+
        meses.map(function(m){return '<option value="'+m.val+'"'+(m.val===gastosTab?' selected':'')+'>'+m.label+'</option>';}).join('')+
      '</select>'+
    '</div>'+
    (isAdmin()?'<button class="btn sm sec" onclick="abrirOrcamento()"><i class="ti ti-pencil"></i> Definir orcamento</button>':'')+
  '</div>'+

  // Card de controle no topo
  '<div class="card" style="margin-bottom:16px;border:'+(pct>=100?'2px solid #c0392b':'1px solid #E0E8E2')+'">'+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px">'+
      '<div>'+
        '<div style="font-size:11px;color:#6b7770;font-weight:600;text-transform:uppercase">Orcamento</div>'+
        '<div style="font-size:24px;font-weight:800;color:#1B4332">'+(orcamento?fmtR(orcamento):'Nao definido')+'</div>'+
      '</div>'+
      '<div>'+
        '<div style="font-size:11px;color:#6b7770;font-weight:600;text-transform:uppercase">Total gasto</div>'+
        '<div style="font-size:24px;font-weight:800;color:'+(pct>=80?'#c0392b':'#2D6A4F')+'">'+fmtR(totalGasto)+'</div>'+
      '</div>'+
      '<div>'+
        '<div style="font-size:11px;color:#6b7770;font-weight:600;text-transform:uppercase">Saldo</div>'+
        '<div style="font-size:24px;font-weight:800;color:'+(saldo<0?'#c0392b':saldo<orcamento*0.2?'#e67e22':'#2D6A4F')+'">'+fmtR(saldo)+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="gasto-barra">'+
      '<div class="gasto-fill" style="width:'+pct+'%;background:'+corBarra+'">'+
        (pct>15?pct+'%':'')+
      '</div>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;color:#6b7770;margin-top:4px">'+
      '<span>0%</span>'+
      '<span style="color:'+corBarra+';font-weight:700">'+pct+'% utilizado</span>'+
      '<span>100%</span>'+
    '</div>'+
    (pct>=100?'<div style="margin-top:10px;background:#fde2e1;color:#c0392b;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;text-align:center"><i class="ti ti-alert-triangle"></i> Orcamento estourado em '+fmtR(Math.abs(saldo))+'</div>':
     pct>=80?'<div style="margin-top:10px;background:#fff4e1;color:#a06000;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;text-align:center"><i class="ti ti-alert-circle"></i> Atencao: '+fmtR(saldo)+' restantes ('+( 100-pct)+'%)</div>':'')+
  '</div>'+

  // Botao novo lancamento
  '<button class="btn" style="margin-bottom:14px;width:100%" onclick="abrirLancamento()"><i class="ti ti-plus"></i> Novo lancamento</button>'+

  // Lista de lancamentos
  '<div class="section" style="margin-top:0"><h3 class="titulo"><i class="ti ti-list"></i> Lancamentos de '+mesSel.label+' ('+lancsMes.length+')</h3>'+
  (lancsMes.length?
    '<div class="card" style="padding:0;overflow:hidden">'+
    // Totais por categoria
    (function(){
      var cats={};
      lancsMes.forEach(function(l){var k=l.categoria||'Outros';cats[k]=(cats[k]||0)+Number(l.valor||0);});
      var catKeys=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});
      if(!catKeys.length) return '';
      return '<div style="display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#F5F7F5;border-bottom:1px solid #E0E8E2">'+
        catKeys.map(function(k){return '<span style="background:#eef4ef;color:#1B4332;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:600">'+esc(k)+': '+fmtR(cats[k])+'</span>';}).join('')+
      '</div>';
    })()+
    lancsMes.map(function(l){
      return '<div class="lanc-row">'+
        '<div style="flex:1;min-width:140px">'+
          '<div style="font-weight:700;font-size:14px;color:#1B4332">'+esc(l.fornecedor||'-')+'</div>'+
          (l.categoria?'<span style="font-size:11px;background:#eef4ef;color:#2D6A4F;padding:1px 6px;border-radius:6px;font-weight:600">'+esc(l.categoria)+'</span>':'')+
          (l.obs?'<div style="font-size:12px;color:#555;margin-top:3px">'+esc(l.obs)+'</div>':'')+
        '</div>'+
        '<div style="text-align:right;min-width:100px">'+
          '<div style="font-size:18px;font-weight:800;color:#c0392b">'+fmtR(l.valor)+'</div>'+
          '<div style="font-size:11px;color:#6b7770">'+fmtDT(l.lancado_em)+'</div>'+
          '<div style="font-size:11px;color:#6b7770">por: '+esc(l.lancado_por||'-')+'</div>'+
        '</div>'+
        (isSupervisor()?
          '<button class="btn sm danger" data-lid="'+l.id+'" onclick="delLancEl(this)"><i class="ti ti-trash"></i></button>':'')+
      '</div>';
    }).join('')+'</div>':
    '<div class="card" style="text-align:center;padding:24px;color:#6b7770">Nenhum lancamento em '+mesSel.label+'.</div>')+
  '</div>';

  return h;
}

function abrirOrcamento(){
  var hoje=new Date();
  var mesAtual=ST.gastosTab||(hoje.getFullYear()+'-'+pad(hoje.getMonth()+1));
  var gastos=ST.data.gastos||[];
  var gastoMes=gastos.find(function(g){return g.mes===mesAtual;})||{orcamento:0};
  openModal('Definir orcamento - '+MESES[Number(mesAtual.split('-')[1])-1]+' '+mesAtual.split('-')[0],
    '<div class="form-field" style="margin-top:8px"><label>Valor orcado (R$)</label>'+
    '<input id="orc-val" type="number" min="0" step="0.01" value="'+Number(gastoMes.orcamento||0).toFixed(2)+'" placeholder="0,00"></div>',
    [{l:'Cancelar',c:'sec',f:closeModal},{l:'Salvar',c:'',f:function(){
      var val=parseFloat(document.getElementById('orc-val').value)||0;
      call('salvarOrcamento',{mes:mesAtual,orcamento:val,criado_por:ST.user},function(){
        closeModal();reload();
      });
    }}]);
}

function abrirLancamento(){
  if(!reqUser()) return;
  var hoje=new Date();
  var mesAtual=ST.gastosTab||(hoje.getFullYear()+'-'+pad(hoje.getMonth()+1));
  openModal('Novo lancamento',

function renderRanking() {
  var pontos=ST.data.pontos||[];
  var hoje=new Date();
  var mesAtual=hoje.getFullYear()+'-'+pad(hoje.getMonth()+1);

  // Filtrar por mes
  var ST_relMes=ST.rankMes||mesAtual;
  var meses=[]; var m=new Date(hoje);
  for(var i=0;i<6;i++){
    var ms=m.getFullYear()+'-'+pad(m.getMonth()+1);
    if(!meses.find(function(x){return x.val===ms;})) meses.push({val:ms,label:['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][m.getMonth()]+' '+m.getFullYear()});
    m.setMonth(m.getMonth()-1);
  }

  var pMes=pontos.filter(function(p){return String(p.criado_em||'').slice(0,7)===ST_relMes;});

  // Calcular totais por usuario
  var totais={};
  pMes.forEach(function(p){
    var k=p.usuario_nome||'-';
    if(!totais[k]) totais[k]={nome:k,total:0,pos:0,neg:0,qtd:0};
    totais[k].total+=Number(p.pontos||0);
    totais[k].qtd++;
    if(p.pontos>0) totais[k].pos+=Number(p.pontos);
    else totais[k].neg+=Number(p.pontos);
  });

  var rank=Object.values(totais).sort(function(a,b){return b.total-a.total;});

  var mesSel=meses.find(function(m){return m.val===ST_relMes;})||meses[0];
  var h='<div class="between" style="margin-bottom:16px">'+
    '<h3 class="titulo" style="margin:0"><i class="ti ti-trophy" style="color:#FFD700"></i> Ranking de '+mesSel.label+'</h3>'+
    '<select onchange="ST.rankMes=this.value;render()" style="width:auto">'+
      meses.map(function(m){return '<option value="'+m.val+'"'+(m.val===ST_relMes?' selected':'')+'>'+m.label+'</option>';}).join('')+
    '</select>'+
  '</div>';

  if(!rank.length){
    h+='<div class="card" style="text-align:center;padding:30px;color:#6b7770"><i class="ti ti-trophy" style="font-size:40px;display:block;margin-bottom:8px;opacity:.3"></i>Nenhuma atividade registrada neste mes.</div>';
  } else {
    h+='<div style="margin-bottom:20px">';
    rank.forEach(function(u,i){
      var pos=i+1;
      var pcls=pos===1?'p1':pos===2?'p2':pos===3?'p3':'pn';
      var rankCls=pos===1?'rank-1':pos===2?'rank-2':pos===3?'rank-3':'';
      var medalIcon=pos===1?'ti-trophy':pos===2?'ti-medal':pos===3?'ti-award':'ti-user';
      var barW=rank.length?Math.min(100,Math.round(u.total*100/(rank[0].total||1))):0;
      var barClr=pos===1?'#f59e0b':pos===2?'#94a3b8':pos===3?'#cd7f32':'#52B788';
      h+='<div class="rank-card '+rankCls+'">'+
        '<div class="rank-pos '+pcls+'"><i class="ti '+medalIcon+'" style="font-size:18px"></i></div>'+
        '<div class="rank-info" style="flex:1">'+
          '<div class="rank-nome">'+esc(u.nome)+'</div>'+
          '<div style="margin-top:5px;height:6px;background:#E0E8E2;border-radius:3px;overflow:hidden">'+
            '<div style="height:100%;background:'+barClr+';width:'+barW+'%;transition:.5s"></div>'+
          '</div>'+
          '<div class="rank-pts" style="margin-top:4px">'+
            '<span style="color:#2D6A4F;font-weight:600">+'+u.pos+' pts</span>'+
            (u.neg?'  <span style="color:#c0392b">'+u.neg+' pts</span>':'')+
            '  <span style="color:#6b7770;font-size:11px">&bull; '+u.qtd+' acoes</span>'+
          '</div>'+
        '</div>'+
        '<div style="text-align:right;min-width:60px">'+
          '<div style="font-size:26px;font-weight:800;color:'+barClr+'">'+u.total+'</div>'+
          '<div style="font-size:10px;color:#6b7770;font-weight:600;text-transform:uppercase">pontos</div>'+
          '<div style="font-size:12px;font-weight:700;color:#6b7770">#'+pos+'</div>'+
        '</div>'+
      '</div>';
    });
    h+='</div>';
  }

  // Historico de pontos do usuario logado
  var meusPts=pMes.filter(function(p){return p.usuario_nome===ST.user;});
  if(meusPts.length){
    h+='<div class="section"><h3 class="titulo"><i class="ti ti-list"></i> Meu historico este mes</h3>'+
      '<div class="pts-log">'+
      meusPts.slice(0,20).map(function(p){
        var pos=p.pontos>0;
        return '<div class="pts-row">'+
          '<span class="pts-badge '+(pos?'pts-pos':'pts-neg')+'">'+(pos?'+':'')+p.pontos+'pts</span>'+
          '<div style="flex:1">'+esc(p.descricao||'')+'</div>'+
          '<div style="font-size:11px;color:#6b7770">'+fmtDT(p.criado_em)+'</div>'+
        '</div>';
      }).join('')+
      '</div></div>';
  }

  return h;
}

function renderTrein() {
  var trein=ST.data.treinamentos||[];
  var pergs=ST.data.quizPerguntas||[];
  var resps=ST.data.quizRespostas||[];
  var mes=new Date().toISOString().slice(0,7);
  var isAdmin=ST.data.usuarios&&ST.data.usuarios.find(function(u){return u.nome===ST.user&&u.perfil==='admin';});

  var h='';
  if(isAdmin){
    h+='<div class="between" style="margin-bottom:14px">'+
      '<h3 class="titulo" style="margin:0"><i class="ti ti-school"></i> Treinamentos</h3>'+
      '<button class="btn sm" onclick="abrirTreinForm()"><i class="ti ti-plus"></i> Novo treinamento</button>'+
    '</div>';
  } else {
    h+='<h3 class="titulo" style="margin-bottom:14px"><i class="ti ti-school"></i> Treinamentos</h3>';
  }

  if(!trein.length){
    h+='<div class="card" style="text-align:center;padding:30px;color:#6b7770">Nenhum treinamento cadastrado ainda.</div>';
    return h;
  }

  trein.filter(function(t){return t.ativo==='sim';}).forEach(function(t){
    var tPergs=pergs.filter(function(p){return p.treinamento_id===t.id;});
    var jaRespondeu=resps.some(function(r){return r.treinamento_id===t.id&&r.usuario_id===ST.userId&&String(r.respondido_em||'').slice(0,7)===mes;});
    var minhaResp=resps.find(function(r){return r.treinamento_id===t.id&&r.usuario_id===ST.userId&&String(r.respondido_em||'').slice(0,7)===mes;});

    h+='<div class="tcard">'+
      '<div class="tcard-head">'+
        '<div>'+
          '<div class="tcard-titulo">'+esc(t.titulo)+'</div>'+
          (t.categoria?'<span class="tcard-cat">'+esc(t.categoria)+'</span>':'')+
        '</div>'+
        '<div style="display:flex;gap:6px">'+
          (jaRespondeu?'<span class="badge concluido"><i class="ti ti-check"></i> '+minhaResp.acertos+'/'+minhaResp.total+' - '+minhaResp.pontos_ganhos+'pts</span>':'')+
          (isAdmin?'<button class="btn sm sec" data-tid="'+t.id+'" onclick="editarTreinEl(this)"><i class="ti ti-pencil"></i></button>':'')+ 
          (isAdmin?'<button class="btn sm danger" data-tid="'+t.id+'" onclick="delTreinEl(this)"><i class="ti ti-trash"></i></button>':'')+
          (!jaRespondeu&&tPergs.length?'<button class="btn sm" data-tid="'+t.id+'" onclick="abrirQuizEl(this)"><i class="ti ti-pencil-check"></i> Fazer quiz</button>':'')+
        '</div>'+
      '</div>'+
      '<div class="tcard-body">'+esc(t.conteudo||'')+'</div>'+
      (t.youtube?'<div style="padding:10px 14px;border-top:1px solid #E0E8E2;display:flex;gap:10px;flex-wrap:wrap">'+
        '<a href="'+esc(t.youtube)+'" target="_blank" class="btn sm" style="background:#FF0000;color:#fff"><i class="ti ti-brand-youtube"></i> Assistir no YouTube</a>'+
        '</div>':'')+
      (t.pdf?'<div style="padding:'+(t.youtube?'0':'10px')+'14px 10px;display:flex;gap:10px;flex-wrap:wrap">'+
        '<a href="'+esc(t.pdf)+'" target="_blank" class="btn sm sec"><i class="ti ti-file-type-pdf"></i> Abrir PDF</a>'+
        '</div>':'')+
      (isAdmin&&tPergs.length?
        '<div style="padding:10px 14px;border-top:1px solid #E0E8E2;font-size:12px;color:#6b7770">'+tPergs.length+' pergunta(s) no quiz <button class="btn sm sec" data-tid="'+t.id+'" onclick="gerenciarPergEl(this)" style="margin-left:8px"><i class="ti ti-settings"></i> Gerenciar</button></div>':
        (isAdmin?'<div style="padding:10px 14px;border-top:1px solid #E0E8E2"><button class="btn sm sec" data-tid="'+t.id+'" onclick="gerenciarPergEl(this)"><i class="ti ti-plus"></i> Adicionar quiz</button></div>':'')
      )+
    '</div>';
  });
  return h;
}

function abrirQuizEl(el){
  var tid=el.getAttribute('data-tid');
  var trein=ST.data.treinamentos||[];
  var t=trein.find(function(x){return x.id===tid;})||{titulo:'?'};
  var pergs=(ST.data.quizPerguntas||[]).filter(function(p){return p.treinamento_id===tid;});
  if(!pergs.length){alert('Este treinamento nao tem perguntas.');return;}

  var ST_quiz={tid:tid,titulo:t.titulo,pergs:pergs,atual:0,acertos:0,respondidas:[]};

  function mostrarPerg(){
    var p=ST_quiz.pergs[ST_quiz.atual];
    var opts=[];try{opts=JSON.parse(p.opcoes||'[]');}catch(e){}
    var body='<div style="font-size:12px;color:#6b7770;margin-bottom:6px">Pergunta '+(ST_quiz.atual+1)+' de '+ST_quiz.pergs.length+'</div>'+
      '<div style="font-weight:600;font-size:15px;margin-bottom:14px">'+esc(p.pergunta)+'</div>'+
      opts.map(function(o,i){
        return '<div class="quiz-opcao" id="qop-'+i+'" data-qi="'+i+'" onclick="responderQuiz(this,'+Number(p.resposta_correta)+')">'+
          '<span style="width:24px;height:24px;border-radius:50%;background:#eef4ef;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">'+['A','B','C','D'][i]+'</span>'+
          '<span>'+esc(o)+'</span>'+
        '</div>';
      }).join('');
    document.querySelector('.modal h3').textContent='Quiz: '+esc(ST_quiz.titulo);
    document.querySelector('.modal > div:nth-child(2)').innerHTML=body;
    window._quizST=ST_quiz;
  }

  openModal('Quiz: '+esc(t.titulo),'<div id="quiz-body"></div>',[{l:'Cancelar',c:'sec',f:closeModal}]);
  ST_quiz.modalBody=true;
  mostrarPerg();
  window._mostrarPerg=mostrarPerg;
}

function responderQuiz(el,correta){
  var qi=Number(el.getAttribute('data-qi'));
  var qst=window._quizST;
  if(!qst||qst.respondidas.indexOf(qst.atual)>=0) return;
  qst.respondidas.push(qst.atual);
  // Mostrar resultado
  document.querySelectorAll('.quiz-opcao').forEach(function(o,i){
    if(i===correta) o.classList.add('correta');
    else if(i===qi&&qi!==correta) o.classList.add('errada');
  });
  if(qi===correta) qst.acertos++;
  // Avancar apos 1.5s
  setTimeout(function(){
    qst.atual++;
    if(qst.atual<qst.pergs.length){
      window._mostrarPerg();
    } else {
      // Finalizado
      var pts=qst.acertos*5;
      call('salvarRespostaQuiz',{
        treinamento_id:qst.tid,titulo:qst.titulo,
        usuario_id:ST.userId,usuario_nome:ST.user,
        acertos:qst.acertos,total:qst.pergs.length
      },function(res){
        document.querySelector('.modal h3').textContent='Quiz concluido!';
        document.querySelector('.modal > div:nth-child(2)').innerHTML=
          '<div style="text-align:center;padding:20px">'+
          '<div style="font-size:48px;margin-bottom:12px">'+(qst.acertos===qst.pergs.length?'**':qst.acertos>qst.pergs.length/2?':)':';)')+'</div>'+
          '<div style="font-size:22px;font-weight:700;color:#1B4332;margin-bottom:8px">'+qst.acertos+'/'+qst.pergs.length+' acertos</div>'+
          '<div style="font-size:28px;font-weight:700;color:#2D6A4F">+'+pts+' pontos!</div>'+
          '<div style="color:#6b7770;font-size:13px;margin-top:8px">Adicionados ao seu ranking do mes</div>'+
          '</div>';
        reload();
      });
    }
  },1500);
}

function salvarPontuacoes(){
  var campos=['chamado_aberto','chamado_baixa','chamado_media','chamado_alta','chamado_urgente','atividade','quiz','reaberto'];
  var pts={};
  campos.forEach(function(k){
    var el=document.getElementById('pts-'+k);
    if(el) pts[k]=Number(el.value)||0;
  });
  call('savePontuacoes',{pontuacoes:pts},function(){
    if(ST.data&&ST.data.config) ST.data.config.pontuacoes=pts;
    alert('Pontuacoes salvas!');
  });
}

function renderStorageCard(){
  // Contagem de registros por tabela (ja temos os dados em memoria)
  var d=ST.data;
  var tabelas=[
    {nome:'Chamados',        qtd:(d.chamados||[]).length,         icon:'ti-clipboard-list'},
    {nome:'Pontos',          qtd:(d.pontos||[]).length,           icon:'ti-trophy'},
    {nome:'Atividades',      qtd:(d.registrosAtividades||[]).length,icon:'ti-repeat'},
    {nome:'Lancamentos',     qtd:(d.lancamentos||[]).length,      icon:'ti-cash'},
    {nome:'Lembretes',       qtd:(d.lembretes||[]).length,        icon:'ti-bell'},
    {nome:'Compras',         qtd:(d.compras||[]).length,          icon:'ti-shopping-cart'},
    {nome:'Quiz respostas',  qtd:(d.quizRespostas||[]).length,    icon:'ti-pencil-check'},
    {nome:'Checklist',       qtd:((d.checklist||[]).length),      icon:'ti-checkup-list'},
    {nome:'Equipe',          qtd:(d.equipe||[]).length,           icon:'ti-users'},
    {nome:'Usuarios',        qtd:(d.usuarios||[]).length,         icon:'ti-user'},
  ];
  var totalReg=tabelas.reduce(function(s,t){return s+t.qtd;},0);
  var maxQtd=Math.max.apply(null,tabelas.map(function(t){return t.qtd;}))||1;

  // Estimativa de uso (media ~500 bytes por registro)
  var estimMB=(totalReg*500/1024/1024).toFixed(2);
  var limiteGratuito=500; // MB
  var pctEstim=Math.min(100,Math.round(parseFloat(estimMB)*100/limiteGratuito));
  var corBarra=pctEstim>=80?'#c0392b':pctEstim>=50?'#e67e22':'#2D6A4F';

  return '<div class="card" style="margin-top:14px">'+
    '<div class="between" style="margin-bottom:14px">'+
      '<h3 class="titulo" style="margin:0"><i class="ti ti-database"></i> Uso do banco de dados</h3>'+
      '<div style="font-size:12px;color:#6b7770">Plano gratuito Supabase: 500 MB</div>'+
    '</div>'+

    // Barra de uso estimado
    '<div style="margin-bottom:16px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7770;margin-bottom:6px">'+
        '<span>Uso estimado: <strong style="color:#1B4332">~'+estimMB+' MB</strong> de 500 MB</span>'+
        '<span style="color:'+corBarra+';font-weight:600">~'+pctEstim+'%</span>'+
      '</div>'+
      '<div style="height:10px;background:#E0E8E2;border-radius:6px;overflow:hidden">'+
        '<div style="height:100%;width:'+pctEstim+'%;background:'+corBarra+';border-radius:6px;transition:.3s"></div>'+
      '</div>'+
      '<div style="font-size:11px;color:#6b7770;margin-top:5px">* Estimativa baseada em ~500 bytes por registro. Valor real pode variar.</div>'+
    '</div>'+

    // Total de registros
    '<div style="background:#F5F7F5;border-radius:8px;padding:12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between">'+
      '<div style="font-size:13px;color:#1B4332;font-weight:600"><i class="ti ti-database"></i> Total de registros no banco</div>'+
      '<div style="font-size:24px;font-weight:700;color:#1B4332">'+totalReg.toLocaleString('pt-BR')+'</div>'+
    '</div>'+

    // Tabela por tabela
    '<div style="font-size:12px;color:#6b7770;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Registros por tabela</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+
    tabelas.sort(function(a,b){return b.qtd-a.qtd;}).map(function(t){
      var pct=Math.round(t.qtd*100/maxQtd);
      return '<div style="display:grid;grid-template-columns:160px 1fr 50px;align-items:center;gap:10px">'+
        '<div style="font-size:12px;color:#555;display:flex;align-items:center;gap:6px">'+
          '<i class="ti '+t.icon+'" style="font-size:13px;color:#2D6A4F"></i>'+esc(t.nome)+
        '</div>'+
        '<div style="height:6px;background:#E0E8E2;border-radius:3px;overflow:hidden">'+
          '<div style="height:100%;width:'+pct+'%;background:#2D6A4F;border-radius:3px"></div>'+
        '</div>'+
        '<div style="font-size:12px;font-weight:600;color:#1B4332;text-align:right">'+t.qtd.toLocaleString('pt-BR')+'</div>'+
      '</div>';
    }).join('')+
    '</div>'+

    // Alertas
    (pctEstim>=80?
      '<div style="margin-top:14px;background:#fde2e1;border:1px solid #c0392b;border-radius:8px;padding:10px 14px;font-size:13px;color:#c0392b">'+
        '<i class="ti ti-alert-triangle"></i> <strong>Atencao:</strong> Uso estimado acima de 80%. Considere fazer limpeza de dados antigos ou upgrade do plano Supabase.'+
      '</div>':
    pctEstim>=50?
      '<div style="margin-top:14px;background:#fff4e1;border:1px solid #f1c40f;border-radius:8px;padding:10px 14px;font-size:13px;color:#a06000">'+
        '<i class="ti ti-info-circle"></i> Uso moderado. Fique de olho quando passar de 80%.'+
      '</div>':'')+ 
  '</div>';
}


function addConfEl(el){addConf(el.getAttribute('data-ch'));}
function remConfEl(el){remConf(el.getAttribute('data-ch'),Number(el.getAttribute('data-i')));}
function addConf(ch){var v=document.getElementById('cfg-'+ch).value.trim();if(!v)return;var cfg=JSON.parse(JSON.stringify(ST.data.config));cfg[ch]=(cfg[ch]||[]).concat([v]);ST.data.config=cfg;call('saveConfig',{config:cfg},reload);}
function remConf(ch,i){var cfg=JSON.parse(JSON.stringify(ST.data.config));cfg[ch].splice(i,1);ST.data.config=cfg;call('saveConfig',{config:cfg},reload);}
function abrirUsrFormEl(el){abrirUsrForm(el.getAttribute('data-uid'));}
function delUsrEl(el){delUsr(el.getAttribute('data-uid'));}
function abrirUsrForm(id){
  var us=ST.data.usuarios||[], ed=null;
  for(var i=0;i<us.length;i++){if(us[i].id===id){ed=us[i];break;}}
  var u=ed||{nome:'',login:'',senha:'',perfil:'operador'};
  openModal(ed?'Editar usuario':'Novo usuario',
    '<div class="form-grid"><div><label>Nome</label><input id="un" value="'+esc(u.nome)+'"></div><div><label>Login</label><input id="ul" value="'+esc(u.login)+'"></div>'+
    '<div><label>Senha</label><input id="us" type="text" value="'+esc(u.senha)+'"></div>'+
    '<div><label>Perfil</label><select id="up">'+['admin','operador'].map(function(p){return '<option'+(u.perfil===p?' selected':'')+'>'+p+'</option>';}).join('')+'</select></div></div>',
    [{l:'Cancelar',c:'sec',f:closeModal},{l:'Salvar',c:'',f:function(){
      var n=document.getElementById('un').value.trim(),l=document.getElementById('ul').value.trim();
      if(!n||!l){alert('Nome e login obrigatorios');return;}
      var novo={id:ed?ed.id:'',nome:n,login:l,senha:document.getElementById('us').value,perfil:document.getElementById('up').value};
      var lista=ST.data.usuarios.slice();
      if(ed){lista=lista.map(function(x){return x.id===ed.id?Object.assign({},x,novo):x;});}else{lista.push(novo);}
      call('saveUsuarios',{lista:lista},function(){closeModal();reload();});
    }}]);
}
function delUsr(id){if(!confirm('Excluir?'))return;call('saveUsuarios',{lista:ST.data.usuarios.filter(function(x){return x.id!==id;})},reload);}

function openModal(tt,body,bts){
  var r=document.getElementById('mroot');
  r.innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>'+esc(tt)+'</h3><div>'+body+'</div><div class="modal-foot">'+
    bts.map(function(b,i){return '<button class="btn '+(b.c||'')+'" data-mi="'+i+'">'+esc(b.l)+'</button>';}).join('')+
    '</div></div></div>';
  r.querySelectorAll('[data-mi]').forEach(function(el){el.addEventListener('click',bts[+el.getAttribute('data-mi')].f);});
}
function closeModal(){document.getElementById('mroot').innerHTML='';}

function todayISO(){return isoD(new Date());}
function isoD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoD(d);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtDT(iso){if(!iso)return '-';try{var d=new Date(iso);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch(e){return String(iso).slice(0,16).replace('T',' ');}}

/* ===== MINHA EQUIPE (DP) ===== */
async function renderEquipeDP(){
  var c = document.getElementById('content');
  c.innerHTML = '<div style="padding:16px"><div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:40px;color:#6b7770"><div class="spinner" style="width:28px;height:28px;border-width:3px"></div><span>Carregando dados do DP...</span></div></div>';

  var dp = await carregarDadosDP();
  var colabs = dp.colabs || [];
  var ferias = dp.ferias || [];
  var candidatos = dp.candidatos || [];
  var epi = dp.epi || [];
  var hj = todayISO();

  // Calcular alertas de contrato
  function addD(d, n){ var dt = new Date(d+'T12:00:00'); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
  function diasAteD(d){ return Math.round((new Date(d+'T12:00:00') - new Date())/(1000*60*60*24)); }
  function fmD(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  function fmR(v){ return 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }

  var exp45 = colabs.filter(function(c){
    if(c.contrato !== 'experiencia' || !c.adm) return false;
    var d = diasAteD(addD(c.adm, 45));
    return d >= 0 && d <= 15;
  });
  var exp90 = colabs.filter(function(c){
    if(c.contrato !== 'experiencia' || !c.adm) return false;
    var d45 = diasAteD(addD(c.adm, 45));
    var d90 = diasAteD(addD(c.adm, 90));
    return d45 < 0 && d90 >= 0 && d90 <= 15;
  });
  var emFerias = colabs.filter(function(c){ return c.status === 'ferias'; });
  var vagasAbertas = candidatos.filter(function(c){ return c.etapa !== 'inicio'; });
  var epiVencendo = epi.filter(function(e){ return e.revisao && diasAteD(e.revisao) <= 30 && diasAteD(e.revisao) >= 0; });

  var ST_COR = {ativo:'#1a7a3a',experiencia:'#d4660a',ferias:'#1a5276',afastado:'#c0392b'};
  var ST_BG  = {ativo:'#e8f5ed',experiencia:'#fef3e8',ferias:'#e8f0f8',afastado:'#fdf0ee'};
  var ST_LBL = {ativo:'Ativo',experiencia:'Experiência',ferias:'Férias',afastado:'Afastado'};
  var CONT_LBL = {clt:'CLT',experiencia:'Experiência',temporario:'Temp.',estagio:'Estágio',aprendiz:'Aprendiz',pj:'PJ'};

  var html = '<div style="padding:16px;display:flex;flex-direction:column;gap:14px">';

  // === STATS ===
  html += '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">';
  var stats = [
    {l:'Equipe ativa', v:colabs.length, c:'#1B4332', bg:'#e8f5ed'},
    {l:'Em experiência', v:exp45.length+exp90.length, c:'#d4660a', bg:'#fef3e8'},
    {l:'De férias', v:emFerias.length, c:'#1a5276', bg:'#e8f0f8'},
    {l:'Vagas abertas', v:vagasAbertas.length, c:'#6b7770', bg:'#f5f7f5'},
    {l:'EPI vencendo', v:epiVencendo.length, c:'#c0392b', bg:'#fdf0ee'},
  ];
  stats.forEach(function(s){
    html += '<div style="background:'+s.bg+';border-radius:10px;padding:12px 14px;border-left:3px solid '+s.c+'">'
      +'<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:'+s.c+'">'+s.l+'</div>'
      +'<div style="font-size:26px;font-weight:700;color:#1a2e1a;margin-top:4px">'+s.v+'</div>'
      +'</div>';
  });
  html += '</div>';

  // === ALERTAS ===
  if(exp45.length || exp90.length || epiVencendo.length){
    html += '<div style="background:#fff;border:1px solid #e2e8e2;border-radius:10px;overflow:hidden">';
    html += '<div style="padding:12px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7770;border-bottom:1px solid #e2e8e2">⚠ Alertas</div>';
    exp45.forEach(function(c){
      var dias = diasAteD(addD(c.adm, 45));
      html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f5f0">'
        +'<span style="background:#fdf0ee;color:#c0392b;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600">Contrato 45d</span>'
        +'<span style="font-size:13px;font-weight:600">'+c.nome+'</span>'
        +'<span style="font-size:12px;color:#6b7770">vence em '+dias+' dia(s) — '+fmD(addD(c.adm,45))+'</span>'
        +'</div>';
    });
    exp90.forEach(function(c){
      var dias = diasAteD(addD(c.adm, 90));
      html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f5f0">'
        +'<span style="background:#fef3e8;color:#d4660a;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600">Contrato 90d</span>'
        +'<span style="font-size:13px;font-weight:600">'+c.nome+'</span>'
        +'<span style="font-size:12px;color:#6b7770">vence em '+dias+' dia(s) — '+fmD(addD(c.adm,90))+'</span>'
        +'</div>';
    });
    epiVencendo.forEach(function(e){
      html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f5f0">'
        +'<span style="background:#fdf0ee;color:#c0392b;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600">EPI revisão</span>'
        +'<span style="font-size:13px;font-weight:600">'+(e.dp_colaboradores?e.dp_colaboradores.nome:'—')+'</span>'
        +'<span style="font-size:12px;color:#6b7770">'+e.tipo_nome+' — revisão em '+fmD(e.revisao)+'</span>'
        +'</div>';
    });
    html += '</div>';
  }

  // === EQUIPE ===
  html += '<div style="background:#fff;border:1px solid #e2e8e2;border-radius:10px;overflow:hidden">';
  html += '<div style="padding:12px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7770;border-bottom:1px solid #e2e8e2;display:flex;justify-content:space-between;align-items:center">'
    +'<span>Equipe — Manutenção</span>'
    +'<span style="font-size:13px;font-weight:600;color:#1B4332">'+colabs.length+' colaborador(es)</span>'
    +'</div>';

  if(colabs.length){
    // Líderes primeiro
    var lideres = colabs.filter(function(c){ return c.lider; });
    var ops = colabs.filter(function(c){ return !c.lider; });
    var todos = lideres.concat(ops);

    todos.forEach(function(c){
      var st = c.status || 'ativo';
      var contratoTag = '';
      if(c.contrato === 'experiencia' && c.adm){
        var d45 = diasAteD(addD(c.adm,45));
        var d90 = diasAteD(addD(c.adm,90));
        if(d45 >= 0) contratoTag = '<span style="background:#e8f0f8;color:#1a5276;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:600">45d: '+d45+'d</span>';
        else if(d90 >= 0) contratoTag = '<span style="background:#fef3e8;color:#d4660a;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:600">90d: '+d90+'d</span>';
      }
      html += '<div style="display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 1fr;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid #f0f5f0">'
        +'<div style="display:flex;align-items:center;gap:8px">'
          +'<div style="width:28px;height:28px;border-radius:50%;background:#1B4332;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">'
            +(c.nome?c.nome.split(' ').slice(0,2).map(function(n){return n[0];}).join(''):'?')
          +'</div>'
          +'<div>'
            +'<div style="font-size:13px;font-weight:600">'+(c.lider?'<span style="background:#e8f5ed;color:#1a7a3a;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:700;margin-right:4px">LÍD</span>':'')+c.nome+'</div>'
            +(c.tel?'<div style="font-size:11px;color:#6b7770">'+c.tel+'</div>':'')
          +'</div>'
        +'</div>'
        +'<div style="font-size:12px;color:#3d5c3d">'+(c.cargo||'—')+'</div>'
        +'<div style="font-size:12px;font-family:monospace">'+fmD(c.adm)+'</div>'
        +'<div>'+contratoTag+'</div>'
        +'<div><span style="background:'+(ST_BG[st]||'#f5f7f5')+';color:'+(ST_COR[st]||'#6b7770')+';padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600">'+(ST_LBL[st]||st)+'</span></div>'
        +'</div>';
    });
  } else {
    html += '<div style="text-align:center;padding:24px;color:#6b7770">Nenhum colaborador no setor de Manutenção</div>';
  }
  html += '</div>';

  // === VAGAS / PIPELINE ===
  if(vagasAbertas.length){
    var ETAPA_LBL = {documentos:'Documentos',exame:'Exame',integracao:'Integração',inicio:'Início'};
    var ETAPA_COR = {documentos:'#e8f0f8',exame:'#fef3e8',integracao:'#e8f5ed',inicio:'#f0e8f8'};
    html += '<div style="background:#fff;border:1px solid #e2e8e2;border-radius:10px;overflow:hidden">';
    html += '<div style="padding:12px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7770;border-bottom:1px solid #e2e8e2">Pipeline de contratação — '+vagasAbertas.length+' vaga(s)</div>';
    vagasAbertas.forEach(function(v){
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #f0f5f0">'
        +'<div><div style="font-size:13px;font-weight:600">'+v.nome+'</div>'
        +'<div style="font-size:11px;color:#6b7770">'+(v.cargo||'—')+'</div></div>'
        +'<span style="background:'+(ETAPA_COR[v.etapa]||'#f5f7f5')+';color:#1a2e1a;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:600">'+(ETAPA_LBL[v.etapa]||v.etapa)+'</span>'
        +'</div>';
    });
    html += '</div>';
  }

  // === FÉRIAS PROGRAMADAS ===
  var ferProg = ferias.filter(function(f){ return f.status !== 'concluida' && f.data_fim >= hj; });
  if(ferProg.length){
    html += '<div style="background:#fff;border:1px solid #e2e8e2;border-radius:10px;overflow:hidden">';
    html += '<div style="padding:12px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7770;border-bottom:1px solid #e2e8e2">Férias programadas</div>';
    ferProg.forEach(function(f){
      var nome = f.dp_colaboradores ? f.dp_colaboradores.nome : '—';
      var stCor = f.status==='em_gozo' ? '#1a7a3a' : '#1a5276';
      var stBg  = f.status==='em_gozo' ? '#e8f5ed' : '#e8f0f8';
      var stLbl = f.status==='em_gozo' ? 'Em gozo' : 'Programada';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #f0f5f0">'
        +'<div><div style="font-size:13px;font-weight:600">'+nome+'</div>'
        +'<div style="font-size:11px;color:#6b7770">'+fmD(f.data_ini)+' → '+fmD(f.data_fim)+'</div></div>'
        +'<span style="background:'+stBg+';color:'+stCor+';padding:3px 10px;border-radius:8px;font-size:11px;font-weight:600">'+stLbl+'</span>'
        +'</div>';
    });
    html += '</div>';
  }

  html += '<div style="text-align:center;font-size:11px;color:#6b7770;padding:8px">Dados do Portal DP · Atualizado em ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) + ' · <a href="#" onclick="_dpCache={};renderEquipeDP();return false;" style="color:#1B4332">Recarregar</a></div>';
  html += '</div>';
  c.innerHTML = html;
}
</script>
