


<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laghetto Pedras Altas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:#F5F7F5;color:#1a1a1a;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#1B4332;color:#fff;display:flex;flex-direction:column;padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:15px;padding:0 18px 14px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px;line-height:1.3}
.sidebar h1 small{display:block;font-weight:400;opacity:.7;font-size:11px;margin-top:3px}
.nav-group{padding:8px 18px 2px;font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;color:rgba(255,255,255,.85);cursor:pointer;border-left:3px solid transparent;font-size:13px}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:rgba(82,183,136,.15);border-left-color:#52B788;color:#fff}
.nav-item i{font-size:17px}
.nav-dot{width:7px;height:7px;background:#c0392b;border-radius:50%;margin-left:auto;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid #E0E8E2;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:17px;font-weight:600}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:#6b7770}
.status-pill.saving{color:#3498db}
.dot{width:8px;height:8px;border-radius:50%;background:#52B788;flex-shrink:0}
.user-pick{display:flex;align-items:center;gap:5px;font-size:12px}
.user-pick select{padding:4px 8px;font-size:12px;border:1px solid #E0E8E2;border-radius:6px}
.content{padding:20px 22px;flex:1;overflow:auto}
.menu-toggle{display:none}
.grid{display:grid;gap:14px}
.cards-resumo{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:#fff;border:1px solid #E0E8E2;border-radius:10px;padding:14px}
.card h3{font-size:12px;color:#6b7770;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.card .big{font-size:28px;font-weight:700;margin-top:5px;color:#1B4332}
.card.urgente .big{color:#c0392b}
.card.alerta .big{color:#e67e22}
.section{margin-top:20px}
.section h3.titulo{font-size:14px;font-weight:600;margin-bottom:10px;color:#1B4332;display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:5px;background:#2D6A4F;color:#fff;padding:8px 13px;border-radius:8px;font-weight:500;font-size:13px;transition:.15s;cursor:pointer}
.btn:hover{background:#1B4332}
.btn.sec{background:#fff;color:#1B4332;border:1px solid #E0E8E2}
.btn.sec:hover{background:#F5F7F5}
.btn.danger{background:#c0392b;color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:12px;color:#6b7770;margin-bottom:3px;font-weight:500}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid #E0E8E2;border-radius:6px;background:#fff}
textarea{resize:vertical;min-height:58px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2D6A4F}
details.col{background:#fff;border:1px solid #E0E8E2;border-radius:10px;overflow:hidden;margin-bottom:14px}
details.col>summary{padding:13px 15px;font-weight:600;color:#1B4332;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;user-select:none}
details.col>summary::-webkit-details-marker{display:none}
details.col>summary i.arr{margin-left:auto;transition:.2s}
details.col[open]>summary i.arr{transform:rotate(90deg)}
details.col>.body{padding:0 15px 15px}
.cht{width:100%;border-collapse:collapse;background:#fff}
.cht th,.cht td{padding:9px 11px;text-align:left;font-size:13px;border-bottom:1px solid #E0E8E2;vertical-align:top}
.cht th{background:#F5F7F5;font-weight:600;color:#1B4332;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.cht tr:last-child td{border-bottom:none}
.ch-ac{display:flex;flex-wrap:wrap;gap:5px}
.badge{display:inline-block;padding:2px 7px;border-radius:8px;font-size:11px;font-weight:600}
.badge.aberto{background:#fff4e1;color:#a06000}
.badge.concluido{background:#e1f5e7;color:#1f7a3a}
.badge.aguardando{background:#fff4e1;color:#a06000}
.badge.comprado{background:#e1f5e7;color:#1f7a3a}
.badge.p-Baixa{background:#e8f0fe;color:#1a73e8}
.badge.p-Media{background:#fff4e1;color:#a06000}
.badge.p-Alta{background:#fde2cf;color:#a04000}
.badge.p-Urgente{background:#fde2e1;color:#c0392b}
.aparts{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:7px}
.apart{aspect-ratio:1;background:#fff;border:1px solid #E0E8E2;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;transition:.15s;font-size:13px}
.apart:hover{transform:translateY(-2px);border-color:#2D6A4F}
.apart.aberto{background:#fff4d1;border-color:#e6c200}
.apart.urgente{background:#ffd6d2;border-color:#c0392b;color:#c0392b}
.apart.programado{background:#fff3cd;border-color:#e67e22;color:#a04000}
.apart.programado-urgente{background:#ffd6d2;border-color:#c0392b;color:#c0392b}
.ck-tabs{display:flex;gap:5px;margin-bottom:12px;background:#fff;padding:4px;border-radius:8px;border:1px solid #E0E8E2;width:fit-content}
.ck-tabs button{padding:6px 13px;border-radius:6px;font-size:13px;font-weight:500;color:#6b7770}
.ck-tabs button.active{background:#2D6A4F;color:#fff}
.ck-item{display:flex;align-items:center;gap:9px;padding:8px 11px;background:#fff;border:1px solid #E0E8E2;border-radius:8px;margin-bottom:5px}
.ck-item.done{opacity:.55;text-decoration:line-through}
.ck-item input[type=checkbox]{width:17px;height:17px;accent-color:#2D6A4F;flex-shrink:0}
.ck-item .txt{flex:1}
.progress{height:7px;background:#E0E8E2;border-radius:4px;overflow:hidden;margin-bottom:10px}
.progress span{display:block;height:100%;background:#52B788;transition:.3s}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:#fff;padding:8px;border-radius:10px;border:1px solid #E0E8E2}
.cal-dn{text-align:center;font-size:10px;color:#6b7770;font-weight:600;padding:5px 0;text-transform:uppercase}
.cal-day{min-height:72px;background:#F5F7F5;border-radius:5px;padding:5px;font-size:12px;overflow:hidden;border:1px solid transparent;cursor:pointer}
.cal-day.out{opacity:.3}
.cal-day.today{border-color:#2D6A4F;font-weight:700}
.lb-mini{font-size:10px;background:#fff;border-radius:3px;padding:1px 3px;margin-top:2px;border-left:3px solid #999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-mini.verde{border-color:#52B788}
.lb-mini.amarelo{border-color:#f1c40f}
.lb-mini.vermelho{border-color:#c0392b}
.lb-mini.azul{border-color:#3498db}
.tb-badge{font-size:10px;padding:2px 5px;border-radius:4px;font-weight:700;text-transform:uppercase}
.tb-manha{background:#fff8d4;color:#8a6600}
.tb-tarde{background:#fff0e1;color:#a04000}
.tb-noite{background:#e8e8f8;color:#2c3b8a}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.colab{background:#fff;border:1px solid #E0E8E2;border-radius:10px;padding:13px;position:relative}
.colab .nome{font-weight:600;font-size:14px;color:#1B4332}
.colab .meta{font-size:12px;color:#6b7770;margin-top:2px}
.colab .folgas{margin-top:7px;display:flex;flex-wrap:wrap;gap:3px}
.fp{font-size:11px;background:#fde2cf;color:#a04000;padding:2px 6px;border-radius:8px;font-weight:600}
.colab .ac{position:absolute;top:9px;right:9px;display:flex;gap:3px}
.esc-wrap{overflow-x:auto;background:#fff;border-radius:8px;border:1px solid #E0E8E2}
.esc-tbl{border-collapse:collapse;min-width:100%}
.esc-tbl th,.esc-tbl td{border:1px solid #E0E8E2;padding:0;text-align:center;font-size:11px}
.esc-tbl th{background:#F5F7F5;padding:5px 3px;color:#1B4332}
.esc-tbl th.nc{position:sticky;left:0;z-index:2;text-align:left;padding:5px 9px;min-width:150px}
.esc-tbl td.nc{position:sticky;left:0;background:#fff;text-align:left;padding:5px 9px;font-weight:500}
.esc-tbl td.nc.rm{background:#fffce8}
.esc-tbl td.nc.rt{background:#fff4ec}
.esc-tbl td.nc.rn{background:#eeeef8}
.esc-tbl th.we{background:#eef2ee}
.cell{width:30px;height:30px;font-weight:600;display:flex;align-items:center;justify-content:center}
.cell.T{background:#cfe8d9;color:#1B4332}
.cell.F{background:#fde2cf;color:#a04000}
.ativ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-bottom:16px}
.ativ-card{background:#fff;border:1px solid #E0E8E2;border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:7px}
.ativ-card .anome{font-weight:600;color:#1B4332;font-size:13px}
.ativ-card .aul{font-size:11px;color:#6b7770}
.ativ-log{background:#fff;border:1px solid #E0E8E2;border-radius:10px;overflow:hidden}
.ativ-row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid #E0E8E2;font-size:13px}
.ativ-row:last-child{border-bottom:none}
.cp-list{display:flex;flex-direction:column;gap:7px}
.cp-item{background:#fff;border:1px solid #E0E8E2;border-radius:10px;padding:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cp-item.comprado{opacity:.6}
.cp-item .info{flex:1;min-width:150px}
.cp-item .cnome{font-weight:600;color:#1B4332}
.cp-item .cmeta{font-size:12px;color:#6b7770;margin-top:2px}
.cp-ac{display:flex;gap:5px;flex-wrap:wrap}
.bar-chart{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:8px;font-size:13px}
.bar-bg{height:16px;background:#eef2ee;border-radius:4px;overflow:hidden}
.bar-fg{height:100%;background:#52B788}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.kanban-col{background:#F5F7F5;border-radius:10px;padding:10px;min-height:200px}
.kanban-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:6px 8px;border-radius:8px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.kanban-col-header.aberto{background:#fff4e1;color:#a06000}
.kanban-col-header.andamento{background:#e8f0fe;color:#1a73e8}
.kanban-col-header.aguardando{background:#fde2cf;color:#a04000}
.kanban-col-header.concluido{background:#e1f5e7;color:#1f7a3a}
.kcard{background:#fff;border:1px solid #E0E8E2;border-radius:8px;padding:11px;margin-bottom:8px;transition:.15s;position:relative}
.kcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);transform:translateY(-1px)}
.kcard.prio-Urgente{border-left:4px solid #c0392b}
.kcard.prio-Alta{border-left:4px solid #e67e22}
.kcard.prio-Media{border-left:4px solid #f1c40f}
.kcard.prio-Baixa{border-left:4px solid #3498db}
.kcard .klocal{font-weight:700;font-size:14px;color:#1B4332}
.kcard .karea{font-size:12px;color:#6b7770;margin-top:2px}
.kcard .kdesc{font-size:12px;color:#555;margin-top:5px;line-height:1.4}
.kcard .kmeta{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.kcard .ktec{font-size:11px;background:#eef4ef;color:#2D6A4F;padding:2px 7px;border-radius:8px;font-weight:600}
.kcard .ktime{font-size:11px;color:#6b7770}
.kcard .kacoes{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.kvtoggle{display:flex;gap:5px;margin-bottom:12px;background:#fff;padding:4px;border-radius:8px;border:1px solid #E0E8E2;width:fit-content}
.kvtoggle button{padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;color:#6b7770}
.kvtoggle button.active{background:#2D6A4F;color:#fff}
@media(max-width:900px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.kanban{grid-template-columns:1fr}}
.tag{background:#eef4ef;color:#1B4332;padding:4px 9px;border-radius:12px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.tag button{color:#c0392b;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal{background:#fff;border-radius:12px;padding:18px;max-width:580px;width:100%;max-height:90vh;overflow:auto}
.modal h3{color:#1B4332;margin-bottom:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}
.notif{background:#fff8e1;border:1px solid #f1c40f;color:#7a5b00;padding:9px 13px;border-radius:8px;margin-bottom:12px;display:flex;gap:9px;align-items:center;font-size:13px}
.notif.urg{background:#fde2e1;border-color:#c0392b;color:#c0392b}
.loading{position:fixed;inset:0;background:rgba(245,247,245,.96);display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:11px;color:#1B4332;font-weight:500}
.spinner{width:36px;height:36px;border:3px solid #d0dcd3;border-top-color:#2D6A4F;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}
.ds{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.ds label{display:flex;align-items:center;gap:3px;background:#F5F7F5;padding:4px 9px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500}
.ds input{width:auto;margin:0}
@media(max-width:820px){
  .sidebar{position:fixed;left:-260px;transition:.25s;z-index:50;box-shadow:2px 0 8px rgba(0,0,0,.15)}
  .sidebar.open{left:0}
  .menu-toggle{display:inline-flex}
  .content{padding:12px}
  .topbar{padding:9px 13px}
}
.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:16px}
.hist-apt{background:#fff;border:1px solid #E0E8E2;border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:.2s;font-weight:600;font-size:13px}
.hist-apt:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);border-color:#2D6A4F}
.hist-apt.saude-verde{border-left:3px solid #52B788}
.hist-apt.saude-amarelo{border-left:3px solid #f1c40f}
.hist-apt.saude-vermelho{border-left:3px solid #c0392b}
.hist-apt .hcount{font-size:10px;color:#6b7770;margin-top:3px}
.hist-apt .hsaude{font-size:9px;font-weight:700;margin-top:2px}
.busca-result{background:#fff;border-radius:10px;border:1px solid #E0E8E2;overflow:hidden;margin-top:12px}
.busca-row{padding:10px 14px;border-bottom:1px solid #E0E8E2;cursor:pointer}
.busca-row:hover{background:#F5F7F5}
.busca-row:last-child{border-bottom:none}
.gasto-barra{height:24px;background:#E0E8E2;border-radius:12px;overflow:hidden;margin:8px 0;position:relative}
.gasto-fill{height:100%;border-radius:12px;transition:.5s;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:700;color:#fff}
.gasto-card{background:#fff;border-radius:12px;padding:16px;border:1px solid #E0E8E2;margin-bottom:10px}
.lanc-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #E0E8E2;flex-wrap:wrap}
.lanc-row:last-child{border-bottom:none}
.rank-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;border:1px solid #E0E8E2;display:flex;align-items:center;gap:14px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.rank-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.rank-card.rank-1{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#f59e0b}
.rank-card.rank-2{background:linear-gradient(135deg,#f8fafc,#f1f5f9);border-color:#94a3b8}
.rank-card.rank-3{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#cd7f32}
@media(max-width:680px){
  .cht,.cht thead,.cht tbody,.cht tr,.cht td{display:block;width:100%}
  .cht thead{display:none}
  .cht tr{border:1px solid #E0E8E2;border-radius:8px;margin-bottom:8px;padding:9px;background:#fff}
  .cht td{border:none;padding:3px 0;font-size:13px}
  .cht td:before{content:attr(data-l);display:inline-block;width:85px;color:#6b7770;font-size:10px;text-transform:uppercase;font-weight:600}
  .cht td.ar:before{display:none}
  .ch-ac{margin-top:7px}
  .cp-item{flex-direction:column;align-items:flex-start}
  .bar-row{grid-template-columns:100px 1fr 32px}
}
</style>
</head>
<body>
<div id="login-screen" style="position:fixed;inset:0;background:#1B4332;display:flex;align-items:center;justify-content:center;z-index:300">
  <div style="background:#fff;border-radius:16px;padding:32px;width:100%;max-width:360px;margin:16px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:56px;height:56px;background:#1B4332;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
        <i class="ti ti-building" style="font-size:28px;color:#fff"></i>
      </div>
      <h1 style="font-size:18px;font-weight:700;color:#1B4332">Laghetto Pedras Altas</h1>
      <p style="font-size:13px;color:#6b7770;margin-top:4px">Sistema de Manutencao</p>
    </div>
    <div style="margin-bottom:14px">
      <label style="display:block;font-size:12px;color:#6b7770;font-weight:500;margin-bottom:4px">Usuario</label>
      <select id="login-user" style="width:100%;padding:10px;border:1px solid #E0E8E2;border-radius:8px;font-size:14px;background:#fff">
        <option value="">Selecione seu usuario...</option>
      </select>
    </div>
    <div style="margin-bottom:20px">
      <label style="display:block;font-size:12px;color:#6b7770;font-weight:500;margin-bottom:4px">Senha</label>
      <input id="login-senha" type="password" placeholder="Digite sua senha" style="width:100%;padding:10px;border:1px solid #E0E8E2;border-radius:8px;font-size:14px">
    </div>
    <div id="login-erro" style="display:none;background:#fde2e1;border:1px solid #c0392b;border-radius:8px;padding:10px;font-size:13px;color:#c0392b;margin-bottom:14px;text-align:center">
      Usuario ou senha incorretos.
    </div>
    <button onclick="fazerLogin()" style="width:100%;padding:12px;background:#1B4332;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">
      Entrar
    </button>
  </div>
</div>

<div id="loading" class="loading" style="display:none">
  <div class="spinner"></div>
  <div id="ldmsg">Carregando sistema...</div>
</div>
<div class="app">
  <div id="sb-overlay" onclick="toggleSb()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:49"></div>
  <aside id="sidebar" class="sidebar">
    <h1>Laghetto Pedras Altas <small>Sistema de Manutencao</small></h1>
    <nav id="nav"></nav>
  </aside>
  <div class="main">

function notificarUrgente(chamado){
  // Vibrar no celular
  if(navigator.vibrate) navigator.vibrate([300,100,300,100,300]);
  // Som de alerta
  try {
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    function beep(freq,start,dur){
      var o=ctx.createOscillator();
      var g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=freq;
      o.type='sine';
      g.gain.setValueAtTime(0.3,ctx.currentTime+start);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);
      o.start(ctx.currentTime+start);
      o.stop(ctx.currentTime+start+dur+0.1);
    }
    beep(880,0,0.2); beep(880,0.25,0.2); beep(1100,0.5,0.4);
  } catch(e){}
  // Notificacao visual grande
  var n=document.createElement('div');
  n.style.cssText='position:fixed;top:16px;right:16px;z-index:9999;background:#c0392b;color:#fff;padding:16px 20px;border-radius:12px;font-size:15px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:320px;cursor:pointer;animation:piscar 0.5s ease infinite alternate';
  n.innerHTML='<div style="font-size:20px;margin-bottom:6px"><i class="ti ti-alert-triangle"></i> CHAMADO URGENTE!</div>'+
    '<div style="font-weight:400;font-size:14px;line-height:1.4">'+
    '<strong>Local:</strong> '+(chamado.local||'-')+'<br>'+
    '<strong>Area:</strong> '+(chamado.areaTecnica||'-')+'<br>'+
    (chamado.descricao?'<strong>Desc:</strong> '+chamado.descricao:'')+'<br>'+
    '<strong>Por:</strong> '+(chamado.criadoPor||'-')+
    '</div>'+
    '<div style="font-size:12px;margin-top:8px;opacity:.8">Clique para fechar</div>';
  n.onclick=function(){if(n.parentNode)n.parentNode.removeChild(n);};
  document.body.appendChild(n);
  // Adicionar animacao de piscar
  if(!document.getElementById('piscar-style')){
    var st=document.createElement('style');
    st.id='piscar-style';
    st.textContent='@keyframes piscar{from{opacity:1}to{opacity:.7}}';
    document.head.appendChild(st);
  }
  setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n);},10000);
}

async function sbReq(method,path,body){
  var opts={method:method,headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'return=representation'}};
  if(body) opts.body=JSON.stringify(body);
  var r=await fetch(SUPA_URL+'/rest/v1/'+path,opts);
  var text=await r.text();
  if(!r.ok) throw new Error('Supabase ['+r.status+'] '+path+': '+text.slice(0,200));
  return text?JSON.parse(text):null;
}

async function toggleChamado(d){
  var lista=await sbGet('chamados?id=eq.'+d.id);
  if(!lista||!lista.length) throw new Error('Chamado nao encontrado');
  var ch=lista[0];
  var novo=isConcluido(ch.status)?'Aberto':'Concluido';
  var upd={status:novo};
  if(novo==='Concluido'){
    upd.concluidoEm=new Date().toISOString();
    upd.concluidoPor=d.concluidoPor||'';
    var ptsMap={Urgente:await getPts('chamado_urgente',35),Alta:await getPts('chamado_alta',20),Media:await getPts('chamado_media',10),Baixa:await getPts('chamado_baixa',5)};
    var p=ptsMap[ch.prioridade]||10;
    if(d.concluidoPor) await registrarPontos({usuario_id:d.concluidoPor,usuario_nome:d.concluidoPor,
      tipo:'chamado_concluido',descricao:'Chamado concluido - '+(ch.local||'')+' ('+(ch.prioridade||'')+')',
      pontos:p,referencia:ch.id});
  } else {
    upd.concluidoEm=null;upd.concluidoPor=null;
    upd.reaberturas=Number(ch.reaberturas||0)+1;
    upd.reabertoPor=d.concluidoPor||'';
    upd.reabertoEm=new Date().toISOString();
    var ptsReab=await getPts('reaberto',-15);
    if(ch.concluidoPor) await registrarPontos({usuario_id:ch.concluidoPor,usuario_nome:ch.concluidoPor,
      tipo:'chamado_reaberto',descricao:'Chamado reaberto - '+(ch.local||''),
      pontos:ptsReab,referencia:ch.id});
  }
  await sbPatch('chamados?id=eq.'+d.id,upd);
  return {id:d.id,status:novo};
}
async function updateChamado(d){
  var upd={};
  if(d.status!==undefined)           upd.status=d.status;
  if(d.tecnico!==undefined)          upd.tecnico=d.tecnico;
  if(d.concluidoPor!==undefined)     upd.concluidoPor=d.concluidoPor;
  if(d.concluidoEm!==undefined)      upd.concluidoEm=d.concluidoEm;
  if(d.motivo_pendencia!==undefined) upd.motivo_pendencia=d.motivo_pendencia;
  if(d.data_prevista!==undefined)    upd.data_prevista=d.data_prevista;
  await sbPatch('chamados?id=eq.'+d.id,upd);
  return {ok:true};
}

function fazerLogin(){
  var users=ST.data.usuarios||[];
  var uid=document.getElementById('login-user').value;
  var senha=document.getElementById('login-senha').value;
  var erro=document.getElementById('login-erro');
  if(!uid){erro.style.display='block';erro.textContent='Selecione um usuario.';return;}
  var u=users.find(function(x){return x.id===uid;});
  if(!u||String(u.senha||'')!==String(senha)){
    erro.style.display='block';
    erro.textContent='Usuario ou senha incorretos.';
    document.getElementById('login-senha').value='';
    return;
  }
  ST.user=u.nome;
  ST.userId=u.id;
  localStorage.setItem('lg_uid',u.id);
  localStorage.setItem('lg_user',u.nome);
  entrarNoSistema();
}

// Verificar permissao e alertar se nao tiver
function checkPerm(acao){
  var p=getPerfil();
  var perms={
    // admin pode tudo
    'excluir_chamado':    ['admin','supervisor'],
    'excluir_compra':     ['admin','supervisor'],
    'excluir_lembrete':   ['admin','supervisor'],
    'excluir_atividade':  ['admin'],
    'gerenciar_equipe':   ['admin','supervisor'],
    'acessar_config':     ['admin'],
    'criar_treinamento':  ['admin'],
    'excluir_usuario':    ['admin']
  };
  var permitidos=perms[acao]||['admin'];
  if(permitidos.indexOf(p)>=0) return true;
  var msgs={
    'excluir_chamado':   'Apenas supervisores e admins podem excluir chamados.',
    'excluir_compra':    'Apenas supervisores e admins podem excluir compras.',
    'excluir_lembrete':  'Apenas supervisores e admins podem excluir lembretes.',
    'gerenciar_equipe':  'Apenas supervisores e admins podem gerenciar a equipe.',
    'acessar_config':    'Apenas admins podem acessar as configuracoes.',
    'criar_treinamento': 'Apenas admins podem criar treinamentos.',
    'excluir_usuario':   'Apenas admins podem excluir usuarios.'
  };
  alert(msgs[acao]||'Voce nao tem permissao para esta acao.');
  return false;
}

function buildNav() {
  var nav=document.getElementById('nav'), h='';
  var temLemb=false;
  if(ST.data&&ST.data.lembretes){
    var hj=todayISO();
    for(var x=0;x<ST.data.lembretes.length;x++){
      var lb=ST.data.lembretes[x];
      if(isConcluido(lb.status)) continue;
      var ini=String(lb.dataInicio).slice(0,10);
      var fim=addDays(ini,(Number(lb.duracao)||1)-1);
      if(hj>=ini&&hj<=fim){temLemb=true;break;}
    }
  }
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    if(!Array.isArray(p)){h+='<div class="nav-group">'+p.g+'</div>';continue;}
    var active=(ST.page===p[0])?'nav-item active':'nav-item';
    var dot=(p[0]==='calendario'&&temLemb)?'<span class="nav-dot"></span>':'';
    h+='<div class="'+active+'" id="nav-'+p[0]+'" onclick="goto(\''+p[0]+'\')"><i class="'+p[2]+'"></i>'+p[1]+dot+'</div>';
  }
  nav.innerHTML=h;
}
function pgName(id){for(var i=0;i<PAGES.length;i++){if(Array.isArray(PAGES[i])&&PAGES[i][0]===id)return PAGES[i][1];}return '';}
function goto(p){
  var anterior=ST.page;
  ST.page=p;
  buildNav();
  document.getElementById('ptitle').textContent=pgName(p);
  if(window.innerWidth<=820){
    var sb=document.getElementById('sidebar');
    var ov=document.getElementById('sb-overlay');
    if(sb) sb.classList.remove('open');
    if(ov) ov.style.display='none';
  }
  render();
}
function toggleSb(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('sb-overlay');
  if(!sb) return;
  var open=sb.classList.toggle('open');
  if(ov) ov.style.display=open?'block':'none';
}

  if(ST.page === 'equipe_dp'){ renderEquipeDP(); return; }

    ST.page==='escala'       ?renderEsc()     :
    ST.page==='relatorio'    ?renderRel()     :
    ST.page==='ranking'      ?renderRanking() :
    ST.page==='gastos'       ?renderGastos()  :

function renderKanban(todos) {
  var pord={Urgente:0,Alta:1,Media:2,Baixa:3};
  var cols=[
    {id:'Aberto',    label:'Aberto',       cls:'aberto',    icon:'ti-alert-circle'},
    {id:'Andamento', label:'Em andamento',  cls:'andamento', icon:'ti-player-play'},
    {id:'Concluido', label:'Concluido',     cls:'concluido', icon:'ti-checks'}
  ];
  var html='<div class="kanban">';
  cols.forEach(function(col){
    var itens=todos.filter(function(c){return c.status===col.id;});
    if(col.id==='Concluido'){
      itens.sort(function(a,b){return String(b.concluidoEm||'').localeCompare(String(a.concluidoEm||''));});
      itens=itens.slice(0,100);
    } else {
      itens.sort(function(a,b){return (pord[a.prioridade]||2)-(pord[b.prioridade]||2);});
    }
    html+='<div class="kanban-col">'+
      '<div class="kanban-col-header '+col.cls+'">'+
        '<span><i class="ti '+col.icon+'"></i> '+col.label+'</span>'+
        '<span style="background:rgba(0,0,0,.1);padding:1px 7px;border-radius:8px">'+itens.length+'</span>'+
      '</div>';
    if(!itens.length){
      html+='<div style="text-align:center;color:#6b7770;font-size:12px;padding:20px 0">Nenhum chamado</div>';
    }
    itens.forEach(function(ch){
      var tempo=ch.criadoEm?tempoDecorrido(ch.criadoEm):'';
      html+='<div class="kcard prio-'+esc(ch.prioridade)+'" data-kid="'+ch.id+'" onclick="abrirKcardEl(this)">'+
        '<div class="klocal"><i class="ti ti-door"></i> '+esc(ch.local||'-')+'</div>'+
        '<div class="karea">'+esc(ch.areaTecnica||'')+'</div>'+
        (ch.descricao?'<div class="kdesc">'+esc(ch.descricao)+'</div>':'')+
        '<div class="kmeta">'+
          '<span class="badge p-'+esc(ch.prioridade)+'">'+esc(ch.prioridade)+'</span>'+
          (ch.tecnico?'<span class="ktec"><i class="ti ti-user"></i> '+esc(ch.tecnico)+'</span>':'')+
          (tempo?'<span class="ktime">'+tempo+'</span>':'')+
        '</div>'+
        '<div style="font-size:11px;color:#6b7770;margin-top:5px;line-height:1.5">'+
          (ch.criadoPor?'<span><i class="ti ti-flag" style="font-size:10px"></i> '+esc(ch.criadoPor)+'</span>':'')+
          (ch.concluidoPor?'<span style="margin-left:8px;color:#2D6A4F"><i class="ti ti-check" style="font-size:10px"></i> '+esc(ch.concluidoPor)+'</span>':'')+
        '</div>'+
        (Number(ch.reaberturas||0)>0?'<div style="font-size:11px;background:#fde2e1;color:#c0392b;padding:2px 7px;border-radius:6px;margin-top:4px;display:inline-block"><i class="ti ti-alert-triangle" style="font-size:10px"></i> Reaberto '+ch.reaberturas+'x'+(ch.reabertoPor?' por '+esc(ch.reabertoPor):'')+'</div>':'')+
        '<div class="kacoes" onclick="event.stopPropagation()">'+
          moverBtns(ch)+
        '</div>'+
      '</div>';
    });
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function moverKcard(el){
  if(!reqUser()) return;
  var id=el.getAttribute('data-id');
  var st=el.getAttribute('data-st');
  // Atualizar localmente primeiro para UI instantanea
  var ch=(ST.data.chamados||[]).find(function(x){return x.id===id;});
  if(ch){
    ch.status=st;
    if(st==='Concluido'){ch.concluidoPor=ST.user;ch.concluidoEm=new Date().toISOString();}
    if(st==='Aberto'){ch.concluidoPor=null;ch.concluidoEm=null;}
    render();
  }
  // Salvar no servidor
  var upd={id:id,status:st};
  if(st==='Concluido'){upd.concluidoPor=ST.user;upd.concluidoEm=new Date().toISOString();}
  if(st==='Aberto'){upd.concluidoPor=null;upd.concluidoEm=null;}
  call('updateChamado',upd,null,function(){reload();});
}

function delChEl(el){
  var id=el.getAttribute('data-id');
  delCh(id);
}

function tempoDecorrido(iso){
  if(!iso) return '';
  var diff=Math.floor((new Date()-new Date(iso))/60000);
  if(diff<1) return 'agora';
  if(diff<60) return diff+'min';
  if(diff<1440) return Math.floor(diff/60)+'h';
  return Math.floor(diff/1440)+'d';
}

function limparBuscaCh(){
  var inp=document.getElementById('ch-busca');
  if(inp){inp.value='';renderBuscaCh();}
}
function renderBuscaCh(){
  var inp=document.getElementById('ch-busca');
  var lista=document.getElementById('ch-concl-lista');
  if(!inp||!lista) return;
  var q=(inp.value||'').toLowerCase().trim();
  var todos=(ST.data.chamados||[]).filter(function(c){return isConcluido(c.status);});
  var filtrados=q?todos.filter(function(c){
    return String(c.local||'').toLowerCase().indexOf(q)>=0||
           String(c.areaTecnica||'').toLowerCase().indexOf(q)>=0||
           String(c.descricao||'').toLowerCase().indexOf(q)>=0||
           String(c.criadoPor||'').toLowerCase().indexOf(q)>=0||
           String(c.concluidoPor||'').toLowerCase().indexOf(q)>=0;
  }):todos;
  // Mostrar contagem quando filtrando
  var info=q&&filtrados.length!==todos.length?
    '<div style="padding:8px 12px;background:#e8f5e9;font-size:12px;color:#2D6A4F;border-bottom:1px solid #E0E8E2">'+
      '<i class="ti ti-filter"></i> '+filtrados.length+' resultado(s) para "'+esc(q)+'" de '+todos.length+' concluidos'+
    '</div>':'';
  lista.innerHTML=info+tblChConcluidos(filtrados.slice(0,100));
}

  var projetos=(ST.data.projetos||[]).filter(function(p){return p.ativo==='sim';});
  var projetosAptos=ST.data.projetosAptos||[];
  var aptos=ST.data.apartamentos||[];

  if(!projetos.length){
    return '<div class="card" style="text-align:center;padding:40px;color:#6b7770">'+
      '<i class="ti ti-checklist" style="font-size:48px;display:block;margin-bottom:12px;opacity:.3"></i>'+

      '<div>Acesse Configuracoes para adicionar projetos como "Troca de espelhos", "Reforma sacadas", etc.</div>'+

    }).join('')+
    '</div>'+
  '</div>';

  if(!projSel&&projetos.length) projSel=projetos[0].id;
  var proj=projetos.find(function(p){return p.id===projSel;});
  if(!proj) return sel;

  // Calcular progresso
  var feitosIds=projetosAptos.filter(function(x){return x.projeto_id===projSel&&x.status==='feito';}).map(function(x){return x.apto;});
  var total=aptos.length;
  var feitos=feitosIds.length;
  var pct=total?Math.round(feitos*100/total):0;

  var header='<div class="card" style="margin-bottom:14px">'+
    '<div class="between" style="margin-bottom:10px">'+
      '<div>'+
        '<div style="font-size:16px;font-weight:700;color:#1B4332">'+esc(proj.nome)+'</div>'+
        (proj.descricao?'<div style="font-size:13px;color:#6b7770;margin-top:2px">'+esc(proj.descricao)+'</div>':'')+
      '</div>'+
      '<div style="text-align:right">'+
        '<div style="font-size:22px;font-weight:700;color:'+proj.cor+'">'+feitos+' / '+total+'</div>'+
        '<div style="font-size:12px;color:#6b7770">apartamentos concluidos</div>'+

  var conteudo='';

  }

  render();

function renderAtivGraficos(ativs, regs){
  if(!regs.length) return '<div style="color:#6b7770;padding:20px 0">Nenhum registro ainda.</div>';

  var periodo=ST.ativPeriodo||'diario';
  var hoje=new Date();
  var todayStr=todayISO();

  // Filtrar por periodo
  var regsFilt;
  if(periodo==='diario'){
    regsFilt=regs.filter(function(r){return String(r.feito_em||'').slice(0,10)===todayStr;});
  } else if(periodo==='semanal'){
    var semIni=new Date(hoje); semIni.setDate(hoje.getDate()-hoje.getDay());
    var semIniStr=semIni.getFullYear()+'-'+pad(semIni.getMonth()+1)+'-'+pad(semIni.getDate());
    regsFilt=regs.filter(function(r){return String(r.feito_em||'').slice(0,10)>=semIniStr;});
  } else {
    var mesStr=hoje.getFullYear()+'-'+pad(hoje.getMonth()+1);
    regsFilt=regs.filter(function(r){return String(r.feito_em||'').slice(0,7)===mesStr;});
  }

  var ptabs='<div class="kvtoggle" style="margin-bottom:14px">'+
    '<button class="'+(periodo==='diario'?'active':'')+'" id="ativper-diario" onclick="setAtivPer(this)">Hoje</button>'+
    '<button class="'+(periodo==='semanal'?'active':'')+'" id="ativper-semanal" onclick="setAtivPer(this)">Esta semana</button>'+
    '<button class="'+(periodo==='mensal'?'active':'')+'" id="ativper-mensal" onclick="setAtivPer(this)">Este mes</button>'+
  '</div>';

  if(!regsFilt.length){
    return ptabs+'<div class="card" style="text-align:center;padding:24px;color:#6b7770">Nenhum registro no periodo selecionado.</div>';
  }

  // Gerar grafico por atividade
  var html=ptabs;

  ativs.forEach(function(nm){
    var regsAtiv=regsFilt.filter(function(r){return r.atividade===nm;});
    if(!regsAtiv.length) return;

    // Distribuicao por hora do dia (0-23)
    var horas=new Array(24).fill(0);
    regsAtiv.forEach(function(r){
      try{
        var d=new Date(r.feito_em);
        horas[d.getHours()]++;
      }catch(e){}
    });

    var maxH=Math.max.apply(null,horas)||1;
    var totalReg=regsAtiv.length;

    // Hora mais frequente
    var horaPico=horas.indexOf(Math.max.apply(null,horas));
    var horaPicoStr=pad(horaPico)+'h - '+pad(horaPico+1)+'h';

    html+='<div class="card" style="margin-bottom:14px">'+
      '<div class="between" style="margin-bottom:12px">'+
        '<div>'+
          '<div style="font-weight:700;font-size:14px;color:#1B4332">'+esc(nm)+'</div>'+
          '<div style="font-size:12px;color:#6b7770;margin-top:2px">'+totalReg+' registro(s) &bull; Pico: '+horaPicoStr+'</div>'+
        '</div>'+
        '<div style="font-size:12px;color:#6b7770">por: '+
          [...new Set(regsAtiv.map(function(r){return r.feito_por||'-';}))].join(', ')+
        '</div>'+
      '</div>'+

      // Grafico de barras por hora
      '<div style="display:flex;align-items:flex-end;gap:2px;height:60px;padding:0 2px">'+
      horas.map(function(v,h){
        var pct=maxH>0?Math.round(v*100/maxH):0;
        var temReg=v>0;
        var corBarra=temReg?'#2D6A4F':'#E0E8E2';
        var ehPico=v===Math.max.apply(null,horas)&&v>0;
        if(ehPico) corBarra='#c0392b';
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="'+h+'h: '+v+' registro(s)">'+
          '<div style="width:100%;background:'+corBarra+';height:'+pct+'%;min-height:'+(temReg?'4px':'0')+';border-radius:2px 2px 0 0;transition:.3s"></div>'+
        '</div>';
      }).join('')+
      '</div>'+

      // Eixo X de horas (a cada 4h)
      '<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:9px;color:#6b7770;padding:0 2px">'+
      [0,4,8,12,16,20,23].map(function(h){return '<span>'+pad(h)+'h</span>';}).join('')+
      '</div>'+

      // Lista dos ultimos registros
      (regsAtiv.length?'<div style="margin-top:10px;border-top:1px solid #E0E8E2;padding-top:8px">'+
        regsAtiv.slice(0,5).map(function(r){
          return '<div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7770;padding:2px 0">'+
            '<span style="color:#2D6A4F;font-weight:500">'+esc(r.feito_por||'-')+'</span>'+
            '<span>'+fmtDT(r.feito_em)+'</span>'+
          '</div>';
        }).join('')+
        (regsAtiv.length>5?'<div style="font-size:11px;color:#6b7770;text-align:center;margin-top:4px">+'+( regsAtiv.length-5)+' mais registros</div>':'')+
      '</div>':'')+

    '</div>';
  });

  return html;
}

function ckRef(t){
  var d=new Date();
  if(t==='diario') return todayISO();
  if(t==='semanal'){var dw=d.getDay(),sb=new Date(d);sb.setDate(d.getDate()+(6-dw));return isoD(sb);}
  return isoD(new Date(d.getFullYear(),d.getMonth()+1,0));
}
function ckKey(tipo,ref){return 'ck_'+tipo+'_'+ref;}
function ckLoad(tipo,ref){
  try{return JSON.parse(localStorage.getItem(ckKey(tipo,ref))||'{}');}catch(e){return {};}
}
function ckSalvar(tipo,ref,estado){
  try{localStorage.setItem(ckKey(tipo,ref),JSON.stringify(estado));}catch(e){}
  call('saveChecklistLote',{lista:Object.keys(estado).map(function(id){
    return {tipo:tipo,itemId:id,data:ref,concluido:estado[id].c,
            concluidoPor:estado[id].p||'',concluidoEm:estado[id].t||''};
  })},null,null);
}
function renderCk() {
  var tipos=[['diario','Diario'],['semanal','Semanal'],['mensal','Mensal']];
  var itens=(ST.data.checklistItens||[]).filter(function(i){return i.tipo===ST.ckTab;});
  var ref=ckRef(ST.ckTab);
  var est=ckLoad(ST.ckTab,ref);
  function done(id){return !!(est[id]&&est[id].c);}
  var tot=itens.length, fet=itens.filter(function(i){return done(i.id);}).length;
  var pct=tot?Math.round(fet*100/tot):0;
  return '<div class="ck-tabs">'+tipos.map(function(t){
    var ac=ST.ckTab===t[0]?'active':'';
    return '<button class="'+ac+'" data-tb="'+t[0]+'" onclick="setTbEl(this)">'+t[1]+'</button>';
  }).join('')+'</div>'+
  '<div class="card">'+
  '<div class="progress"><span style="width:'+pct+'%"></span></div>'+
  '<div id="ck-info" style="font-size:12px;color:#6b7770;margin-bottom:9px">'+fet+' de '+tot+' ('+pct+'%) - '+ref+'</div>'+
  (itens.length?itens.map(function(it){
    var d=done(it.id);
    return '<div class="ck-item'+(d?' done':'')+'" data-iid="'+it.id+'">'+
      '<input type="checkbox"'+(d?' checked':'')+' data-ckid="'+it.id+'" onchange="togCkEl(this)">'+
      '<div class="txt">'+esc(it.texto)+'</div>'+
      '<button class="btn sm danger" data-ckid="'+it.id+'" onclick="delCkItemEl(this)"><i class="ti ti-trash"></i></button>'+
    '</div>';
  }).join(''):'<div style="color:#6b7770;padding:9px 0">Sem itens. Adicione abaixo.</div>')+
  '<div class="row" style="margin-top:10px">'+
    '<input id="nck" placeholder="Nova tarefa..." style="flex:1">'+
    '<button class="btn" onclick="addCkItem()"><i class="ti ti-plus"></i> Adicionar</button>'+
  '</div></div>';
}

function addCkItem(){
  var v=document.getElementById('nck').value.trim();
  if(!v)return;
  var it=ST.data.checklistItens.slice();
  it.push({id:Math.random().toString(36).slice(2,9),tipo:ST.ckTab,texto:v});
  ST.data.checklistItens=it;
  call('saveChecklistItens',{itens:it},function(){render();});
}
function delCkItemEl(el){delCkItem(el.getAttribute('data-ckid'));}
function delCkItem(id){
  if(!confirm('Remover?'))return;
  var ref=ckRef(ST.ckTab);
  var est=ckLoad(ST.ckTab,ref);
  delete est[id];
  try{localStorage.setItem(ckKey(ST.ckTab,ref),JSON.stringify(est));}catch(e){}
  var it=ST.data.checklistItens.filter(function(i){return i.id!==id;});
  ST.data.checklistItens=it;
  call('saveChecklistItens',{itens:it},function(){render();});
}
function togCkEl(el){togCk(el.getAttribute('data-ckid'),el.checked);}
function togCk(id,chk){
  if(!reqUser()){
    var cb=document.querySelector('[data-iid="'+id+'"] input');
    if(cb) cb.checked=!chk;
    return;
  }
  var ref=ckRef(ST.ckTab);
  // Ler estado atual do localStorage
  var est=ckLoad(ST.ckTab,ref);
  if(chk){
    est[id]={c:true,p:ST.user,t:new Date().toISOString()};
  } else {
    delete est[id];
  }
  // Salvar de volta no localStorage IMEDIATAMENTE
  try{localStorage.setItem(ckKey(ST.ckTab,ref),JSON.stringify(est));}catch(e){}
  // Atualizar visual sem re-render
  var row=document.querySelector('[data-iid="'+id+'"]');
  if(row) row.classList.toggle('done',chk);
  var itens=ST.data.checklistItens.filter(function(i){return i.tipo===ST.ckTab;});
  var fet=Object.keys(est).filter(function(k){return est[k]&&est[k].c;}).length;
  // Contar apenas itens que existem
  var fet2=itens.filter(function(i){return est[i.id]&&est[i.id].c;}).length;
  var pct=itens.length?Math.round(fet2*100/itens.length):0;
  var pb=document.querySelector('.progress span');
  if(pb) pb.style.width=pct+'%';
  var pi=document.getElementById('ck-info');
  if(pi) pi.textContent=fet2+' de '+itens.length+' ('+pct+'%) - '+ref;
  // Salvar no servidor em background (nao bloqueia UI)
  call('saveChecklistLote',{lista:Object.keys(est).map(function(k){
    return {tipo:ST.ckTab,itemId:k,data:ref,concluido:est[k].c,
            concluidoPor:est[k].p||'',concluidoEm:est[k].t||''};
  })},null,null);
}

function renderCal() {
  var y=ST.calY,m=ST.calM,ld=new Date(y,m+1,0).getDate(),sd=new Date(y,m,1).getDay(),ts=todayISO();
  var cells=[];
  for(var i=0;i<sd;i++){var dd=new Date(y,m,-(sd-1-i));cells.push({d:dd,out:true});}
  for(var j=1;j<=ld;j++) cells.push({d:new Date(y,m,j),out:false});
  while(cells.length%7) cells.push({d:new Date(y,m,ld+(cells.length-(sd+ld)+1)),out:true});
  var lb=ST.data.lembretes||[];
  var g=DIAS.map(function(n){return '<div class="cal-dn">'+n+'</div>';}).join('')+
    cells.map(function(c){
      var iso=isoD(c.d);
      var lbs=lb.filter(function(l){if(isConcluido(l.status))return false;var ini=String(l.dataInicio).slice(0,10),fim=addDays(ini,(Number(l.duracao)||1)-1);return iso>=ini&&iso<=fim;});
      return '<div class="cal-day'+(c.out?' out':'')+(iso===ts?' today':'')+'" onclick="verDia(\''+iso+'\')">'+c.d.getDate()+lbs.map(function(l){return '<div class="lb-mini '+esc(l.cor)+'">'+esc(l.texto)+'</div>';}).join('')+'</div>';
    }).join('');
  var lbm=lb.filter(function(l){var ini=new Date(String(l.dataInicio).slice(0,10));var fim=new Date(addDays(String(l.dataInicio).slice(0,10),(Number(l.duracao)||1)-1));return !(fim<new Date(y,m,1)||ini>new Date(y,m,ld));});
  var calTab=ST.calTab||'calendario';
  var tabHtml='<div class="kvtoggle" style="margin-bottom:12px">'+
    '<button class="'+(calTab==='calendario'?'active':'')+' " id="caltb-calendario" onclick="setCalTab(this)"><i class="ti ti-calendar"></i> Calendario</button>'+
    '<button class="'+(calTab==='lembretes'?'active':'')+'" id="caltb-lembretes" onclick="setCalTab(this)"><i class="ti ti-bell"></i> Lembretes</button>'+
  '</div>';
  if(calTab==='lembretes'){
    return tabHtml+renderLemb();
  }
  return tabHtml+
    '<div class="cal-hdr"><button class="btn sec sm" onclick="calNav(-1)"><i class="ti ti-chevron-left"></i></button><h3 style="color:#1B4332">'+MESES[m]+' '+y+'</h3><button class="btn sec sm" onclick="calNav(1)"><i class="ti ti-chevron-right"></i></button></div>'+
    '<div class="cal-grid">'+g+'</div>'+
    '<div class="section"><h3 class="titulo">Lembretes deste mes</h3>'+
    (lbm.length?lbm.map(function(l){return '<div class="ck-item"><span class="lb-mini '+esc(l.cor)+'" style="width:16px;height:16px;border-radius:3px;border:none;background:#eee;flex-shrink:0"></span><div class="txt"><strong>'+esc(l.texto)+'</strong><div style="color:#6b7770;font-size:12px">'+String(l.dataInicio).slice(0,10)+' - '+l.duracao+' dia(s)'+(isConcluido(l.status)?' - concluido':'')+'</div></div></div>';}).join(''):'<div style="color:#6b7770">Sem lembretes.</div>')+
    '</div>';
}
function setCalTab(el){
  var id=el.id||'';
  ST.calTab=id.indexOf('lembretes')>=0?'lembretes':'calendario';
  render();
}
function calNav(n){var m=ST.calM+n,y=ST.calY;if(m<0){m=11;y--;}if(m>11){m=0;y++;}ST.calM=m;ST.calY=y;render();}
function verDia(iso){var lbs=(ST.data.lembretes||[]).filter(function(l){if(isConcluido(l.status))return false;var ini=String(l.dataInicio).slice(0,10),fim=addDays(ini,(Number(l.duracao)||1)-1);return iso>=ini&&iso<=fim;});if(!lbs.length)return;openModal('Lembretes em '+iso,lbs.map(function(l){return '<div class="ck-item"><div class="txt"><strong>'+esc(l.texto)+'</strong></div></div>';}).join(''),[{l:'Fechar',c:'sec',f:closeModal}]);}

function enviarPedido(){
  var forn=(ST.data.config&&ST.data.config.fornecedores)||[];
  var fid=document.getElementById('cp-forn-sel').value;
  if(!fid){alert('Escolha um fornecedor antes de enviar.');return;}
  var f=forn.find(function(x){return x.id===fid;});
  if(!f){alert('Fornecedor nao encontrado.');return;}
  if(!f.whatsapp){alert('Este fornecedor nao tem WhatsApp cadastrado.');return;}

  // Pegar itens selecionados
  var sels=document.querySelectorAll('.cp-sel:checked');
  if(!sels.length){alert('Selecione pelo menos um item para enviar.');return;}

  var ids=[], itens=[];
  sels.forEach(function(cb){
    var id=cb.getAttribute('data-cpid');
    ids.push(id);
    var item=(ST.data.compras||[]).find(function(c){return c.id===id;});
    if(item) itens.push(item);
  });

  if(!itens.length) return;

  // Montar mensagem
  var hoje=new Date().toLocaleDateString('pt-BR');
  var linhas=['*Pedido - Laghetto Pedras Altas*','Data: '+hoje,''];
  linhas.push('*Itens solicitados:*');
  itens.forEach(function(item,i){
    var linha=(i+1)+'. '+item.nome;
    if(item.quantidade>1) linha+=' (Qtd: '+item.quantidade+')';
    if(item.obs) linha+=' - '+item.obs;
    linhas.push(linha);
  });
  linhas.push('');
  linhas.push('Aguardamos retorno. Obrigado!');
  var msg=linhas.join(String.fromCharCode(10));

  // Abrir WhatsApp
  var wpp=f.whatsapp.replace(/[^0-9]/g,'');
  window.open('https://wa.me/'+wpp+'?text='+encodeURIComponent(msg),'_blank');

  // Dar baixa nos itens selecionados
  if(confirm('Marcar os '+itens.length+' item(s) como Comprado?')){
    var done=0;
    ids.forEach(function(id){
      call('updateCompraStatus',{id:id,status:'Comprado'},function(){
        done++;
        if(done===ids.length) reload();
      });
    });
  }
}

function abrirEqForm(id){
  var eq=ST.data.equipe||[], ed=null;
  for(var i=0;i<eq.length;i++){if(eq[i].id===id){ed=eq[i];break;}}
  var m=ed||{nome:'',cargo:'',turno:'manha',diasFolga:[],domingosFolga:[],status:'ativo'};
  var dh=DIAS.map(function(d,i){return '<label><input type="checkbox" data-dia="'+i+'"'+((m.diasFolga||[]).indexOf(i)>=0?' checked':'')+'>'+d+'</label>';}).join('');
  var dmh=[1,2,3,4,5].map(function(n){return '<label><input type="checkbox" data-dom="'+n+'"'+((m.domingosFolga||[]).indexOf(n)>=0?' checked':'')+'>'+n+'o</label>';}).join('');
  openModal(ed?'Editar colaborador':'Novo colaborador',
    '<div class="form-grid"><div><label>Nome</label><input id="en" value="'+esc(m.nome||'')+'"></div><div><label>Cargo</label><input id="ec" value="'+esc(m.cargo||'')+'"></div>'+
    '<div><label>Turno</label><select id="et">'+['manha','tarde','noite'].map(function(t){return '<option'+(m.turno===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div></div>'+
    '<div style="margin-top:10px"><label>Dias fixos de folga</label><div class="ds">'+dh+'</div></div>'+
    '<div style="margin-top:10px"><label>Domingos do mes</label><div class="ds">'+dmh+'</div></div>',
    [{l:'Cancelar',c:'sec',f:closeModal},{l:'Salvar',c:'',f:function(){
      var n=document.getElementById('en').value.trim();if(!n){alert('Informe o nome');return;}
      var dias=[],doms=[];
      document.querySelectorAll('[data-dia]').forEach(function(el){if(el.checked)dias.push(Number(el.getAttribute('data-dia')));});
      document.querySelectorAll('[data-dom]').forEach(function(el){if(el.checked)doms.push(Number(el.getAttribute('data-dom')));});
      var novo={id:ed?ed.id:'',nome:n,cargo:document.getElementById('ec').value,turno:document.getElementById('et').value,diasFolga:dias,domingosFolga:doms,status:'ativo'};
      var lista=ST.data.equipe.slice();
      if(ed){lista=lista.map(function(x){return x.id===ed.id?Object.assign({},x,novo):x;});}else{lista.push(novo);}
      call('saveEquipe',{lista:lista},function(){closeModal();reload();});
    }}]);
}
function delColab(id){if(!confirm('Excluir?'))return;call('saveEquipe',{lista:ST.data.equipe.filter(function(x){return x.id!==id;})},reload);}

function renderEsc() {
  // Abas: Equipe | Escala
  var escTab=ST.escTab||'escala';
  var tabHtml='<div class="kvtoggle" style="margin-bottom:14px">'+
    '<button class="'+(escTab==='equipe'?'active':'')+'" id="esctb-equipe" onclick="setEscTab(this)"><i class="ti ti-users"></i> Equipe</button>'+
    '<button class="'+(escTab==='escala'?'active':'')+'" id="esctb-escala" onclick="setEscTab(this)"><i class="ti ti-calendar-event"></i> Escala de Folga</button>'+
  '</div>';
  if(escTab==='equipe') return tabHtml+renderEqConteudo();
  return tabHtml+renderEscConteudo();
}
function setEscTab(el){
  var id=el.id||'';
  ST.escTab=id.indexOf('equipe')>=0?'equipe':'escala';
  render();
}
function renderEscConteudo() {
  var y=ST.escY,m=ST.escM,nd=new Date(y,m+1,0).getDate(),eq=ST.data.equipe||[];
  var h='<div class="cal-hdr"><button class="btn sec sm" onclick="escNav(-1)"><i class="ti ti-chevron-left"></i></button><h3 style="color:#1B4332">'+MESES[m]+' '+y+'</h3><button class="btn sec sm" onclick="escNav(1)"><i class="ti ti-chevron-right"></i></button></div>';
  h+='<div class="between" style="margin-bottom:9px">'+
    '<div style="font-size:12px;color:#6b7770">Ordenado por turno.</div>'+
    '<button class="btn sec sm" onclick="imprimirEscala()"><i class="ti ti-printer"></i> Imprimir</button>'+
    '</div>';
  if(!eq.length) return h+'<div class="card" style="color:#6b7770">Cadastre a equipe primeiro.</div>';
  var eqOrd=eq.slice().sort(function(a,b){var ta={manha:0,tarde:1,noite:2};return (ta[a.turno]!=null?ta[a.turno]:9)-(ta[b.turno]!=null?ta[b.turno]:9)||String(a.nome).localeCompare(String(b.nome));});
  h+='<div class="esc-wrap"><table class="esc-tbl"><thead><tr><th class="nc">Colaborador</th>';
  for(var d=1;d<=nd;d++){
    var dw=new Date(y,m,d).getDay();
    h+='<th'+(dw===0||dw===6?' class="we"':'')+'>'+d+'<br><span style="font-size:9px;font-weight:400;color:#6b7770">'+DIAS[dw]+'</span></th>';
  }
  h+='</tr></thead><tbody>';
  var ta='';
  eqOrd.forEach(function(c){
    var turno=c.turno||'manha', tc=turno==='manha'?'rm':turno==='tarde'?'rt':'rn';
    if(turno!==ta){
      if(ta!=='') h+='<tr><td colspan="'+(nd+1)+'" style="height:2px;background:#E0E8E2;padding:0"></td></tr>';
      h+='<tr><td colspan="'+(nd+1)+'" style="padding:4px 10px;font-weight:700;font-size:11px;text-transform:uppercase;background:#f5f7f5;color:#1B4332;letter-spacing:.5px">'+turno+'</td></tr>';
      ta=turno;
    }
    h+='<tr><td class="nc '+tc+'">'+esc(c.nome||'')+'<div style="font-size:10px;color:#6b7770">'+esc(c.cargo||'')+'</div></td>';
    for(var dd=1;dd<=nd;dd++){
      var dw=new Date(y,m,dd).getDay(), fd=c.diasFolga||[], fm=c.domingosFolga||[];
      var folga=fd.indexOf(dw)>=0||(dw===0&&fm.length&&fm.indexOf(Math.ceil(dd/7))>=0);
      h+='<td><div class="cell '+(folga?'F':'T')+'">'+(folga?'F':'T')+'</div></td>';
    }
    h+='</tr>';
  });
  h+='</tbody></table></div><div style="margin-top:8px;font-size:12px;color:#6b7770">T = Trabalho | F = Folga</div>';
  return h;
}
function imprimirEscala(){
  var conteudo=document.getElementById('content').innerHTML;
  var win=window.open('','_blank');
  win.document.write('<html><head><title>Escala de Folga</title>'+
    '<style>body{font-family:sans-serif;font-size:12px}'+
    '.esc-wrap{overflow-x:auto}.esc-tbl{border-collapse:collapse;width:100%}'+
    '.esc-tbl th,.esc-tbl td{border:1px solid #ccc;padding:4px 6px;text-align:center}'+
    '.esc-tbl th{background:#f0f0f0;font-weight:600}'+
    '.esc-tbl th.nc,.esc-tbl td.nc{text-align:left;min-width:130px;position:static}'+
    '.cell.T{background:#cfe8d9}.cell.F{background:#fde2cf}'+
    '.cell{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:600;margin:auto}'+
    '.th.we{background:#eef2ee}'+
    '@media print{button{display:none}}'+
    '</style></head><body>'+conteudo+'</body></html>');
  win.document.close();
  win.print();
}
function escNav(n){var m=ST.escM+n,y=ST.escY;if(m<0){m=11;y--;}if(m>11){m=0;y++;}ST.escM=m;ST.escY=y;render();}

function renderRel() {
  var y=ST.relY, m=ST.relM;
  var mi=y+'-'+pad(m+1)+'-01', mf=y+'-'+pad(m+1)+'-'+pad(new Date(y,m+1,0).getDate());
  var mesNome=MESES[m]+' '+y;
  function nm(iso){var s=String(iso||'').slice(0,10);return s>=mi&&s<=mf;}
  var ch=ST.data.chamados||[];
  var ab=ch.filter(function(x){return nm(x.criadoEm);});
  var co=ch.filter(function(x){return x.status==='Concluido'&&nm(x.concluidoEm);});
  var tx=ab.length?Math.round(co.length*100/ab.length):0;
  var am=(ST.data.registrosAtividades||[]).filter(function(r){return nm(r.feito_em);});
  var cpm=(ST.data.compras||[]).filter(function(x){return nm(x.solicitado_em);});
  var cok=(ST.data.compras||[]).filter(function(x){return x.status==='Comprado'&&nm(x.comprado_em);});
  var anos2=[]; for(var i=new Date().getFullYear()-2;i<=new Date().getFullYear()+1;i++) anos2.push(i);

  var relTab=ST.relTab||'resumo';
  var tabsHtml='<div class="kvtoggle" style="margin-bottom:16px">'+
    '<button class="'+(relTab==='resumo'?'active':'')+'" id="reltb-resumo" onclick="setRelTab(this)"><i class="ti ti-layout-dashboard"></i> Resumo</button>'+
    '<button class="'+(relTab==='detalhes'?'active':'')+'" id="reltb-detalhes" onclick="setRelTab(this)"><i class="ti ti-table"></i> Todos os chamados</button>'+
  '</div>';

  if(relTab==='detalhes') return tabsHtml+renderRelDetalhes(ch,mi,mf,mesNome);

  // ---- CABECALHO ----
  var header='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">'+
    '<div>'+
      '<div style="font-size:11px;color:#6b7770;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">Laghetto Pedras Altas</div>'+
      '<div style="font-size:20px;font-weight:600;color:#1B4332;">Relatorio de manutencao</div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
      '<select onchange="ST.relM=Number(this.value);render()" style="font-size:13px;padding:6px 10px">'+
        MESES.map(function(n,i){return '<option value="'+i+'"'+(i===m?' selected':'')+'>'+n+'</option>';}).join('')+
      '</select>'+
      '<select onchange="ST.relY=Number(this.value);render()" style="font-size:13px;padding:6px 10px">'+
        anos2.map(function(a){return '<option'+(a===y?' selected':'')+'>'+a+'</option>';}).join('')+
      '</select>'+
      '<button class="btn sec sm" onclick="gerarRelatorioHTML()"><i class="ti ti-file-download"></i> Baixar PDF</button>'+
      '<button class="btn sec sm" onclick="baixarCSVDetalhado()"><i class="ti ti-file-spreadsheet"></i> CSV</button>'+
    '</div>'+
  '</div>';

  // ---- RESUMO EXECUTIVO ----
  // Tempo medio de resolucao
  var tmTotal=0,tmCount=0;
  co.forEach(function(x){
    if(x.criadoEm&&x.concluidoEm){var d=(new Date(x.concluidoEm)-new Date(x.criadoEm))/60000;if(d>0&&d<43200){tmTotal+=d;tmCount++;}}
  });
  var tmMedStr=tmCount?fmtTempo(tmTotal/tmCount):'-';
  var totalReab=ab.reduce(function(s,x){return s+Number(x.reaberturas||0);},0);
  var urgentes=ab.filter(function(x){return x.prioridade==='Urgente';}).length;

  var resumo='<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#6b7770;margin-bottom:10px;">Resumo executivo</div>'+
    '<div class="grid cards-resumo" style="margin-bottom:20px">'+
      crdRel('Chamados abertos',ab.length,'','ti-clipboard-list')+
      crdRel('Concluidos',co.length,'ok','ti-checks')+
      crdRel('Taxa de conclusao',tx+'%',tx>=80?'ok':tx>=50?'alerta':'danger','ti-percentage')+
      crdRel('Tempo medio',tmMedStr,'','ti-clock')+
      crdRel('Reaberturas',totalReab,totalReab>0?'danger':'ok','ti-rotate')+
      crdRel('Urgentes',urgentes,urgentes>0?'alerta':'ok','ti-alert-triangle')+
      crdRel('Atividades',am.length,'','ti-repeat')+
      crdRel('Compras',cpm.length,'','ti-shopping-cart')+
    '</div>';

  // ---- DESEMPENHO ----
  var porArea={},porPrio={Urgente:0,Alta:0,Media:0,Baixa:0};
  ab.forEach(function(x){
    var k=x.areaTecnica||'-';porArea[k]=(porArea[k]||0)+1;
    if(porPrio[x.prioridade]!==undefined)porPrio[x.prioridade]++;
  });
  var areaKeys=Object.keys(porArea).sort(function(a,b){return porArea[b]-porArea[a];});
  var maxArea=areaKeys.length?porArea[areaKeys[0]]:1;
  var prioColors={Urgente:'var(--c-danger,#c0392b)',Alta:'#e67e22',Media:'#2D6A4F',Baixa:'#3498db'};

  var desempenho='<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#6b7770;margin-bottom:10px;">Desempenho de chamados</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">'+
      '<div class="card">'+
        '<div style="font-size:13px;font-weight:600;margin-bottom:14px;color:#1B4332">Por area tecnica</div>'+
        (areaKeys.length?areaKeys.slice(0,6).map(function(k){
          var pct=Math.round(porArea[k]*100/maxArea);
          return '<div style="margin-bottom:10px">'+
            '<div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7770;margin-bottom:4px"><span>'+esc(k)+'</span><span style="font-weight:600;color:#1B4332">'+porArea[k]+'</span></div>'+
            '<div style="height:6px;background:#E0E8E2;border-radius:4px"><div style="height:100%;width:'+pct+'%;background:#185FA5;border-radius:4px"></div></div>'+
          '</div>';
        }).join(''):'<div style="color:#6b7770;font-size:13px">Sem dados.</div>')+
      '</div>'+
      '<div class="card">'+
        '<div style="font-size:13px;font-weight:600;margin-bottom:14px;color:#1B4332">Por prioridade</div>'+
        ['Urgente','Alta','Media','Baixa'].map(function(p){
          var tot=ab.length||1;
          var pct=Math.round(porPrio[p]*100/tot);
          return '<div style="margin-bottom:10px">'+
            '<div style="display:flex;justify-content:space-between;font-size:12px;color:#6b7770;margin-bottom:4px"><span>'+p+'</span><span style="font-weight:600;color:#1B4332">'+porPrio[p]+'</span></div>'+
            '<div style="height:6px;background:#E0E8E2;border-radius:4px"><div style="height:100%;width:'+pct+'%;background:'+prioColors[p]+';border-radius:4px"></div></div>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>';

  // ---- EQUIPE ----
  var tempos={};
  co.forEach(function(x){
    if(!x.concluidoPor||!x.criadoEm||!x.concluidoEm)return;
    var d=(new Date(x.concluidoEm)-new Date(x.criadoEm))/60000;
    if(d<0||d>43200)return;
    var k=x.concluidoPor;
    if(!tempos[k])tempos[k]={qtd:0,total:0,reab:0};
    tempos[k].qtd++;tempos[k].total+=d;
  });
  ab.forEach(function(x){
    if(Number(x.reaberturas||0)>0&&x.concluidoPor){
      if(!tempos[x.concluidoPor])tempos[x.concluidoPor]={qtd:0,total:0,reab:0};
      tempos[x.concluidoPor].reab+=Number(x.reaberturas||0);
    }
  });
  var tecRows=Object.keys(tempos).map(function(k){return {nome:k,qtd:tempos[k].qtd,media:tempos[k].qtd?tempos[k].total/tempos[k].qtd:0,reab:tempos[k].reab};}).sort(function(a,b){return b.qtd-a.qtd;});

  var equipe='<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#6b7770;margin-bottom:10px;">Equipe</div>'+
    '<div class="card" style="padding:0;overflow:hidden;margin-bottom:20px">'+
    (tecRows.length?
      '<table class="cht"><thead><tr>'+
        '<th>Tecnico</th><th style="text-align:center">Concluidos</th><th style="text-align:center">Tempo medio</th><th style="text-align:center">Reaberturas</th>'+
      '</tr></thead><tbody>'+
      tecRows.map(function(t){
        return '<tr>'+
          '<td><strong>'+esc(t.nome)+'</strong></td>'+
          '<td style="text-align:center;color:#2D6A4F;font-weight:600">'+t.qtd+'</td>'+
          '<td style="text-align:center;color:#6b7770">'+fmtTempo(t.media)+'</td>'+
          '<td style="text-align:center;color:'+(t.reab>0?'#c0392b':'#6b7770')+';font-weight:'+(t.reab>0?'600':'400')+'">'+t.reab+'</td>'+
        '</tr>';
      }).join('')+'</tbody></table>':
      '<div style="padding:16px;color:#6b7770">Sem dados no periodo.</div>')+
    '</div>';

  // ---- RANKINGS ----
  var aptRank={};
  ab.forEach(function(x){if(x.tipoLocal==='apartamento'&&x.local){var k=String(x.local);aptRank[k]=(aptRank[k]||0)+1;}});
  var aptTop=Object.keys(aptRank).map(function(k){return {nome:k,total:aptRank[k]};}).sort(function(a,b){return b.total-a.total;}).slice(0,10);
  var maxApt=aptTop.length?aptTop[0].total:1;

  // Reincidencia
  var reincid=aptTop.filter(function(x){return x.total>=2;}).slice(0,5);

  var rankings='<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#6b7770;margin-bottom:10px;">Rankings do mes</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">'+
      '<div class="card">'+
        '<div style="font-size:13px;font-weight:600;margin-bottom:14px;color:#1B4332">Top 10 apartamentos</div>'+
        (aptTop.length?aptTop.map(function(x,i){
          var pct=Math.round(x.total*100/maxApt);
          var cor=i===0?'#c0392b':i===1?'#e67e22':i===2?'#888780':'#2D6A4F';
          return '<div style="display:grid;grid-template-columns:20px 1fr 28px;align-items:center;gap:8px;margin-bottom:9px">'+
            '<span style="font-size:12px;font-weight:600;color:'+cor+'">'+(i+1)+'</span>'+
            '<div>'+
              '<div style="font-size:12px;font-weight:600;color:#1B4332;margin-bottom:3px">Apto '+esc(x.nome)+'</div>'+
              '<div style="height:4px;background:#E0E8E2;border-radius:2px"><div style="height:100%;width:'+pct+'%;background:'+cor+';border-radius:2px"></div></div>'+
            '</div>'+
            '<span style="font-size:12px;font-weight:600;text-align:right;color:'+cor+'">'+x.total+'</span>'+
          '</div>';
        }).join(''):'<div style="color:#6b7770;font-size:13px">Sem chamados em apartamentos.</div>')+
      '</div>'+
      '<div class="card">'+
        '<div style="font-size:13px;font-weight:600;margin-bottom:14px;color:#1B4332">Reincidencia  atencao</div>'+
        (reincid.length?reincid.map(function(x){
          var cor=x.total>=6?'#c0392b':x.total>=4?'#e67e22':'#a06000';
          var bg=x.total>=6?'#fde2e1':x.total>=4?'#fff4e1':'#fff8e1';
          return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:'+bg+';border-radius:8px;margin-bottom:7px">'+
            '<div>'+
              '<div style="font-size:12px;font-weight:600;color:'+cor+'">Apto '+esc(x.nome)+'</div>'+
            '</div>'+
            '<span style="font-size:15px;font-weight:700;color:'+cor+'">'+x.total+'x</span>'+
          '</div>';
        }).join(''):'<div style="color:#6b7770;font-size:13px;padding:8px 0">Nenhum apartamento com reincidencia no periodo.</div>')+
      '</div>'+
    '</div>';

  // ---- HORARIO DE PICO ----
  var horas=new Array(24).fill(0);
  ab.forEach(function(x){try{var h=new Date(x.criadoEm).getHours();horas[h]++;}catch(e){}});
  var maxH=Math.max.apply(null,horas)||1;
  var picoH=horas.indexOf(Math.max.apply(null,horas));

  var horario='<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#6b7770;margin-bottom:10px;">Horario de abertura de chamados</div>'+
    '<div class="card" style="margin-bottom:20px">'+
      '<div style="display:flex;align-items:flex-end;gap:3px;height:70px">'+
      horas.map(function(v,h){
        var pct=Math.round(v*100/maxH);
        var cor=h===picoH&&v>0?'#c0392b':v>0?'#185FA5':'#E0E8E2';
        return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="'+pad(h)+'h: '+v+'">'+
          '<div style="width:100%;background:'+cor+';height:'+(pct||0)+'%;min-height:'+(v>0?'3px':'0')+';border-radius:2px 2px 0 0"></div>'+
        '</div>';
      }).join('')+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:#6b7770">'+
        [0,3,6,9,12,15,18,21,23].map(function(h){return '<span>'+pad(h)+'h</span>';}).join('')+
      '</div>'+
      '<div style="margin-top:10px;font-size:12px;color:#6b7770">'+
        'Pico: <strong style="color:#c0392b">'+pad(picoH)+'h &ndash; '+pad(picoH+1)+'h</strong> ('+horas[picoH]+' chamados)'+
      '</div>'+
    '</div>';

  // ---- GASTOS ----
  var gastosData=ST.data.gastos||[];
  var lancsData=ST.data.lancamentos||[];
  var mesKey=y+'-'+pad(m+1);
  var gastoMes=gastosData.find(function(g){return g.mes===mesKey;})||{orcamento:0};
  var lancsMes=lancsData.filter(function(l){return l.mes===mesKey;});
  var orcamento=Number(gastoMes.orcamento||0);
  var totalGasto=lancsMes.reduce(function(s,l){return s+Number(l.valor||0);},0);
  var saldo=orcamento-totalGasto;
  var pctGasto=orcamento>0?Math.min(100,Math.round(totalGasto*100/orcamento)):0;
  var corGasto=pctGasto>=100?'#c0392b':pctGasto>=80?'#e67e22':'#185FA5';
  function fmtR(v){return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
  var cats={};
  lancsMes.forEach(function(l){var k=l.categoria||'Outros';cats[k]=(cats[k]||0)+Number(l.valor||0);});

  var gastos='<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#6b7770;margin-bottom:10px;">Controle de gastos</div>'+
    '<div class="card">'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px">'+
        '<div><div style="font-size:11px;color:#6b7770;margin-bottom:4px">Orcamento</div><div style="font-size:20px;font-weight:700;color:#1B4332">'+(orcamento?fmtR(orcamento):'Nao definido')+'</div></div>'+
        '<div><div style="font-size:11px;color:#6b7770;margin-bottom:4px">Total gasto</div><div style="font-size:20px;font-weight:700;color:'+(pctGasto>=80?'#c0392b':'#2D6A4F')+'">'+fmtR(totalGasto)+'</div></div>'+
        '<div><div style="font-size:11px;color:#6b7770;margin-bottom:4px">Saldo</div><div style="font-size:20px;font-weight:700;color:'+(saldo<0?'#c0392b':'#2D6A4F')+'">'+fmtR(saldo)+'</div></div>'+
      '</div>'+
      '<div style="height:10px;background:#E0E8E2;border-radius:6px;overflow:hidden;margin-bottom:6px">'+
        '<div style="height:100%;width:'+pctGasto+'%;background:'+corGasto+';border-radius:6px;transition:.3s"></div>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:#6b7770;margin-bottom:'+(Object.keys(cats).length?'12px':'0')+'">'+
        '<span>0%</span><span style="color:'+corGasto+';font-weight:600">'+pctGasto+'% utilizado</span><span>100%</span>'+
      '</div>'+
      (Object.keys(cats).length?
        '<div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid #E0E8E2">'+
        Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];}).map(function(k){
          return '<span style="background:#eef4ef;color:#1B4332;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:600">'+esc(k)+': '+fmtR(cats[k])+'</span>';
        }).join('')+
        '</div>':'')+
    '</div>';

  return tabsHtml+header+resumo+desempenho+equipe+rankings+horario+gastos;
}

function crdRel(t,v,tipo,icon){
  var cor=tipo==='ok'?'#2D6A4F':tipo==='alerta'?'#e67e22':tipo==='danger'?'#c0392b':'#1B4332';
  return '<div class="card">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
